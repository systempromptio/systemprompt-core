[package]
name = "systemprompt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Self-hosted AI governance infrastructure. The Rust library behind systemprompt.io: MCP-native tool-call governance, 6-tier RBAC, secret detection, full audit trails, SIEM-ready events. Provider-agnostic across Anthropic, OpenAI, Gemini, and local models. PostgreSQL, air-gap capable, BSL-1.1."
readme = "README.md"

[lints]
workspace = true

[features]
default = ["core"]

# Core functionality - traits, models, wire codecs, services manifest, extension framework
core = [
    "dep:systemprompt-traits",
    "dep:systemprompt-models",
    "dep:systemprompt-wire",
    "dep:systemprompt-manifest",
    "dep:systemprompt-identifiers",
    "dep:systemprompt-extension",
    "dep:systemprompt-template-provider",
]

# Database support
database = ["dep:systemprompt-database", "dep:sqlx", "systemprompt-extension?/sqlx"]

# Profile/secrets configuration loaders
config = ["dep:systemprompt-config"]

# MCP support (uses rmcp-macros from rmcp crate)
mcp = ["dep:rmcp"]

# API server functionality
api = [
    "core",
    "database",
    "dep:systemprompt-api",
    "dep:systemprompt-gateway",
    "dep:systemprompt-runtime",
    "dep:systemprompt-mcp-host",
    "dep:systemprompt-oauth-issuance",
    "dep:systemprompt-gateway-entry",
    "dep:systemprompt-identity-entry",
    "dep:axum",
    "systemprompt-extension?/router",
    "systemprompt-slack-entry?/http",
    "systemprompt-teams-entry?/http",
    "systemprompt-agent-runs-entry?/http",
    "systemprompt-notifications-entry?/http",
    "systemprompt-content-entry?/http",
    "systemprompt-analytics-entry?/http",
    "systemprompt-marketplace-entry?/http",
    "systemprompt-files-entry?/http",
    "systemprompt-mcp-entry?/http",
    "systemprompt-agent-entry?/http",
    "systemprompt-brain-entry?/http",
    "systemprompt-gateway-entry/http",
    "systemprompt-identity-entry/http",
]

# Cloud infrastructure (API client, credentials, OAuth)
cloud = ["dep:systemprompt-cloud", "dep:systemprompt-cloud-entry"]

# Granular infrastructure features (also bundled in `full`)
logging = ["dep:systemprompt-logging"]
loader = ["dep:systemprompt-loader"]
events = ["dep:systemprompt-events"]
storage = ["dep:systemprompt-storage"]
client = ["dep:systemprompt-client"]
security = ["dep:systemprompt-security", "dep:systemprompt-governance"]

# CLI entry point for product binaries (standalone, use 'full' for everything)
cli = ["config", "dep:systemprompt-cli", "dep:systemprompt-extension", "systemprompt-extension/cli", "systemprompt-cloud-entry?/cli", "systemprompt-content-entry?/cli", "systemprompt-analytics-entry?/cli", "systemprompt-marketplace-entry?/cli", "systemprompt-files-entry?/cli", "systemprompt-issues?/cli", "systemprompt-mcp-entry?/cli", "systemprompt-agent-entry?/cli"]

# Runtime builder for embedding systemprompt as a library
runtime = ["cli", "dep:systemprompt-extension"]

# Granular access to the analytics domain for consumers that need request /
# cost metrics without pulling the whole product surface — a server-rendered
# admin extension, say. `full` implies it.
analytics = ["dep:systemprompt-analytics", "dep:systemprompt-analytics-entry"]

# The content capability: the domain crate with its routes and commands from
# `systemprompt-content-entry` (served when `api` / `cli` are also enabled).
# `full` implies it.
content = ["dep:systemprompt-content", "dep:systemprompt-content-entry", "systemprompt-analytics-entry?/content-commands"]

# The marketplace capability: plugins, skills and managed resources, with its
# routes and commands from `systemprompt-marketplace-entry`. `full` implies it.
marketplace = ["dep:systemprompt-marketplace", "dep:systemprompt-marketplace-entry"]

# The files capability: the domain crate with its routes and commands from
# `systemprompt-files-entry`. `full` implies it.
files = ["dep:systemprompt-files", "dep:systemprompt-files-entry", "dep:systemprompt-documents"]

# The hosted MCP capability: the domain crate with its routes and commands
# from `systemprompt-mcp-entry`. `full` implies it.
mcp-servers = ["dep:systemprompt-mcp", "dep:systemprompt-mcp-entry"]

# The agent capability: the domain crate with its A2A routes and commands
# from `systemprompt-agent-entry`. `full` implies it.
agents = ["dep:systemprompt-agent", "dep:systemprompt-agent-entry"]

# Slack integration: the domain crate and the `/api/v1/slack` inbound routes
# (Events API, slash commands, interactivity). Opt-in: excluded from `default`
# and `full`.
slack = ["dep:systemprompt-slack", "dep:systemprompt-slack-entry", "systemprompt-extension?/slack"]

# Microsoft Teams integration: the domain crate and the `/api/v1/teams`
# Bot Framework activity routes. Opt-in: excluded from `default` and `full`.
teams = ["dep:systemprompt-teams", "dep:systemprompt-teams-entry", "systemprompt-extension?/teams"]

# Headless coding-agent executor (Claude Code, Codex CLI runs with a leased
# claim queue): the domain crate, the `/api/v1/agent-runs` routes and the agent
# run launcher wired into hosted agents. `full` implies it.
agent-runs = ["dep:systemprompt-agent-runs", "dep:systemprompt-agent-runs-entry"]

# OpenTelemetry: the gateway's OTLP/HTTP ingest routes and the `otlp_export`
# job that ships the audit trail to a collector. `full` implies it.
otel = ["systemprompt-api?/otel", "systemprompt-scheduler?/otel", "systemprompt-gateway-entry?/otel"]

# The device-credential consumer surface the bridge reports installation
# evidence through. `full` implies it.
bridge = ["systemprompt-api?/bridge"]

# Office document codecs (.docx) for the files domain. `full` implies it.
files-office = ["dep:systemprompt-files", "systemprompt-files/office"]

# The PDF renderer for document export and its embedded fonts. Without it a
# PDF export is refused as an unsupported operation. `full` implies it.
files-pdf = ["dep:systemprompt-files", "systemprompt-files/pdf"]

# Live co-editing of HTML and Markdown documents (engine-agnostic) and its HTTP
# routes. `full` implies it.
files-collab = ["dep:systemprompt-files", "systemprompt-files/collab", "systemprompt-documents?/collab", "systemprompt-files-entry?/collab"]

# The Loro CRDT engine for live sessions. Without it `files-collab` mounts the
# routes and every session answers `collab_engine_unavailable`.
files-collab-loro = ["files-collab", "systemprompt-documents?/engine-loro"]

# The notifications domain: streams, rules, feed and the outbox consumer. `full` implies it.
# Without it the server mounts no notification routes and comments record no notification.
notifications = ["dep:systemprompt-notifications", "dep:systemprompt-notifications-entry", "systemprompt-runtime?/notifications", "systemprompt-documents?/notifications"]

# The brain: revisioned organisational memory, its capture consumer and gateway recall. `full` implies it.
# Without it the documents store records no brain event and the gateway injects no team memory.
brain = ["dep:systemprompt-brain", "dep:systemprompt-brain-entry", "notifications"]

# Issue reports: intake, triage and their jobs. `full` implies it.
issues = ["dep:systemprompt-issues"]

# Full functionality including all domain modules and CLI
full = [
    "api",
    "mcp",
    "cloud",
    "cli",
    "agents",
    "dep:systemprompt-ai",
    "mcp-servers",
    "dep:systemprompt-oauth",
    "dep:systemprompt-users",
    "content",
    "analytics",
    "marketplace",
    "dep:systemprompt-scheduler",
    "dep:systemprompt-generator",
    "logging",
    "systemprompt-logging/cli",
    "config",
    "files",
    "files-office",
    "files-pdf",
    "files-collab-loro",
    "agent-runs",
    "otel",
    "bridge",
    "notifications",
    "brain",
    "issues",
    # Infrastructure crates for extension authors
    "loader",
    "events",
    "storage",
    "client",
    "security",
]

[dependencies]
# Core shared crates
systemprompt-traits = { workspace = true, optional = true }
systemprompt-models = { workspace = true, optional = true }
systemprompt-wire = { workspace = true, optional = true }
systemprompt-manifest = { workspace = true, optional = true }
systemprompt-identifiers = { workspace = true, optional = true }
systemprompt-extension = { workspace = true, optional = true }
systemprompt-template-provider = { workspace = true, optional = true }

# Infrastructure
systemprompt-database = { workspace = true, optional = true }
systemprompt-logging = { workspace = true, optional = true }
systemprompt-config = { workspace = true, optional = true }
systemprompt-cloud = { workspace = true, optional = true }
systemprompt-cloud-entry = { workspace = true, optional = true }
systemprompt-loader = { workspace = true, optional = true }
systemprompt-events = { workspace = true, optional = true }
systemprompt-storage = { workspace = true, optional = true }
systemprompt-client = { workspace = true, optional = true }
systemprompt-security = { workspace = true, optional = true }
systemprompt-governance = { workspace = true, optional = true }

# Application
systemprompt-runtime = { workspace = true, optional = true, features = ["geolocation"] }
systemprompt-mcp-host = { workspace = true, optional = true }
systemprompt-generator = { workspace = true, optional = true }
systemprompt-oauth-issuance = { workspace = true, optional = true }
systemprompt-gateway = { workspace = true, optional = true }
systemprompt-documents = { workspace = true, optional = true }
systemprompt-issues = { workspace = true, optional = true }

# Entry points
systemprompt-api = { workspace = true, optional = true }
systemprompt-cli = { workspace = true, optional = true }

# Domain crates
systemprompt-agent = { workspace = true, optional = true }
systemprompt-ai = { workspace = true, optional = true }
systemprompt-mcp = { workspace = true, optional = true }
systemprompt-oauth = { workspace = true, optional = true }
systemprompt-users = { workspace = true, optional = true }
systemprompt-content = { workspace = true, optional = true }
systemprompt-content-entry = { workspace = true, optional = true }
systemprompt-marketplace-entry = { workspace = true, optional = true }
systemprompt-files-entry = { workspace = true, optional = true }
systemprompt-mcp-entry = { workspace = true, optional = true }
systemprompt-agent-entry = { workspace = true, optional = true }
systemprompt-brain-entry = { workspace = true, optional = true }
systemprompt-gateway-entry = { workspace = true, optional = true }
systemprompt-identity-entry = { workspace = true, optional = true }
systemprompt-analytics = { workspace = true, optional = true }
systemprompt-analytics-entry = { workspace = true, optional = true }
systemprompt-marketplace = { workspace = true, optional = true }
systemprompt-slack = { workspace = true, optional = true }
systemprompt-slack-entry = { workspace = true, optional = true }
systemprompt-teams-entry = { workspace = true, optional = true }
systemprompt-agent-runs-entry = { workspace = true, optional = true }
systemprompt-notifications-entry = { workspace = true, optional = true }
systemprompt-teams = { workspace = true, optional = true }
systemprompt-scheduler = { workspace = true, optional = true }
systemprompt-agent-runs = { workspace = true, optional = true }
systemprompt-files = { workspace = true, optional = true }
systemprompt-notifications = { workspace = true, optional = true }
systemprompt-brain = { workspace = true, optional = true }

# External dependencies for prelude re-exports
axum = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true }

# Used by the `runtime` module's typed error
thiserror = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# The in-repo `systemprompt` binary. It is the reference composition: every
# capability in `full` is a member of its composition. `doc = false`:
# the library of the same name is the documented target.
[[bin]]
name = "systemprompt"
path = "src/main.rs"
required-features = ["full"]
doc = false

[[example]]
name = "extension"
required-features = ["full"]

[[example]]
name = "database"
required-features = ["database"]

[[example]]
name = "api"
required-features = ["api"]

[[example]]
name = "cli"
required-features = ["full"]

[package.metadata.cargo-machete]
ignored = ["systemprompt-gateway-entry", "systemprompt-identity-entry"]
