chrono = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
systemprompt-identifiers = { workspace = true }
systemprompt-models = { workspace = true }
systemprompt-manifest = { workspace = true }
systemprompt-provider-contracts = { workspace = true }
systemprompt-config = { workspace = true }
jsonwebtoken = { workspace = true }
systemprompt-traits = { workspace = true }
systemprompt-extension = { workspace = true, features = ["sqlx", "mcp"] }
systemprompt-database = { workspace = true }
systemprompt-events = { workspace = true }
systemprompt-logging = { workspace = true, features = ["cli"] }
systemprompt-loader = { workspace = true }
systemprompt-storage = { workspace = true }
systemprompt-security = { workspace = true }
systemprompt-governance = { workspace = true }
systemprompt-agent-runs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
serde_yaml = { workspace = true }
indicatif = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
