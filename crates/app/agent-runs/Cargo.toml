[package]
name = "systemprompt-agent-runs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Headless coding-agent executor for systemprompt.io AI governance infrastructure: supervised Claude Code and Codex CLI runs with a common event contract, ephemeral attributed credentials and a leased claim queue."
readme = "README.md"
include = ["src/**/*", "schema/**/*", "build.rs", "Cargo.toml", "README.md", "CHANGELOG.md", ".sqlx/**/*"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[build-dependencies]
systemprompt-extension = { workspace = true }

[dependencies]
tokio = { workspace = true, features = ["process", "io-util", "fs", "time", "macros"] }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
inventory = { workspace = true }

systemprompt-database = { workspace = true }
systemprompt-extension = { workspace = true }
systemprompt-identifiers = { workspace = true }
systemprompt-traits = { workspace = true }
systemprompt-models = { workspace = true }
systemprompt-agent = { workspace = true }
systemprompt-users = { workspace = true }
systemprompt-oauth = { workspace = true }
systemprompt-manifest = { workspace = true }
systemprompt-config = { workspace = true }
systemprompt-provider-contracts = { workspace = true }
tracing = { workspace = true }
walkdir = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }
