[package]
name = "systemprompt-issues"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Issue reports of systemprompt.io: the MCP tools that file and follow them, and the operator triage commands."
readme = "README.md"
include = ["src/**/*", "Cargo.toml", "README.md", "CHANGELOG.md"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
cli = [
    "systemprompt-extension/cli",
    "dep:anyhow",
    "dep:clap",
]

[dependencies]
systemprompt-documents = { workspace = true }
systemprompt-extension = { workspace = true, features = ["mcp"] }
systemprompt-files = { workspace = true }
systemprompt-identifiers = { workspace = true }
systemprompt-models = { workspace = true }

anyhow = { workspace = true, optional = true }
chrono = { workspace = true }
clap = { workspace = true, optional = true }
rmcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
