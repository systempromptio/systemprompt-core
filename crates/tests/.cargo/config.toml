# Test workspace cargo configuration.
#
# DATABASE_URL is the fallback for the sqlx macros and DB-backed tests when the
# environment sets none; an exported DATABASE_URL wins, which is how CI and the
# `just test-shard` / `just coverage` recipes point at their own disposable,
# freshly-migrated databases. It names the same disposable `systemprompt_test`
# database `just test-shard` recreates, never a shared development database.
# The URL carries no password: sqlx and psql read it from PGPASSWORD or
# ~/.pgpass.

[env]
DATABASE_URL = "postgres://systemprompt_admin@localhost:5432/systemprompt_test"
# Cap libtest parallelism so the shared `systemprompt_test` Postgres database
# isn't overwhelmed on workstations with 16-32 logical cores. Above ~8 parallel
# tokio runtimes, the per-test DbPool fans out enough connections to exhaust
# the server's `max_connections` budget and libtest surfaces the cascade as a
# SIGTERM on the test binary. CI runs with 2 cores and is naturally below the
# threshold, so this is a no-op there.
RUST_TEST_THREADS = "8"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
