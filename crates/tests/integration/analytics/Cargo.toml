[dependencies]
reqwest = { workspace = true }
systemprompt-agent = { workspace = true }
systemprompt-ai = { workspace = true }
systemprompt-analytics = { workspace = true }
systemprompt-content = { workspace = true }
systemprompt-mcp = { workspace = true }
systemprompt-analytics-entry = { workspace = true, features = ["http"] }
systemprompt-extension = { workspace = true }
systemprompt-runtime = { workspace = true }
systemprompt-traits = { workspace = true }
systemprompt-users = { workspace = true }
systemprompt-logging = { workspace = true }
systemprompt-database = { workspace = true }
systemprompt-identifiers = { workspace = true }
systemprompt-models = { workspace = true }
systemprompt-test-fixtures = { workspace = true }
systemprompt-test-hack = { version = "0.1", path = "../../common/hack" }

[dev-dependencies]
tokio = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }
http = { workspace = true }
axum = { workspace = true }
http-body-util = "0.1"
tower = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["reqwest"]
