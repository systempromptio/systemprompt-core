[package]
name = "systemprompt-messaging-entry-integration-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Integration tests for the Slack and Teams entry routes on a real database"
publish = false

[lib]
path = "mod.rs"

[lints]
workspace = true

[dependencies]
systemprompt-api = { workspace = true }
systemprompt-slack-entry = { workspace = true, features = ["http"] }
systemprompt-teams-entry = { workspace = true, features = ["http"] }
systemprompt-slack = { workspace = true }
systemprompt-client = { workspace = true }
systemprompt-database = { workspace = true }
systemprompt-extension = { workspace = true }
systemprompt-identifiers = { workspace = true }
systemprompt-governance = { workspace = true }
systemprompt-manifest = { workspace = true }
systemprompt-models = { workspace = true }
systemprompt-runtime = { workspace = true }
systemprompt-security = { workspace = true }
systemprompt-test-fixtures = { workspace = true }
systemprompt-traits = { workspace = true }
systemprompt-test-hack = { version = "0.1", path = "../../common/hack" }

anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
http-body-util = "0.1"
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
rsa = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
wiremock = { workspace = true }
