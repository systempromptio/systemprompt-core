[package]
name = "systemprompt-brain-integration-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Database-backed integration tests for the systemprompt-brain capture pipeline, lifecycle, recall and jobs"
publish = false

[lints]
workspace = true

[dependencies]
systemprompt-documents = { workspace = true }
systemprompt-brain = { workspace = true }
systemprompt-brain-entry = { workspace = true, features = ["http"] }
systemprompt-runtime = { workspace = true }
systemprompt-users = { workspace = true }
systemprompt-events = { workspace = true }
systemprompt-extension = { workspace = true, features = ["sqlx"] }
systemprompt-models = { workspace = true }
systemprompt-identifiers = { workspace = true }
systemprompt-database = { workspace = true }
systemprompt-test-fixtures = { workspace = true }
systemprompt-manifest = { workspace = true }
systemprompt-traits = { workspace = true }
systemprompt-test-hack = { version = "0.1", path = "../../common/hack" }

[dev-dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
uuid = { workspace = true }
systemprompt-mcp = { workspace = true }
serde = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
