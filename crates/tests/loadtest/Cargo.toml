[package]
name = "systemprompt-loadtest"
version = "0.0.1"
edition = "2024"
publish = false
license = "BUSL-1.1"

[workspace]

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.23"
