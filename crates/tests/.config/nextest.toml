# `mcp_stub` registers the per-process fixture MCP server as a `running`
# services row so `plugins mcp call` can resolve its wiremock port. Sibling
# subprocess tests invoke CLI paths that run the table-wide
# `cleanup_stale_service_entries` sweep, which judges a `running` row stale
# unless its pid names the agent in its environment — something a nextest
# process seeding the row on its own pid can never satisfy. Run in parallel the
# sweep deletes this suite's row mid-test and the command under test resolves no
# port (1-2 of 13 failing per run); serialised into the shared services slot it
# is 13/13.
#
# `subprocess_agents_a2a` shares the same stub through `stub_port()`, so it takes
# the same slot: `admin agents tools` there resolved an empty tool list under
# full-workspace load for exactly this reason. The membership is every binary
# that touches `mcp_stub` — grep for it before adding a third.
[[profile.default.overrides]]
filter = 'package(systemprompt-cli-integration-tests) and (binary(subprocess_mcp_stub) or binary(subprocess_agents_a2a))'
test-group = 'scheduler-services-db'

[[profile.ci.overrides]]
filter = 'package(systemprompt-cli-integration-tests) and (binary(subprocess_mcp_stub) or binary(subprocess_agents_a2a))'
test-group = 'scheduler-services-db'

[[profile.coverage.overrides]]
filter = 'package(systemprompt-cli-integration-tests) and (binary(subprocess_mcp_stub) or binary(subprocess_agents_a2a))'
test-group = 'scheduler-services-db'

# The CLI subprocess suite spawns full `systemprompt` boots (validation, DB,
# migrations); under a loaded shard a single boot can legitimately exceed the
# workspace-wide 60s slow period, so give the whole package a wider band before
# nextest terminates it.
[[profile.default.overrides]]
filter = 'package(systemprompt-cli-integration-tests)'
slow-timeout = { period = "120s", terminate-after = 3 }

[[profile.ci.overrides]]
filter = 'package(systemprompt-cli-integration-tests)'
slow-timeout = { period = "120s", terminate-after = 3 }

# The `coverage` profile mirrors `default`'s serial groups but widens the
# slow-timeout band: instrumented debug binaries with continuous-mode profraws
# run 5-10x slower and server-booting integration tests otherwise time out en
# masse, silently dropping whole crates from the coverage report.
[profile.coverage]
slow-timeout = { period = "120s", terminate-after = 5 }
fail-fast = false
failure-output = "immediate-final"
final-status-level = "slow"

