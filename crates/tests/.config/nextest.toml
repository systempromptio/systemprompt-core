# The MCP loader tests register uniquely-named `services` rows and assert on
# their status while the MCP orchestrator/database tests run sweeps
# (`sync_database_state`, `reconcile`) that unregister every row absent from
# their own (empty) registry config, and the proxy-health tests mark every
# running row with an unresponsive port as stopped. Serialise them into the
# shared services-table slot so no sweep runs mid-assertion.
#
# `orchestrator::process_cleanup` joins them because one of its cases seeds a
# row named after the test *process* and then asserts the port holder is no
# longer reported as an orphan. `database_sync`'s unregister sweep would delete
# that row between the seed and the assertion.
[[profile.default.overrides]]
filter = 'package(systemprompt-mcp-tests) and test(/(loader_live|loader_state|orchestrator_extended|orchestrator_populated|orchestrator_smoke|orchestrator_start_live|tool_provider_health|database_state|database_state_extended|database_sync|database_service|lifecycle_deep|lifecycle_live|lifecycle_smoke|proxy_health|proxy_health_healthy|orchestrator::process_cleanup)::/)'
test-group = 'scheduler-services-db'

[[profile.ci.overrides]]
filter = 'package(systemprompt-mcp-tests) and test(/(loader_live|loader_state|orchestrator_extended|orchestrator_populated|orchestrator_smoke|orchestrator_start_live|tool_provider_health|database_state|database_state_extended|database_sync|database_service|lifecycle_deep|lifecycle_live|lifecycle_smoke|proxy_health|proxy_health_healthy|orchestrator::process_cleanup)::/)'
test-group = 'scheduler-services-db'

# The cloud CLI harness (cloud_harness) drives command paths in-process against
# one shared wiremock server and one set of process-global bootstraps
# (`CredentialsBootstrap`, `ProfileBootstrap`), and chdir's into a shared tempdir
# project root for each test. An in-process async mutex already serialises the
# module, but the group keeps its cwd mutation from racing sibling cwd-sensitive
# tests in the same binary. Serialise it into one slot.
[[profile.default.overrides]]
filter = 'package(systemprompt-agent-tests) and test(/repository::(artifact|artifact_parts)::/)'
test-group = 'agent-artifacts-db'

