# nextest configuration for the systemprompt test workspace.
#
# The `ci` profile exists so a hung or leaking test fails fast and is named in
# the run output, instead of starving the hosted runner until it loses
# communication (the failure mode that kept the Test/Coverage jobs red).

# The seeded scheduler tests share one `services` table; `reconcile()` sweeps and
# deletes every row outside its own config as an orphan, so a concurrent run would
# delete another test's seeded row mid-assertion. Serialise them into one slot.
#
# The OAuth repository tests share one `oauth_clients` table; the cleanup tests
# exercise table-wide `DELETE`s (`cleanup_unused_clients`/`cleanup_stale_clients`
# with a zero-day cutoff, `cleanup_inactive`), which delete clients another test
# seeded and is mid-assertion on (and break its auth-code foreign key). Serialise
# the whole repository suite so no cleanup runs concurrently with a client seed.
#
# The seeded job tests run jobs (`MaliciousIpBlacklistJob`, `BehavioralAnalysisJob`)
# that scan whole tables (`user_sessions`, `fingerprint_reputation`) and skip
# already-banned IPs, so a concurrent run's job bans another test's seeded IP first
# and that test then observes zero newly-banned rows. The bootstrap-dispatch and
# job-execution tests additionally share the one inventory-registered
# `cleanup_inactive_sessions` scheduled_jobs row, so a concurrent run flips its
# status mid-assertion; the dispatch-scope tests likewise share the one
# `sp_test_node_job` row and stamp `last_instance_id` on it, and the
# instance-stamp tests own the `stamp_*` rows a sibling suite's sweep can delete
# between the running stamp and the result write (a per-module mutex cannot
# serialise across nextest's one-process-per-test). Serialise the suite into one
# slot so each test's job sees only its own seeded data.
# The users-domain DB tests share the `users` table and its `email`/`name`
# UNIQUE indexes. The federated-identity tests run concurrent
# `find_or_create_federated` INSERTs whose synthetic local emails collide on
# that index, and the user-service create/update tests churn rows another test
# is counting. Serialise the DB-backed suite so each test owns its row mutations.
#
# The generator DB tests (`sitemap_generator_db`, `pipeline_full`,
# `prerender_public_db`) each overwrite the one shared on-disk `web/config.yaml`
# + `content/config.yaml` before running a generator entry point that reads them
# back. A per-module mutex cannot stop a sibling module rewriting the config
# mid-run, so a concurrent test reads another test's source config and asserts on
# the wrong output. Serialise the whole config-writing suite into one slot.
#
# The messaging dispatch and full-router tests share one dispatchable agent
# backend: a `services` row repointed at each test's own wiremock port. A
# concurrent run would overwrite another test's backend port mid-dispatch,
# sending its reply to the wrong mock. They share the services-table slot rather
# than owning one, because that row must also survive the table-wide sweeps the
# suites below run: `cleanup_stale_service_entries` judges a `running` row stale
# unless its PID both exists and names the agent in its environment, which a
# nextest process seeding the row on its own PID can never satisfy. Left in its
# own slot, a sweep deletes the backend between the seed and the dispatch and
# the reply comes back as a generic error card.
#
# The agent artifact suites share the `task_artifacts`/`artifact_parts` tables:
# `artifact_parts::get_parts_rejects_non_object_data_content` seeds a
# deliberately malformed (non-object) data part via raw SQL, and
# `artifact::list_artifacts_by_task_context_and_user` runs the table-wide
# `get_all_artifacts` scan, which decodes every row and fails on the malformed
# one. Serialise both modules into one slot so the scan never sees the seeded
# bad row.
# The database cleanup tests and the scheduler retention-sweep regression both
# run table-wide DELETEs (`delete_orphaned_logs`, the OAuth expiry deletes)
# against shared tables, so a concurrent run deletes the row another test
# seeded and is mid-assertion on. Serialise them into one cross-package slot.
#
# The `cleanup_empty_contexts` tests delete every empty context older than the
# retention window, table-wide: the enforce-gate observe-mode test seeds an old
# empty fixture context and asserts it survives, while its enforce=true sibling
# and the repository sweep delete exactly such rows. Serialise them into the
# scheduler-jobs slot so no sweep runs while the observe fixture is live.
# The gateway safety tests each insert a row into the global
# `ai_gateway_policies` table, which `PolicyResolver::merge` folds into ONE
# effective spec for every request in flight. A concurrent test's policy
# therefore decides whether this test's request or response is blocked, and the
# per-process 60s resolver cache pins whichever spec won. Serialise them so each
# test's policy is the only one installed while it runs.
[test-groups]
gateway-policy-db = { max-threads = 1 }
logs-cleanup-db = { max-threads = 1 }
agent-artifacts-db = { max-threads = 1 }
scheduler-services-db = { max-threads = 1 }
scheduler-jobs-db = { max-threads = 1 }
oauth-clients-db = { max-threads = 1 }
users-db = { max-threads = 1 }
generator-config-db = { max-threads = 1 }
api-health-monitor-db = { max-threads = 1 }
cli-cloud-harness = { max-threads = 1 }
cloud-checkout-port = { max-threads = 1 }
# Why: these tests each start a real `BridgeContext`, which binds a proxy port
# from a fixed candidate list and refuses a port another install already holds
# ("served by a different Systemprompt Bridge install"). nextest gives each test
# its own process, so two of them race for the same candidate and one fails on a
# collision that says nothing about the code under test.
bridge-proxy-port = { max-threads = 1 }
# Why: `McpProxyIdentityRepository::cleanup_expired` is an unscoped
# `DELETE FROM mcp_proxy_identities WHERE expires_at <= NOW()`, so it reaps
# every expired row in the shared database, not just its own. The delete and
# count tests seed deliberately-expired rows and then assert on them, so a
# concurrent cleanup wipes the fixture between the insert and the assertion —
# `delete_removes_the_row_even_once_it_has_expired` failed in CI counting 0
# rows immediately after inserting one.
mcp-proxy-identity-db = { max-threads = 1 }

# Why: `ApprovalRepository::expire_due` is an unscoped UPDATE over every
# overdue pending row, so it sweeps other tests' fixtures. Without this the
# deadline test passes by reading a status column another test set, rather
# than by exercising the deadline check it exists for.
approval-sweep-db = { max-threads = 1 }

# Why: `reconcile` and `ingest_config` operate over every `gateway_route` rule,
# not just the one under test, so two of these interleaved delete each other's
# grants. The file carried a `static SERIAL: Mutex` for this, which cannot work
# — nextest runs each test in its own process, so that lock never contends.
gateway-reconcile-db = { max-threads = 1 }

# Why: `db_migrate_repair_db` tampers with checksums in `extension_migrations`
# on the shared database, and `db_app_ctx` asserts that re-installing an
# installed schema is a no-op. That assertion is false for as long as a
# tampered checksum is outstanding, so the two must not overlap.
cli-migration-ledger-db = { max-threads = 1 }

