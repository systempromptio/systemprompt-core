[package]
name = "systemprompt-golden-runner"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Test support: runs each golden scenario against the harness through its headless run, with the scripted instance as instance and model"
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
# The device client's HTTP stack needs reqwest's rustls provider, which only
# this declaration turns on; nothing here names reqwest.
reqwest = { workspace = true }
serde_json = { workspace = true }
systemprompt-device = { workspace = true }
systemprompt-engine = { workspace = true }
systemprompt-harness = { workspace = true }
systemprompt-parity-compare = { path = "../../parity/compare" }
systemprompt-scripted-instance = { path = "../../scripted-instance" }
systemprompt-traits = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
toml = "1.2"

[package.metadata.cargo-machete]
ignored = ["reqwest"]
