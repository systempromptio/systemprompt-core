[permission]
mode = "ask"

[[permission.rule]]
permission = "edit"
pattern = "secrets/*"
action = "deny"

[title_call]
text = "Writing a token file"

[end]
exit = "ok"

[harness]
title = "Writing a token file"
verdicts = []

[[harness.denial]]
call = "t1"
by = "rule"
