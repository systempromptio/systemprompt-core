id = "13-denied-by-rule"
number = 13
title = "Tool denied by a permission rule"
proves = "No execution; typed denial stored; reason returned"
spec = "documentation/future/harness/testing/03-golden-scenarios.md section 2, row 13"
products = ["harness", "reference"]
