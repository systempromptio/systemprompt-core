[package]
name = "systemprompt-cloud-entry-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Unit tests for systemprompt-cloud-entry crate"
publish = false

[lints]
workspace = true

[dependencies]
systemprompt = { workspace = true, features = ["full"] }
systemprompt-cloud-entry = { workspace = true, features = ["cli"] }
systemprompt-extension = { workspace = true, features = ["cli"] }
systemprompt-cli = { workspace = true }
systemprompt-cloud = { workspace = true }
systemprompt-config = { workspace = true }
systemprompt-identifiers = { workspace = true }
systemprompt-loader = { workspace = true }
systemprompt-manifest = { workspace = true }
systemprompt-models = { workspace = true }
systemprompt-runtime = { workspace = true }
systemprompt-test-fixtures = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
wiremock = { workspace = true }
systemprompt-test-hack = { version = "0.1", path = "../../../common/hack" }

[package.metadata.cargo-machete]
# systemprompt-runtime: used by the helper modules this crate includes by path from the cli test crate (src/lib.rs)
ignored = ["systemprompt-runtime"]
