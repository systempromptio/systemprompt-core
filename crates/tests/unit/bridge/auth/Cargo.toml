[package]
name = "systemprompt-bridge-auth-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Unit tests for systemprompt-bridge auth cache TTL semantics"
publish = false

[lints]
workspace = true

[dependencies]
systemprompt-bridge = { workspace = true }
systemprompt-identifiers = { workspace = true }
async-trait = { workspace = true }
keyring-core = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }
temp-env = { workspace = true }
toml = "1.1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"
