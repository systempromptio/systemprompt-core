[package]
name = "systemprompt-bridge-proxy-harness-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "End-to-end loopback-proxy request-path integration tests for systemprompt-bridge"
publish = false

[lints]
workspace = true

[dependencies]
systemprompt-bridge = { workspace = true }
systemprompt-identifiers = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
wiremock = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
temp-env = { workspace = true }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
arc-swap = "1"
keyring-core = { workspace = true }

# The kernel keyring backs the headless credential store on Linux CI; other
# targets use `keyring_core::mock` and must not build this Linux-only crate.
[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = { workspace = true }
