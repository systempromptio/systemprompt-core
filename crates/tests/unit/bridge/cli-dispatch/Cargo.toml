[package]
name = "systemprompt-bridge-cli-dispatch-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Tests for the systemprompt-bridge CLI argv dispatch tree"
publish = false

[lints]
workspace = true

[dependencies]
systemprompt-bridge = { workspace = true }
tempfile = { workspace = true }
temp-env = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
wiremock = { workspace = true }
keyring-core = { workspace = true }

# The kernel keyring backs the headless credential store on Linux CI; other
# targets use `keyring_core::mock` and must not build this Linux-only crate.
[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = { workspace = true }
