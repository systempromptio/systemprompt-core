[package]
name = "systemprompt-bridge-auth-e2e-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "End-to-end tests for systemprompt-bridge auth chain, validate report, and doctor checks"
publish = false

[lints]
workspace = true

[dependencies]
systemprompt-bridge = { workspace = true }
systemprompt-identifiers = { workspace = true }
tokio = { workspace = true }
wiremock = { workspace = true }
tempfile = { workspace = true }
temp-env = { workspace = true }
serde_json = { workspace = true }
keyring-core = { workspace = true }

# The kernel keyring backs the headless credential store on Linux CI; other
# targets use `keyring_core::mock` and must not build this Linux-only crate.
[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = { workspace = true }
