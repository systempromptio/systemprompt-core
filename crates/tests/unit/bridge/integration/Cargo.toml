[package]
name = "systemprompt-bridge-integration-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Unit tests for systemprompt-bridge integration layer (host apps, registry, registry parser)"
publish = false

[lints]
workspace = true

[dependencies]
reqwest = { workspace = true }
systemprompt-bridge = { workspace = true }
systemprompt-identifiers = { workspace = true }
systemprompt-models = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
temp-env = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = { workspace = true }
sha2 = { workspace = true }
keyring-core = { workspace = true }

# The kernel keyring backs the headless credential store on Linux CI; other
# targets use `keyring_core::mock` and must not build this Linux-only crate.
[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = { workspace = true }
