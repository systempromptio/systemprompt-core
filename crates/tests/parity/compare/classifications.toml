[[entry]]
scenario = "22-provider-error-then-success"
protocol = "*"
comparison = "harness-vs-reference"
path = "steps[3]"
class = "intended"
reason = "Scenario 22 scripts 429, 500 and 401 before the answer; row 22 says 429 and 5xx are retried with backoff and a 401 refreshes the session once. The harness signs in to the instance with a session it can refresh, so it refreshes and retries; the reference holds a static key, treats 401 as an authentication failure and ends the run. Intended: it follows from the harness's governed session credential."

