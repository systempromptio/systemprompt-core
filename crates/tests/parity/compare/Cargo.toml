[package]
name = "systemprompt-parity-compare"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Test support: reduces each product's transcript of a golden scenario to the normalised trace, compares traces and writes the parity ledger"
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "parity-ledger"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
toml = "1.2"
walkdir = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[[test]]
name = "suite"
path = "tests/suite/main.rs"
