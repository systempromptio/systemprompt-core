[package]
name = "systemprompt-test-migrate"
version = "0.0.1"
edition = "2024"
publish = false
license.workspace = true
description = "Test helper: the core schema composition, and a tool that installs it into a Postgres database."

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "systemprompt-test-migrate"
path = "src/main.rs"

[dependencies]
reqwest = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
systemprompt-database = { workspace = true }
systemprompt-extension = { workspace = true }
systemprompt-identifiers = { workspace = true }
systemprompt-governance = { workspace = true }
systemprompt-marketplace = { workspace = true }
thiserror = { workspace = true }
systemprompt-agent = { workspace = true }
systemprompt-agent-runs = { workspace = true }
systemprompt-ai = { workspace = true }
systemprompt-analytics = { workspace = true }
systemprompt-brain = { workspace = true }
systemprompt-content = { workspace = true }
systemprompt-events = { workspace = true }
systemprompt-files = { workspace = true }
systemprompt-logging = { workspace = true }
systemprompt-mcp = { workspace = true }
systemprompt-notifications = { workspace = true }
systemprompt-oauth = { workspace = true }
systemprompt-scheduler = { workspace = true }
systemprompt-users = { workspace = true }
systemprompt-test-hack = { version = "0.1", path = "../hack" }

[package.metadata.cargo-machete]
ignored = ["reqwest"]
