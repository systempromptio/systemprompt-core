# Provider catalog — every upstream this deployment can dispatch to, with the
# models it serves, their pricing, capabilities, limits and governance flags.
# Implementation configuration shipped in the image: the same file boots every
# environment. Credentials are NOT here — each entry names its key by
# api_key_secret, and the profile secret store supplies it.
# Edit by hand or with: systemprompt admin config catalog ...
providers:
- name: anthropic
  # Claude on Anthropic's own API, by API key. Kept declared and routable,
  # but this installation serves Claude from Vertex AI (`vertex-anthropic`
  # below), so the bare `claude-*` ids belong there.
  #
  # Every model here is `hidden`: none is listed to clients, so nobody picks
  # an `anthropic-claude-*` id. The entries stay for the opt-in
  # `anthropic-claude-*` route and the `claude-native-tools` route, which
  # finds them by `upstream_model` (ProviderEntry::find_served_model ignores
  # `hidden`) and prices the served request from them. No `claude-*` failover
  # chain reaches this provider; that is vertex-anthropic-eu.
  #
  # Why the `anthropic-` prefix: a model id must be unique across the whole
  # catalog (ProviderRegistry::validate), and Claude Code asks for the bare
  # ids. `upstream_model` carries the real name, so a client asking for
  # `anthropic-claude-sonnet-5` reaches Anthropic's `claude-sonnet-5`.
  display_name: Anthropic
  description: >-
    Claude models on Anthropic's own API, authenticated with the anthropic key. Reached by the anthropic-claude-* ids; the bare claude-* ids are served from Vertex AI.
  wire: anthropic
  surface: anthropic
  endpoint: https://api.anthropic.com/v1
  api_key_secret: anthropic
  governance:
    european: false
    no_retain: true
  models:
  - id: anthropic-claude-opus-5-5
    hidden: true
    upstream_model: claude-opus-5-5
    pricing:
      input_per_million: 4.0
      output_per_million: 20.0
      cache_read_per_million: 0.2
      cache_write_per_million: 5.0
      per_image_cents: null
    capabilities:
      vision: true
      audio_input: false
      video_input: false
      image_generation: false
      audio_generation: false
      streaming: true
      tools: true
      structured_output: true
      system_prompts: true
      image_resolution_config: false
    limits:
      context_window: 1000000
