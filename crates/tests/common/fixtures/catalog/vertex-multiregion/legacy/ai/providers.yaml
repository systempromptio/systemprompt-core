- name: gemini
  # Google Gemini via the public endpoint, authenticated with an API key sent on
  # x-goog-api-key. The Vertex-hosted copies of the same models are the `vertex`
  # entry below: that host refuses API-key auth as a class and wants an OAuth
  # token, so the two differ in credential and endpoint while sharing a wire.
  # See docs/install/vertex.md.
  display_name: Google Gemini (API key)
  description: >-
    Gemini via the public generativelanguage endpoint, authenticated with an API key. The classifier job and the gemini-* route use it; the Vertex copies of the same models are a separate provider.
  wire: gemini
  surface: gemini
  endpoint: https://generativelanguage.googleapis.com/v1beta
  #
  # Why: cache_read_per_million is Google's published context-caching rate for
  # each model (25% of the input rate), read from ai.google.dev/gemini-api/docs/
  # pricing on 2026-09-05, at the <=200k-token tier. Google bills cache
  # *storage* per hour rather than per written token, so cache_write_per_million
  # is an explicit 0.0: there is no per-token write charge to pass on.
  #
  # The 2.5 family (Pro, Flash, Flash-Lite) was declared here until 2026-09-22
  # and is gone: Google withdrew it from the public endpoint for accounts that
  # had not already used it, so every request 404ed with "no longer available
  # to new users" (15 of them on this instance between 09-11 and 09-18). The
  # Vertex-hosted 2.5 copies are separately undeclared under `vertex` for the
  # same family's 2026-10-20 retirement.
  api_key_secret: gemini
  governance:
    european: false
    no_retain: true
  models:
  # Why: the conversation_classifier job judges in-process through AiService,
  # which speaks the public API-key endpoint only (the Vertex OAuth + project
  # substitution lives in the gateway), so the 3.8 Flash it uses is declared
  # here as well as under `vertex`. Same introductory pricing to 2026-12-31.
  - id: gemini-3.8-flash
    pricing:
      input_per_million: 0.75
      output_per_million: 3.75
      cache_read_per_million: 0.075
      cache_write_per_million: 0.0
      per_image_cents: null
    capabilities:
      vision: true
      audio_input: false
      video_input: false
      image_generation: false
      audio_generation: false
      streaming: true
      tools: true
      structured_output: true
      system_prompts: true
      image_resolution_config: false
      reasoning: true
    limits:
      context_window: 1000000
      max_output_tokens: 65536
      max_thinking_budget: 24576
- name: vertex
  # The Gemini models served from Vertex AI, which authenticates with an OAuth
  # access token rather than an API key -- the gateway mints one from the
  # service-account JSON in the `vertex` secret and refreshes it hourly.
  #
  # The ids are prefixed because a model id must be unique across the whole
  # catalog, and the public-endpoint copies above already claim the bare names.
  # `upstream_model` carries the real name, so a client asking for
  # `vertex-gemini-3.8-flash` reaches Google's `gemini-3.8-flash`. The endpoint
  # is project- and location-scoped; the wire appends
  # /models/{upstream_model}:generateContent.
  #
  # Why `global`: every Gemini 3.x model is served from the global location
  # only (docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini,
  # read 2026-09-11); a regional endpoint such as us-central1 404s on all of
  # them, which is what took the whole provider down before this change.
  #
  # `{project}` is filled by the gateway from the `project_id` of the service
  # account in the `vertex` secret. A project id is a tenant identifier and
  # Vertex echoes it in every IAM error the gateway relays, so it is never
  # written here: this file ships in every image, and a literal id once sent
  # a personal project name to a third-party developer's screen (2026-09-11).
  # The boot validator refuses a literal `projects/<id>` on a Vertex host.
  #
  # Which models: only what Google's documentation lists as currently
  # supported, from the model pages under models/gemini/ (read 2026-09-11).
  # The 2.5 family retires 2026-10-20 and is not declared; the core rate card
  # still prices it, so discovery publishes it until 30 days before the date
  # and then stops on its own. 3.8/3.7/3.6 Flash are on introductory pricing
  # to 2026-12-31 (then 1.50/7.50); the core rate card carries `price_until`
  # and the scheduler warns 60 days ahead.
  display_name: Google Vertex AI (Gemini)
  description: >-
    The Gemini models served from Vertex AI under a Google OAuth token minted from the vertex service-account secret.
  wire: gemini
  surface: gemini
  endpoint: https://aiplatform.googleapis.com/v1/projects/{project}/locations/global/publishers/google
  # Cache writes are billed as storage per hour, not per token, hence an
  # explicit 0.0.
  api_key_secret: vertex
  governance:
    european: false
    no_retain: true
  models:
  - id: vertex-gemini-3.8-flash
    upstream_model: gemini-3.8-flash
    pricing:
      input_per_million: 0.75
      output_per_million: 3.75
      cache_read_per_million: 0.075
      cache_write_per_million: 0.0
      per_image_cents: null
    capabilities:
      vision: true
      audio_input: false
      video_input: false
      image_generation: false
      audio_generation: false
      streaming: true
      tools: true
      structured_output: true
      system_prompts: true
      image_resolution_config: false
      reasoning: true
    limits:
      context_window: 1000000
      max_output_tokens: 65536
      max_thinking_budget: 24576
  - id: vertex-gemini-3.5-flash
    upstream_model: gemini-3.5-flash
    pricing:
      input_per_million: 1.5
      output_per_million: 9.0
      cache_read_per_million: 0.15
      cache_write_per_million: 0.0
      per_image_cents: null
    capabilities:
      vision: true
      audio_input: false
      video_input: false
      image_generation: false
      audio_generation: false
      streaming: true
      tools: true
      structured_output: true
      system_prompts: true
      image_resolution_config: false
      reasoning: true
    limits:
      context_window: 1000000
      max_output_tokens: 65536
      max_thinking_budget: 24576
  - id: vertex-gemini-3.5-flash-lite
    upstream_model: gemini-3.5-flash-lite
    pricing:
      input_per_million: 0.3
