- name: vertex-maas
  # Third-party open models on Vertex AI Model-as-a-Service, OpenAI-compatible
  # surface. The wire appends /chat/completions. Advertised under the openai
  # surface so gateway model discovery lists them in Claude Code's picker;
  # `backend` would hide them. Vertex MaaS authenticates with a Google OAuth
  # token minted from the same `vertex` service-account JSON as every other
  # Vertex provider (one GCP project serves them all), with `{project}` filled
  # from it.
  #
  # `max_thinking_budget` on a model marks it as a reasoning model for the
  # openai-chat wire: the wire then sends the model's own output cap instead
  # of the caller's `max_tokens`, so hidden reasoning cannot starve the visible
  # answer. Measured 2026-09-05 at max_tokens:128 -- qwen3-next-thinking spent
  # all 128 tokens thinking and returned no text; kimi-k2-thinking, glm-5 and
  # gpt-oss burn 50-100 tokens of reasoning on a one-word reply.
  display_name: Vertex AI Model-as-a-Service
  description: >-
    Third-party open models (Qwen, GLM, Kimi, DeepSeek, MiniMax, GPT-OSS) hosted by Vertex AI on an OpenAI-compatible surface on the global endpoint, under the same Google OAuth credential as vertex.
  wire: openai-chat
  surface: openai
  endpoint: https://aiplatform.googleapis.com/v1beta1/projects/{project}/locations/global/endpoints/openapi
  #
  # Which models: every open model Vertex serves serverless on the global
  # endpoint, per its page under models/maas/ (read 2026-09-23) and answered
  # a call from this project's service account the same day. Prices are the
  # pages' (global and regional are the same price); cache rates are what a
  # page publishes, and an explicit 0.0 where it lists none.
  #
  # Retirement: Google deprecated every Qwen, GLM 4.7/5, Kimi, DeepSeek and
  # MiniMax MaaS endpoint and gpt-oss-20b on 2026-07-21 and turns them off on
  # 2026-10-21 (models/deprecations/open-models). They are declared anyway so
  # they stay usable until then; after that date core hides a retired
  # declaration from every listing and the upstream refuses it. Only glm-5.2
  # (preview, guaranteed to at least 2026-10-08) is not retiring; gpt-oss-120b
  # was dropped on 2026-10-07 because it was offered to every host while its
  # upstream kept failing. Delete the retired entries once the date has passed.
  #
  # `max_output_tokens` is 32768 where a page states "same as the context
  # window": a reasoning model is sent its own output cap as max_tokens, and
  # a cap equal to the whole window leaves no room for the prompt.
  api_key_secret: vertex
  governance:
    european: false
    no_retain: true
  models:
  - id: qwen.qwen3-coder-480b
    upstream_model: qwen/qwen3-coder-480b-a35b-instruct-maas
    pricing:
      input_per_million: 0.22
      output_per_million: 1.8
      cache_read_per_million: 0.022
      cache_write_per_million: 0.0
      per_image_cents: null
    capabilities:
      vision: false
      audio_input: false
      video_input: false
      image_generation: false
      audio_generation: false
      streaming: true
      tools: true
      structured_output: true
      system_prompts: true
      image_resolution_config: false
    limits:
      context_window: 262144
      max_output_tokens: 65536
  - id: zai.glm-5
    upstream_model: zai-org/glm-5-maas
    pricing:
      input_per_million: 1.0
      output_per_million: 3.2
      cache_read_per_million: 0.1
      cache_write_per_million: 0.0
      per_image_cents: null
    capabilities:
      vision: false
