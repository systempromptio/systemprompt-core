- name: vertex-anthropic-eu
  # The second Claude deployment on Vertex AI, and the failover target of every
  # claude-* chain in gateway.yaml (vertex-anthropic -> vertex-anthropic-eu):
  # same `vertex` service account, same Anthropic-on-Vertex wire, but the
  # regional europe-west1 (Belgium) endpoint instead of `global`, so a global
  # capacity shortfall lands on separately-provisioned regional quota. The
  # project's Claude quota in europe-west1 must be requested in advance;
  # without it this deployment answers 429 and the chain is exhausted.
  #
  # Model ids are unique across the catalog, so each entry is a hidden
  # `vertex-eu-` alias whose `upstream_model` is the bare id clients ask for;
  # the failover finds it by that name (ProviderEntry::find_served_model).
  # Prices are vertex-anthropic's global rates plus Vertex's 10% regional
  # premium. Haiku 4.5 is not declared: its Vertex id is version-pinned
  # (`@20251001`) and retires 2026-10-15, so a Haiku request has no second
  # deployment. `accepted_betas` mirrors vertex-anthropic; see its comment.
  display_name: Google Vertex AI (Claude, europe-west1)
  description: >-
    Claude models served from Vertex AI's europe-west1 regional endpoint under the vertex service-account secret. The failover deployment for every claude-* request.
  wire: anthropic
  surface: anthropic
  endpoint: https://europe-west1-aiplatform.googleapis.com/v1/projects/{project}/locations/europe-west1/publishers/anthropic
  api_key_secret: vertex
  accepted_betas:
  - context-management-2025-06-27
  - interleaved-thinking-2025-05-14
  - effort-2025-11-24
  governance:
    european: true
    no_retain: true
  models:
  - id: vertex-eu-claude-opus-5-5
    hidden: true
    upstream_model: claude-opus-5-5
    pricing:
      input_per_million: 4.4
      output_per_million: 22.0
