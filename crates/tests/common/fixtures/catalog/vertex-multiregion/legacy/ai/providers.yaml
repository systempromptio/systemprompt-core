- name: vertex-anthropic
  # Claude served from Vertex AI (publisher `anthropic`), under the same
  # Google service account as `vertex`: the gateway and the in-process AI
  # service mint an OAuth token from the `vertex` secret, fill `{project}`
  # from it, and post to the model's own `:rawPredict`/`:streamRawPredict`
  # path with `anthropic_version: vertex-2023-10-16` in the body. The wire is
  # the Anthropic Messages codec unchanged; hosting is read off the host.
  #
  # Which models: the current Claude family the Vertex publisher listing
  # serves (read 2026-09-23). Current models are served on their `default` version, so the
  # bare name is the upstream id; Haiku 4.5 is pinned to `@20251001`.
  #
  # `global` because every model above is listed there, and global is the
  # cheapest tier (the US/EU multi-region and regional tables charge 10% more).
  # Prices are Vertex's own global rates for <=200k input, from each model's
  # partner-models/claude page and the pricing page (read 2026-09-23); cache
  # write is the 5-minute rate. Fable 5.1's cache read is 0.25 there, not the
  # usual tenth of input — kept as published. Haiku 4.5 is guaranteed only
  # to 2026-10-15. The Claude 4.x Opus and Sonnet models were removed on
  # 2026-09-24; the 5.x family replaces them.
  #
  # `accepted_betas` is the whole list of `anthropic-beta` flags the gateway
  # forwards here; Vertex refuses a flag it does not serve, so the gateway
  # sends none that is not declared. A flag that gates a body field
  # (`context-management-*` gates `context_management`) must be declared or
  # the field arrives alone and Vertex answers `context_management: Extra
  # inputs are not permitted` — the 400 every Claude Code 2.1.283 prompt got
  # on 2026-09-28 while this list was empty. Which flags: the betas Claude
  # Code 2.1.283 sends (captured 2026-09-28) that Anthropic's feature matrix
  # (platform.claude.com/docs/en/build-with-claude/overview, read 2026-09-28)
  # lists for Google Cloud. Absent on purpose because Vertex does not serve
  # them: advisor-tool-*, code-execution-*, mcp-client-*, files-api-*,
  # skills-*, web-fetch-*; and context-1m-*, since Vertex serves 1M natively.
  # Also sent by 2.1.283 but held back until Vertex is seen to accept them:
  # claude-code-20250219, thinking-token-count-2026-05-13,
  # prompt-caching-scope-2026-01-05, mid-conversation-system-2026-04-07.
  # A flag Vertex still refuses is learned at runtime and dropped, together
  # with the body field it gates, so a mistake here costs one round trip.
  display_name: Google Vertex AI (Claude)
  description: >-
    Claude models served from Vertex AI under a Google OAuth token minted from the vertex service-account secret. Serves every claude-* request on this installation.
  wire: anthropic
  surface: anthropic
  endpoint: https://aiplatform.googleapis.com/v1/projects/{project}/locations/global/publishers/anthropic
  api_key_secret: vertex
  accepted_betas:
  - context-management-2025-06-27
  - interleaved-thinking-2025-05-14
  - effort-2025-11-24
  governance:
    european: false
    no_retain: true
  models:
  - id: claude-opus-5-5
    pricing:
      input_per_million: 4.0
      output_per_million: 20.0
      cache_read_per_million: 0.2
      cache_write_per_million: 5.0
      per_image_cents: null
    capabilities:
      vision: true
      audio_input: false
      video_input: false
      image_generation: false
      audio_generation: false
      streaming: true
      tools: true
      structured_output: true
      system_prompts: true
      image_resolution_config: false
    limits:
      context_window: 1000000
      max_output_tokens: 128000
  - id: claude-sonnet-5-5
    pricing:
      input_per_million: 2.0
      output_per_million: 10.0
      cache_read_per_million: 0.2
      cache_write_per_million: 2.5
