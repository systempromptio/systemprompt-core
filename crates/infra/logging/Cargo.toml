[package]
name = "systemprompt-logging"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Tracing and audit infrastructure for systemprompt.io AI governance. Structured events, five-point audit traces, and SIEM-ready JSON output — part of the MCP governance pipeline."
readme = "README.md"
include = ["src/**/*", "schema/**/*", "build.rs", "Cargo.toml", "README.md", "CHANGELOG.md", ".sqlx/**/*"]

[lints]
workspace = true

[build-dependencies]
systemprompt-extension = { workspace = true }

[dependencies]
# Core dependencies
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }

# Database
sqlx = { workspace = true }

# UUID for log entry IDs
uuid = { workspace = true }

# CLI formatting and display (optional, enabled by "cli" feature)
console = { workspace = true, optional = true }
indicatif = { workspace = true, optional = true }

# Core libs
systemprompt-database = { workspace = true }
systemprompt-extension = { workspace = true }
systemprompt-identifiers = { workspace = true }
systemprompt-manifest = { workspace = true }
systemprompt-models = { workspace = true }
systemprompt-traits = { workspace = true }

# Live OTLP export (feature "otel")
opentelemetry-proto = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
metrics = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }

# Traits
async-trait = { workspace = true }
thiserror = { workspace = true }

# Validation

# Web interface dependencies

[features]
default = []
cli = ["dep:console", "dep:indicatif"]
# Live OTLP export of the tracing pipeline to the profile's collector.
otel = ["dep:opentelemetry-proto", "dep:prost", "dep:reqwest", "dep:metrics", "dep:sha2", "dep:hex"]

[package.metadata.docs.rs]
all-features = true

