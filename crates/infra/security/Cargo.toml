[package]
name = "systemprompt-security"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Security infrastructure for systemprompt.io: JWT, OAuth2 token extraction, signing keys, upstream credentials, at-rest hashing and ChaCha20-Poly1305 secret sealing."
readme = "README.md"
include = ["src/**/*", "Cargo.toml", "README.md", "CHANGELOG.md"]

[lints]
workspace = true

[dependencies]
# Core runtime
thiserror = { workspace = true }
tracing = { workspace = true }

# Web framework
axum = { workspace = true }

# Security
uuid = { workspace = true }
jsonwebtoken = { workspace = true }
chrono = { workspace = true }
rsa = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
# At-rest sealing of credentials that must be replayed upstream, under the
# same `encryption_master_key` and AEAD as the gateway accounting journal.
chacha20poly1305 = { workspace = true }
rand = { workspace = true }
lru = { workspace = true }
url = { workspace = true }

# Signed-manifest crypto (bridge)
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_jcs = { workspace = true }

reqwest = { workspace = true }
serde_json = { workspace = true }
# `time` for the credential retry backoff; `sync` for the single-flight token cache.
tokio = { workspace = true }

# systemprompt.io dependencies
systemprompt-models = { workspace = true }
systemprompt-traits = { workspace = true }
systemprompt-wire = { workspace = true }
systemprompt-client = { workspace = true }
systemprompt-config = { workspace = true }
systemprompt-identifiers = { workspace = true, features = ["sqlx"] }

[package.metadata.docs.rs]
all-features = true
