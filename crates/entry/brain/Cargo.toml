[package]
name = "systemprompt-brain-entry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The brain routes of systemprompt.io: fact reads, search, entry and governance, dispute resolution, the proposal queue and the admin recall simulator."
readme = "README.md"
include = ["src/**/*", "Cargo.toml", "README.md", "CHANGELOG.md"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
http = [
    "systemprompt-extension/router",
    "dep:systemprompt-brain",
    "dep:systemprompt-governance",
    "dep:systemprompt-identifiers",
    "dep:systemprompt-manifest",
    "dep:systemprompt-models",
    "dep:systemprompt-traits",
    "dep:axum",
    "dep:chrono",
    "dep:serde",
    "dep:serde_json",
    "dep:tokio",
]

[dependencies]
systemprompt-brain = { workspace = true, optional = true }
systemprompt-extension = { workspace = true }
systemprompt-governance = { workspace = true, optional = true }
systemprompt-identifiers = { workspace = true, optional = true }
systemprompt-manifest = { workspace = true, optional = true }
systemprompt-models = { workspace = true, optional = true }
systemprompt-traits = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["time"] }
