[package]
name = "systemprompt-cloud-entry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The cloud CLI commands of systemprompt.io: tenant sign-in, profiles, deploy, secrets and fleet operations against the hosted control plane."
readme = "README.md"
include = ["src/**/*", "Cargo.toml", "README.md", "CHANGELOG.md"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
http = [
    "systemprompt-extension/router",
    "dep:systemprompt-config",
    "dep:systemprompt-loader",
    "dep:systemprompt-manifest",
    "dep:systemprompt-models",
    "dep:axum",
    "dep:chrono",
    "dep:serde",
    "dep:thiserror",
    "dep:tokio",
]
cli = [
    "systemprompt-extension/cli",
    "systemprompt-extension/sqlx",
    "systemprompt-logging/cli",
    "dep:systemprompt-cloud",
    "dep:systemprompt-client",
    "dep:systemprompt-config",
    "dep:systemprompt-database",
    "dep:systemprompt-gateway",
    "dep:systemprompt-governance",
    "dep:systemprompt-identifiers",
    "dep:systemprompt-loader",
    "dep:systemprompt-logging",
    "dep:systemprompt-manifest",
    "dep:systemprompt-models",
    "dep:systemprompt-scheduler",
    "dep:systemprompt-traits",
    "dep:anyhow",
    "dep:async-trait",
    "dep:chrono",
    "dep:clap",
    "dep:hex",
    "dep:indicatif",
    "dep:reqwest",
    "dep:schemars",
    "dep:serde",
    "dep:serde_json",
    "dep:serde_yaml",
    "dep:sha2",
    "dep:sqlx",
    "dep:tokio",
    "dep:tracing",
    "dep:url",
    "dep:uuid",
]

[dependencies]
systemprompt-cloud = { workspace = true, optional = true }
systemprompt-client = { workspace = true, optional = true }
systemprompt-config = { workspace = true, optional = true }
systemprompt-database = { workspace = true, optional = true }
systemprompt-extension = { workspace = true }
systemprompt-gateway = { workspace = true, optional = true }
systemprompt-governance = { workspace = true, optional = true }
systemprompt-identifiers = { workspace = true, optional = true }
systemprompt-loader = { workspace = true, optional = true }
systemprompt-logging = { workspace = true, optional = true }
systemprompt-manifest = { workspace = true, optional = true }
systemprompt-models = { workspace = true, optional = true }
systemprompt-scheduler = { workspace = true, optional = true }
systemprompt-traits = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
indicatif = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
