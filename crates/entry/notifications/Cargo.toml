[package]
name = "systemprompt-notifications-entry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The notification HTTP routes of systemprompt.io: streams, rules, subscriptions, the feed and escalation."
readme = "README.md"
include = ["src/**/*", "Cargo.toml", "README.md", "CHANGELOG.md"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
http = [
    "systemprompt-extension/router",
    "dep:systemprompt-identifiers",
    "dep:systemprompt-models",
    "dep:systemprompt-notifications",
    "dep:systemprompt-traits",
    "dep:axum",
    "dep:serde",
    "dep:thiserror",
]
cli = []

[dependencies]
systemprompt-extension = { workspace = true }
systemprompt-identifiers = { workspace = true, optional = true }
systemprompt-models = { workspace = true, optional = true }
systemprompt-notifications = { workspace = true, optional = true }
systemprompt-traits = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
