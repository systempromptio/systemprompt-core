[package]
name = "systemprompt-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Axum-based HTTP server and API gateway for systemprompt.io AI governance infrastructure. Exposes governed agents, MCP, A2A, and admin endpoints with rate limiting and RBAC."
readme = "README.md"
include = ["src/**/*", "Cargo.toml", "README.md", "CHANGELOG.md"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
http-body-util = "0.1"
# Core runtime
tokio = { workspace = true, features = ["fs", "process", "signal"] }
anyhow = { workspace = true }
async-trait = { workspace = true }
async-stream = { workspace = true }

# CLI

# HTTP/Web framework
axum = { workspace = true, features = ["multipart"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["normalize-path"] }
http = { workspace = true }
reqwest = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }

# MCP transport

# Database
sqlx = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
ipnet = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Metrics
metrics = { workspace = true }
lru = { workspace = true }
metrics-exporter-prometheus = { workspace = true }


# systemprompt.io crates
systemprompt-models = { workspace = true }
systemprompt-manifest = { workspace = true }
systemprompt-config = { workspace = true }
systemprompt-loader = { workspace = true }
systemprompt-identifiers = { workspace = true }
systemprompt-traits = { workspace = true }
systemprompt-extension = { workspace = true, features = ["router"] }
systemprompt-runtime = { workspace = true }
systemprompt-oauth-issuance = { workspace = true }
systemprompt-logging = { workspace = true }
systemprompt-provider-contracts = { workspace = true }
systemprompt-storage = { workspace = true }
systemprompt-database = { workspace = true }
systemprompt-scheduler = { workspace = true }
systemprompt-events = { workspace = true }
systemprompt-security = { workspace = true }
systemprompt-governance = { workspace = true }

# Authentication

# System
nix = { workspace = true }

# Sync/compression

# OTel ingest (OTLP/HTTP Protobuf)

[features]
default = []
bridge = []
# Starts the live OTLP export when the profile names a collector.
otel = ["systemprompt-logging/otel"]

[lints]
workspace = true
