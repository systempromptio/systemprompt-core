[package]
name = "systemprompt-agent-runs-entry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The agent-run HTTP routes and CLI seam of systemprompt.io: queue, read, cancel and stream a caller's durable headless runs."
readme = "README.md"
include = ["src/**/*", "Cargo.toml", "README.md", "CHANGELOG.md"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
http = [
    "dep:inventory",
    "dep:systemprompt-agent-runs",
    "dep:systemprompt-extension",
    "dep:axum",
    "dep:async-stream",
    "dep:chrono",
    "dep:futures-util",
    "dep:serde",
    "dep:serde_json",
    "dep:tokio",
    "dep:tracing",
    "dep:systemprompt-api",
    "dep:systemprompt-config",
    "dep:systemprompt-database",
    "dep:systemprompt-identifiers",
    "dep:systemprompt-models",
    "dep:thiserror",
]
cli = [
    "dep:inventory",
    "dep:systemprompt-agent-runs",
    "dep:systemprompt-cli",
]

[dependencies]
inventory = { workspace = true, optional = true }
systemprompt-agent-runs = { workspace = true, optional = true }
systemprompt-extension = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
async-stream = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["time", "macros", "sync"] }
tracing = { workspace = true, optional = true }
systemprompt-api = { workspace = true, optional = true }
systemprompt-cli = { workspace = true, optional = true }
systemprompt-config = { workspace = true, optional = true }
systemprompt-database = { workspace = true, optional = true }
systemprompt-identifiers = { workspace = true, optional = true }
systemprompt-models = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[package.metadata.cargo-machete]
# inventory: compile-time registration via register_extension!/register_linked_seam! (::inventory::submit!)
ignored = ["inventory"]
