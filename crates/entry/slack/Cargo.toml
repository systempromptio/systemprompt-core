[package]
name = "systemprompt-slack-entry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The Slack inbound HTTP routes of systemprompt.io: Events API, slash commands and Block Kit interactions, verified in the handler and dispatched to governed A2A agents."
readme = "README.md"
include = ["src/**/*", "Cargo.toml", "README.md", "CHANGELOG.md"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
http = [
    "dep:axum",
    "dep:systemprompt-slack",
    "dep:reqwest",
    "dep:systemprompt-client",
    "dep:systemprompt-identifiers",
    "dep:systemprompt-models",
    "dep:systemprompt-provider-contracts",
    "dep:systemprompt-traits",
    "dep:thiserror",
    "dep:tracing",
    "dep:url",
]
cli = []

[dependencies]
inventory = { workspace = true }
schemars = { workspace = true }
serde_json = { workspace = true }
systemprompt-extension = { workspace = true }
systemprompt-manifest = { workspace = true }

axum = { workspace = true, optional = true }
systemprompt-slack = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
systemprompt-traits = { workspace = true, optional = true }
systemprompt-client = { workspace = true, optional = true }
systemprompt-identifiers = { workspace = true, optional = true }
systemprompt-models = { workspace = true, optional = true }
systemprompt-provider-contracts = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[package.metadata.cargo-machete]
# inventory: compile-time registration via register_extension! (::inventory::submit!)
ignored = ["inventory"]
