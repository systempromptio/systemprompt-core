[package]
name = "systemprompt-files-entry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The file CLI commands of systemprompt.io: listing, inspecting, uploading, validating and deleting stored files, and the AI-generated image views."
readme = "README.md"
include = ["src/**/*", "Cargo.toml", "README.md", "CHANGELOG.md"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
http = ["systemprompt-extension/router"]
cli = [
    "systemprompt-extension/cli",
    "dep:systemprompt-database",
    "dep:systemprompt-files",
    "dep:systemprompt-identifiers",
    "dep:systemprompt-models",
    "dep:systemprompt-traits",
    "dep:anyhow",
    "dep:base64",
    "dep:chrono",
    "dep:clap",
    "dep:schemars",
    "dep:serde",
    "dep:sha2",
    "dep:tokio",
]

[dependencies]
systemprompt-database = { workspace = true, optional = true }
systemprompt-extension = { workspace = true }
systemprompt-files = { workspace = true, optional = true }
systemprompt-identifiers = { workspace = true, optional = true }
systemprompt-models = { workspace = true, optional = true }
systemprompt-traits = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["fs"] }
