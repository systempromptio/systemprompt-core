[package]
name = "systemprompt-gateway-entry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The AI gateway routes and telemetry export of systemprompt.io."
readme = "README.md"
include = ["src/**/*", "Cargo.toml", "README.md", "CHANGELOG.md"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
http = ["systemprompt-extension/router"]
otel = []

[dependencies]
systemprompt-extension = { workspace = true }
[package.metadata.cargo-machete]
ignored = ["systemprompt-extension"]
