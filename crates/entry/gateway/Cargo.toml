[package]
name = "systemprompt-gateway-entry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The AI gateway routes and telemetry export of systemprompt.io."
readme = "README.md"
include = ["src/**/*", "Cargo.toml", "README.md", "CHANGELOG.md"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
http = [
    "systemprompt-extension/router",
    "dep:systemprompt-ai",
    "dep:systemprompt-analytics",
    "dep:systemprompt-events",
    "dep:systemprompt-loader",
    "dep:systemprompt-marketplace",
    "dep:systemprompt-oauth",
    "dep:systemprompt-security",
    "dep:chrono",
    "dep:reqwest",
    "dep:serde",
    "dep:sha2",
    "dep:hex",
    "dep:semver",
    "dep:async-trait",
    "dep:tokio",
    "dep:systemprompt-database",
    "dep:systemprompt-gateway",
    "dep:systemprompt-governance",
    "dep:systemprompt-identifiers",
    "dep:systemprompt-logging",
    "dep:systemprompt-manifest",
    "dep:systemprompt-models",
    "dep:systemprompt-traits",
    "dep:systemprompt-users",
    "dep:systemprompt-wire",
    "dep:axum",
    "dep:bytes",
    "dep:http",
    "dep:serde_json",
    "dep:tracing",
    "dep:thiserror",
]
otel = ["http", "dep:opentelemetry-proto", "dep:prost", "dep:metrics"]

[dependencies]
systemprompt-extension = { workspace = true }
systemprompt-ai = { workspace = true, optional = true }
systemprompt-analytics = { workspace = true, optional = true }
systemprompt-events = { workspace = true, optional = true }
systemprompt-marketplace = { workspace = true, optional = true }
systemprompt-oauth = { workspace = true, optional = true }
systemprompt-security = { workspace = true, optional = true }
systemprompt-database = { workspace = true, optional = true }
systemprompt-gateway = { workspace = true, optional = true }
systemprompt-governance = { workspace = true, optional = true }
systemprompt-identifiers = { workspace = true, optional = true }
systemprompt-loader = { workspace = true, optional = true }
systemprompt-logging = { workspace = true, optional = true }
systemprompt-manifest = { workspace = true, optional = true }
systemprompt-models = { workspace = true, optional = true }
systemprompt-traits = { workspace = true, optional = true }
systemprompt-users = { workspace = true, optional = true }
systemprompt-wire = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
http = { workspace = true, optional = true }
metrics = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
opentelemetry-proto = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
