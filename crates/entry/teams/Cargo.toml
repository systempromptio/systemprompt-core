[package]
name = "systemprompt-teams-entry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The Microsoft Teams inbound HTTP routes of systemprompt.io: Bot Framework activities, verified in the handler and dispatched to governed A2A agents."
readme = "README.md"
include = ["src/**/*", "Cargo.toml", "README.md", "CHANGELOG.md"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
http = [
    "systemprompt-extension/router",
    "systemprompt-extension/teams",
    "dep:axum",
    "dep:systemprompt-teams",
    "dep:reqwest",
    "dep:systemprompt-client",
    "dep:systemprompt-identifiers",
    "dep:systemprompt-models",
    "dep:systemprompt-provider-contracts",
    "dep:systemprompt-traits",
    "dep:chrono",
]
cli = []

[dependencies]
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
systemprompt-extension = { workspace = true }
systemprompt-manifest = { workspace = true }
tracing = { workspace = true }

axum = { workspace = true, optional = true }
systemprompt-teams = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
systemprompt-traits = { workspace = true, optional = true }
systemprompt-client = { workspace = true, optional = true }
systemprompt-identifiers = { workspace = true, optional = true }
systemprompt-models = { workspace = true, optional = true }
systemprompt-provider-contracts = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
