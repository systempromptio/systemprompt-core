[package]
name = "systemprompt-agent-entry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The agent conversation routes and the admin agents, core contexts and core artifacts commands of systemprompt.io."
readme = "README.md"
include = ["src/**/*", "Cargo.toml", "README.md", "CHANGELOG.md"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
http = [
    "systemprompt-extension/router",
    "dep:systemprompt-database",
    "dep:systemprompt-events",
    "dep:systemprompt-identifiers",
    "dep:systemprompt-manifest",
    "dep:systemprompt-mcp",
    "dep:systemprompt-models",
    "dep:systemprompt-traits",
    "dep:axum",
    "dep:chrono",
    "dep:http",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:tracing",
]
cli = [
    "systemprompt-extension/cli",
    "dep:systemprompt-config",
    "dep:systemprompt-database",
    "dep:systemprompt-identifiers",
    "dep:systemprompt-loader",
    "dep:systemprompt-logging",
    "dep:systemprompt-manifest",
    "dep:systemprompt-models",
    "dep:systemprompt-traits",
    "dep:anyhow",
    "dep:bytes",
    "dep:chrono",
    "dep:clap",
    "dep:console",
    "dep:futures-util",
    "dep:reqwest",
    "dep:schemars",
    "dep:serde",
    "dep:serde_json",
    "dep:sse-stream",
    "dep:thiserror",
    "dep:tokio",
    "dep:tracing",
    "dep:uuid",
]

[dependencies]
systemprompt-agent = { workspace = true }
systemprompt-config = { workspace = true, optional = true }
systemprompt-database = { workspace = true, optional = true }
systemprompt-events = { workspace = true, optional = true }
systemprompt-extension = { workspace = true }
systemprompt-identifiers = { workspace = true, optional = true }
systemprompt-loader = { workspace = true, optional = true }
systemprompt-logging = { workspace = true, optional = true }
systemprompt-manifest = { workspace = true, optional = true }
systemprompt-mcp = { workspace = true, optional = true }
systemprompt-models = { workspace = true, optional = true }
systemprompt-traits = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
console = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
http = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sse-stream = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
