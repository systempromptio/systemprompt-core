[package]
name = "systemprompt-content-entry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The content HTTP routes and CLI commands of systemprompt.io: published content, search, trackable links and the short-link redirect, the content commands and sitemap generation."
readme = "README.md"
include = ["src/**/*", "Cargo.toml", "README.md", "CHANGELOG.md"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
http = [
    "systemprompt-extension/router",
    "dep:systemprompt-content",
    "dep:systemprompt-identifiers",
    "dep:systemprompt-manifest",
    "dep:systemprompt-models",
    "dep:systemprompt-traits",
    "dep:axum",
    "dep:chrono",
    "dep:serde",
    "dep:thiserror",
    "dep:tracing",
]
cli = [
    "systemprompt-extension/cli",
    "systemprompt-logging/cli",
    "dep:systemprompt-config",
    "dep:systemprompt-content",
    "dep:systemprompt-database",
    "dep:systemprompt-generator",
    "dep:systemprompt-identifiers",
    "dep:systemprompt-logging",
    "dep:systemprompt-manifest",
    "dep:systemprompt-models",
    "dep:anyhow",
    "dep:chrono",
    "dep:clap",
    "dep:reqwest",
    "dep:schemars",
    "dep:serde",
    "dep:serde_yaml",
    "dep:uuid",
]

[dependencies]
reqwest = { workspace = true, optional = true }
systemprompt-content = { workspace = true, optional = true }
systemprompt-database = { workspace = true, optional = true }
systemprompt-extension = { workspace = true }
systemprompt-generator = { workspace = true, optional = true }
systemprompt-identifiers = { workspace = true, optional = true }
systemprompt-logging = { workspace = true, optional = true }
systemprompt-manifest = { workspace = true, optional = true }
systemprompt-config = { workspace = true, optional = true }
systemprompt-models = { workspace = true, optional = true }
systemprompt-traits = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
