[package]
name = "systemprompt-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "api-bindings", "authentication"]
description = "Library behind the unified CLI for systemprompt.io AI governance: agent orchestration, MCP governance, analytics, profiles, cloud deploy, and self-hosted operations."
readme = "README.md"
include = ["src/**/*", "Cargo.toml", "README.md", "CHANGELOG.md", ".sqlx/**/*"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[lib]
name = "systemprompt_cli"
path = "src/lib.rs"

[dependencies]
# Core runtime
tokio = { workspace = true, features = ["fs", "process", "signal"] }
anyhow = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }

# systemprompt.io crates
systemprompt-runtime = { workspace = true }
systemprompt-mcp-host = { workspace = true }
systemprompt-api = { workspace = true }
systemprompt-logging = { workspace = true }
systemprompt-database = { workspace = true }
systemprompt-scheduler = { workspace = true }
systemprompt-security = { workspace = true }
systemprompt-governance = { workspace = true }
systemprompt-models = { workspace = true }
systemprompt-manifest = { workspace = true }
systemprompt-wire = { workspace = true }
systemprompt-config = { workspace = true }
systemprompt-loader = { workspace = true }
systemprompt-identifiers = { workspace = true }
systemprompt-traits = { workspace = true }
systemprompt-extension = { workspace = true, features = ["cli"] }
systemprompt-cloud = { workspace = true }
systemprompt-client = { workspace = true }

# Additional dependencies used by CLI modules
tracing = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
schemars = { workspace = true }
chrono = { workspace = true }
console = { workspace = true }
tabled = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
futures-util = { workspace = true }
dialoguer = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
walkdir = { workspace = true }
url = { workspace = true }
rand = { workspace = true }
indicatif = { workspace = true }
regex = { workspace = true }
semver = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
jsonwebtoken = { workspace = true }
