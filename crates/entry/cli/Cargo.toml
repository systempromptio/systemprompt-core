[package]
name = "systemprompt-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "api-bindings", "authentication"]
description = "Unified CLI for systemprompt.io AI governance: agent orchestration, MCP governance, analytics, profiles, cloud deploy, and self-hosted operations."
readme = "README.md"
include = ["src/**/*", "Cargo.toml", "README.md", "CHANGELOG.md", ".sqlx/**/*"]

[package.metadata.docs.rs]
all-features = true

[features]
# The bare binary is the core runtime alone; each feature mirrors the facade's
# optional domain of the same name so a `--features full` build matches what a
# facade `full` consumer ships.
notifications = ["systemprompt-runtime/notifications", "systemprompt-mcp-host/notifications", "systemprompt-api/notifications"]
collab = ["systemprompt-files/collab", "systemprompt-runtime/collab", "systemprompt-api/collab"]
engine-loro = ["collab", "systemprompt-runtime/engine-loro"]
office = ["systemprompt-files/office"]
pdf = ["systemprompt-files/pdf", "systemprompt-api/pdf"]
brain = ["notifications", "systemprompt-runtime/brain", "systemprompt-mcp-host/brain", "systemprompt-api/brain"]
agent-runs = ["dep:systemprompt-agent-runs", "systemprompt-api/agent-runs"]
otel = ["systemprompt-api/otel", "systemprompt-scheduler/otel"]
bridge = ["systemprompt-api/bridge"]
slack = ["systemprompt-api/slack"]
teams = ["systemprompt-api/teams"]
full = ["notifications", "brain", "engine-loro", "office", "pdf", "agent-runs", "otel", "bridge"]

[lints]
workspace = true

[lib]
name = "systemprompt_cli"
path = "src/lib.rs"

[[bin]]
name = "systemprompt"
path = "src/main.rs"

[dependencies]
# Core runtime
tokio = { workspace = true, features = ["fs", "process", "signal"] }
anyhow = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }

# systemprompt.io crates
systemprompt-runtime = { workspace = true, features = ["geolocation"] }
systemprompt-mcp-host = { workspace = true }
systemprompt-agent = { workspace = true }
systemprompt-agent-runs = { workspace = true, optional = true }
systemprompt-mcp = { workspace = true }
systemprompt-api = { workspace = true }
systemprompt-logging = { workspace = true }
systemprompt-users = { workspace = true }
systemprompt-oauth = { workspace = true }
systemprompt-oauth-issuance = { workspace = true }
systemprompt-database = { workspace = true }
systemprompt-marketplace = { workspace = true }
systemprompt-content = { workspace = true }
systemprompt-files = { workspace = true }
systemprompt-scheduler = { workspace = true }
systemprompt-analytics = { workspace = true }
systemprompt-security = { workspace = true }
systemprompt-governance = { workspace = true }
systemprompt-gateway = { workspace = true }
systemprompt-ai = { workspace = true }
systemprompt-generator = { workspace = true }
systemprompt-models = { workspace = true }
systemprompt-manifest = { workspace = true }
systemprompt-wire = { workspace = true }
systemprompt-config = { workspace = true }
systemprompt-loader = { workspace = true }
systemprompt-identifiers = { workspace = true }
systemprompt-traits = { workspace = true }
systemprompt-extension = { workspace = true }
systemprompt-cloud = { workspace = true }
systemprompt-client = { workspace = true }

# Additional dependencies used by CLI modules
tracing = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
schemars = { workspace = true }
chrono = { workspace = true }
console = { workspace = true }
tabled = { workspace = true }
inventory = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
futures-util = { workspace = true }
sse-stream = { workspace = true }
bytes = { workspace = true }
# The CLI drives MCP servers over the streamable-HTTP client *trait*, supplying
# our own reqwest-0.12 `HttpClientWithContext` via `with_client`. The `-reqwest`
# impl feature (a second reqwest 0.13) is deliberately NOT enabled. The workspace
# default is lean (see root Cargo.toml); these are additive on rmcp's defaults.
rmcp = { workspace = true, features = ["client", "transport-streamable-http-server", "transport-streamable-http-server-session", "transport-streamable-http-client"] }
dialoguer = { workspace = true }
dirs = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
walkdir = { workspace = true }
url = { workspace = true }
rand = { workspace = true }
indicatif = { workspace = true }
regex = { workspace = true }
semver = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
jsonwebtoken = { workspace = true }
