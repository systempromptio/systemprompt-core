[package]
name = "systemprompt-marketplace-entry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The marketplace entry surface of systemprompt.io: the marketplace catalogue and plugin-file routes, and the core marketplace, plugins and skills commands."
readme = "README.md"
include = ["src/**/*", "Cargo.toml", "README.md", "CHANGELOG.md"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
http = [
    "systemprompt-extension/router",
    "dep:systemprompt-config",
    "dep:systemprompt-identifiers",
    "dep:systemprompt-manifest",
    "dep:systemprompt-marketplace",
    "systemprompt-marketplace/http",
    "dep:systemprompt-models",
    "dep:axum",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:tokio",
    "dep:tracing",
    "dep:url",
]
cli = [
    "systemprompt-extension/cli",
    "dep:systemprompt-identifiers",
    "dep:systemprompt-loader",
    "dep:systemprompt-manifest",
    "dep:systemprompt-marketplace",
    "dep:systemprompt-models",
    "dep:anyhow",
    "dep:clap",
    "dep:schemars",
    "dep:serde",
    "dep:serde_json",
    "dep:serde_yaml",
    "dep:tracing",
]

[dependencies]
systemprompt-config = { workspace = true, optional = true }
systemprompt-extension = { workspace = true }
systemprompt-identifiers = { workspace = true, optional = true }
systemprompt-loader = { workspace = true, optional = true }
systemprompt-manifest = { workspace = true, optional = true }
systemprompt-marketplace = { workspace = true, optional = true }
systemprompt-models = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }
