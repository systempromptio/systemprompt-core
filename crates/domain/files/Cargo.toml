[package]
name = "systemprompt-files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "File storage, metadata, and access control for systemprompt.io AI governance infrastructure. Governed file operations for the MCP governance pipeline."
readme = "README.md"
include = ["src/**/*", "schema/**/*", "Cargo.toml", "README.md", "CHANGELOG.md", ".sqlx/**/*", "build.rs"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[build-dependencies]
systemprompt-extension = { workspace = true }

[dependencies]
systemprompt-cloud = { workspace = true }
systemprompt-database = { workspace = true }
systemprompt-extension = { workspace = true, features = ["sqlx"] }
systemprompt-identifiers = { workspace = true, features = ["sqlx"] }
systemprompt-manifest = { workspace = true }
systemprompt-models = { workspace = true }
systemprompt-config = { workspace = true }
systemprompt-provider-contracts = { workspace = true }
systemprompt-traits = { workspace = true, features = ["sqlx"] }
systemprompt-governance = { workspace = true }
systemprompt-events = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
walkdir = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
inventory = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
serde_yaml = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
pulldown-cmark = { workspace = true }
ammonia = { workspace = true }
scraper = { workspace = true }
ego-tree = { workspace = true }
diffy = { workspace = true }
flate2 = { workspace = true }
pdf-writer = { workspace = true }
zip = { workspace = true, optional = true }
quick-xml = { workspace = true }
umya-spreadsheet = { workspace = true, optional = true }
loro = { workspace = true, optional = true }

[features]
office = ["dep:zip", "dep:umya-spreadsheet"]
collab = []
collab-loro = ["collab", "dep:loro"]

[package.metadata.cargo-machete]
# inventory: compile-time registration via register_extension!/submit_* macros (::inventory::submit!)
ignored = ["inventory"]
