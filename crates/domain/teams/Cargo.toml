[package]
name = "systemprompt-teams"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Microsoft Teams integration for systemprompt.io. Validates Azure Bot Service activity tokens, maps Teams users to governed systemprompt identities, and dispatches to A2A agents under the same RBAC and audit pipeline as every other inbound surface."
readme = "README.md"
include = ["src/**/*", "Cargo.toml", "README.md", "CHANGELOG.md"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Inbound JWT validation + outbound HTTP
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }

# systemprompt.io integration
tracing = { workspace = true }
systemprompt-models = { workspace = true }
systemprompt-manifest = { workspace = true }
systemprompt-client = { workspace = true }
systemprompt-identifiers = { workspace = true, features = ["sqlx"] }

[package.metadata.cargo-machete]
# thiserror: derived through the domain_error! macro (#[derive(::thiserror::Error)])
ignored = ["thiserror"]
