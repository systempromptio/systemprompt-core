[package]
name = "systemprompt-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Native Model Context Protocol (MCP) implementation for systemprompt.io. Orchestration, per-server OAuth2, RBAC middleware, and tool-call governance — the core of the AI governance pipeline."
readme = "README.md"
include = ["src/**/*", "schema/**/*", "build.rs", "Cargo.toml", "README.md", "CHANGELOG.md", ".sqlx/**/*"]

[lints]
workspace = true

[build-dependencies]
systemprompt-extension = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Core dependencies
tokio = { workspace = true, features = ["signal"] }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
jsonwebtoken = { workspace = true }

# Database
sqlx = { workspace = true }

# MCP Protocol
# MCP server/client transports live here. We opt into the streamable-HTTP client
# *trait* (`transport-streamable-http-client`) and implement it with our own
# reqwest-0.12 `HttpClientWithContext`, so the `-reqwest` impl feature (which
# pulls a second reqwest 0.13) is deliberately NOT enabled. The workspace default
# is lean (see root Cargo.toml); these are additive on top of rmcp's defaults.
rmcp = { workspace = true, features = ["client", "elicitation", "request-state", "transport-streamable-http-server", "transport-streamable-http-server-session", "transport-streamable-http-client"] }

# HTTP for MCP servers
reqwest = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
sse-stream = { workspace = true }
bytes = { workspace = true }

# CLI

# JWT validation

# systemprompt.io integration
systemprompt-provider-contracts = { workspace = true }
systemprompt-database = { workspace = true }
systemprompt-storage = { workspace = true }
systemprompt-extension = { workspace = true, features = ["mcp"] }
systemprompt-identifiers = { workspace = true, features = ["sqlx"] }
systemprompt-loader = { workspace = true }
systemprompt-logging = { workspace = true }
systemprompt-models = { workspace = true, features = ["mcp", "sqlx"] }
systemprompt-manifest = { workspace = true }
systemprompt-client = { workspace = true }
systemprompt-config = { workspace = true }
systemprompt-traits = { workspace = true }
systemprompt-security = { workspace = true }
systemprompt-governance = { workspace = true }

# Process management
uuid = { workspace = true }
url = { workspace = true }

[package.metadata.cargo-machete]
# thiserror: derived through the domain_error! macro (#[derive(::thiserror::Error)])
ignored = ["thiserror"]
