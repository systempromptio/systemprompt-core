[package]
name = "systemprompt-manifest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Services manifest, profile and boot-time configuration for systemprompt.io AI governance infrastructure. Agents, plugins, hooks, MCP servers, provider registry and gateway policy, with their startup validators."
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
semver = { workspace = true, features = ["serde"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
schemars = { workspace = true }
regex = { workspace = true }

# Secret hygiene: wipe credential material from memory on drop
zeroize = { workspace = true }

# URL parsing for outbound-endpoint (SSRF) validation
url = { workspace = true }

# Typed CIDR ranges for trusted_proxies (parse-on-deserialize, fail-closed)
ipnet = { workspace = true }

# Services-bundle content hashing + ed25519 public-key validation
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }

systemprompt-identifiers = { workspace = true }
systemprompt-models = { workspace = true }
systemprompt-provider-contracts = { workspace = true }
systemprompt-traits = { workspace = true }
systemprompt-wire = { workspace = true }
