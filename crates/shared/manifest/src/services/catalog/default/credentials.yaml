# Default credentials: one platform credential per vendor API key secret.
#
# Part of core's embedded default catalog (`DefaultCatalog`); the setup
# wizard and cloud-init seed an install's services/ai from these files.

credentials:
  anthropic: { kind: platform, secret: anthropic }
  openai: { kind: platform, secret: openai }
  gemini: { kind: platform, secret: gemini }
