# Default models: core's out-of-the-box model knowledge.
#
# Part of core's embedded default catalog (`DefaultCatalog`); the setup
# wizard and cloud-init seed an install's services/ai from these files, and
# the catalog-parity tests read them. Each model is defined once: identity,
# client families, capability overrides on its provider's defaults, limits
# and base price. Where it is served is deployments.yaml.
#
# Pricing is per *million* tokens (`ModelPricing`). `cache_read_per_million`
# is mandatory on every token-priced model: an absent rate is a boot failure,
# so a cached prompt slice can never be billed at nothing by omission. OpenAI
# and Google both discount a cached input token to 25% of the uncached rate,
# which is the figure below; a model that bills no cache reads carries an
# explicit 0.0. `clients: []` is a model that dispatches by id but is never
# advertised.
#
# Model sets are reconciled against each vendor's live `/models` endpoint and
# their published rate cards. Anthropic lifecycle and visibility were last
# reconciled on 2026-09-22 (Opus 5.5 added, Claude 4.x Opus/Sonnet dropped);
# other providers were last reconciled on 2026-06-01:
#   - Anthropic: https://platform.claude.com/docs/en/about-claude/pricing
#   - OpenAI:    https://openai.com/api/pricing/
#   - Google:    https://ai.google.dev/gemini-api/docs/pricing
# Every id below is a real model at its provider; retired ids (Claude 3.x,
# o1-mini/o1-preview, dall-e-2/3, Gemini 1.5) have been dropped.

models:
  # -- anthropic -------------------------------------------------------------
  claude-sonnet-5:
    clients: [claude]
    limits: { context_window: 1000000, max_output_tokens: 128000 }
    pricing: { input_per_million: 2.0, output_per_million: 10.0, cache_read_per_million: 0.2, cache_write_per_million: 2.5 }
