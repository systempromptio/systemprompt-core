# Vertex AI rate card: the prices we bill, and the allowlist of Vertex models
# the gateway will serve.
#
# Why one file for both jobs: Vertex's publisher listing carries no modality
# field, so `gemini-2.5-flash` (chat), `gemini-embedding-001` (embeddings) and
# `gemini-2.5-flash-tts` (speech) are indistinguishable by shape. Discovery
# therefore cannot decide what is chat-capable on its own — an entry here is
# the decision, and it has to carry a price anyway before the gateway will
# dispatch to it (boot refuses an unpriced route). A model absent from this
# file is reported as discovered-but-unpriced and never published.
#
# `upstream` is the model as Vertex names it (`{publisher}/{model}` from
# `publishers/{publisher}/models/{model}`); `upstream_model` is what our wire
# puts on the request — the bare name for the gemini wire, the publisher-
# qualified name for the MaaS openai-chat surface.
#
# `allow_preview` publishes a model whose launchStage is not GA. It is off by
# default: a preview model can change or vanish under a running deployment.
entries:
# -- provider `vertex` (wire: gemini) -----------------------------------------
# Why: Vertex serves Gemini at the same rate card as the public endpoint --
# cloud.google.com/vertex-ai/generative-ai/pricing, read 2026-09-05. Cache
# writes are billed as storage per hour, not per token, hence an explicit 0.0.
- upstream: google/gemini-2.5-pro
  provider: vertex
  id: vertex-gemini-2.5-pro
  upstream_model: gemini-2.5-pro
  pricing:
    input_per_million: 1.25
    output_per_million: 10.0
    cache_read_per_million: 0.31
    cache_write_per_million: 0.0
    per_image_cents: null
  capabilities:
    vision: true
    streaming: true
    tools: true
    structured_output: true
    system_prompts: true
    reasoning: true
  limits:
    context_window: 1000000
    max_output_tokens: 65536
    max_thinking_budget: 32768
- upstream: google/gemini-2.5-flash
  provider: vertex
  id: vertex-gemini-2.5-flash
  upstream_model: gemini-2.5-flash
  pricing:
    input_per_million: 0.3
    output_per_million: 2.5
    cache_read_per_million: 0.075
    cache_write_per_million: 0.0
    per_image_cents: null
  capabilities:
    vision: true
    streaming: true
    tools: true
    structured_output: true
    system_prompts: true
    reasoning: true
  limits:
    context_window: 1000000
    max_output_tokens: 65536
    max_thinking_budget: 24576
- upstream: google/gemini-2.5-flash-lite
