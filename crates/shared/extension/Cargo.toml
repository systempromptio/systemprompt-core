[package]
name = "systemprompt-extension"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Composition contract for systemprompt.io AI governance infrastructure: members declare schemas, routes, commands, jobs and providers, admitted by the composition and re-checked by the kernel."
readme = "README.md"

[lints]
workspace = true

[features]
sqlx = ["dep:sqlx"]
router = ["dep:axum", "dep:futures"]
cli = ["dep:clap"]
slack = []
teams = []

[dependencies]
thiserror = { workspace = true }
inventory = { workspace = true }
sqlx = { workspace = true, optional = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
xxhash-rust = { workspace = true }
axum = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
http = { workspace = true }
schemars = { workspace = true }
systemprompt-provider-contracts = { workspace = true }
systemprompt-traits = { workspace = true }
systemprompt-identifiers = { workspace = true }
systemprompt-models = { workspace = true }
systemprompt-manifest = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
