[root]
section = "Changed"
area = "Scheduler"
text = "`database_cleanup` deletes through the `RetentionPurge` the admitted owner of each table contributes and `backfill_rollups` drains the admitted projections; the scheduler depends on no capability crate, and a job runs inside the admitted job-run scopes (the files crate sets the system document actor). A manual run of a job whose extension the profile disables is refused naming the extension, distinct from a job no member contributes."

[[crate]]
name = "systemprompt-scheduler"
section = "Changed"
text = "`database_cleanup` deletes through admitted `RetentionPurge`s, `backfill_rollups` drains admitted projections, and job runs execute inside admitted `JobRunScope`s. The crate depends on no capability crate."
