[root]
section = "Breaking"
area = "Facade"
text = "The facade's `full` feature is removed; `reference` is the reference composition (the kernel `runtime` and every core capability; `slack` and `teams` stay opt-in) and admits the same members `full` did. `runtime` is the kernel (`api`, `cli`, `logging`, `security`, `events`, `config`): `Composition`, `reference()` and the `systemprompt` binary need it, and with only `core,runtime` `reference()` holds the kernel members alone. The new `ai` feature carries the `ai` member. The supported compositions are listed in [feature flags](../reference/feature-flags.md#supported-compositions): `reference` (with and without `slack` and `teams`), `runtime`, four flavours (gateway, MCP, agents, site), `api`, the gateway library (`api`, `ai`), the minimal kernel (`core`, `database`) and `core`; CI builds each and boots every one that links the `systemprompt` binary, and any other feature combination is unsupported. Migrate by replacing `features = [\"full\"]` with `features = [\"reference\"]`, or with `runtime` and the capability features a binary keeps."

[[crate]]
name = "systemprompt"
section = "Breaking"
text = "The `full` feature is removed; `reference` replaces it with the same member set, and the binary, `Composition`, `reference()` and the modules gated on `full` are gated on `reference`. The `ai` feature is added, and `mcp` also enables `systemprompt-models/mcp`."
