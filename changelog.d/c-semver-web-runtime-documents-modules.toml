[[crate]]
name = "systemprompt-runtime"
section = "Breaking"
text = "`documents::views`, `documents::links`, `documents::download`, `documents::upload_links`, `documents::refusal` and `documents::attribution` are removed with their items, among them `ReadView`, `ReadInput`, `ReadOutput`, `EditOutput`, `AccessOutput`, `CommentOutput`, `PeopleOutput`, `PeopleSearch`, `ProposalChange`, `ProposalChangeKind`, `RenderedLines`, `LinkIssuer`, `ApiLinkIssuer`, `LinkMinter`, `LinkRequest`, `LinkTarget`, `IssuedLink`, `LinkIssueError`, `LinkMintError`, `LinkRefusal`, `DownloadTarget`, `DownloadLinkError`, `Rendition`, `UploadGrant`, `UploadLinkTarget`, `SignedUploadLinks`, `Refusal`, `RefusalCode`, `read_view`, `render`, `mint_link`, `mint_verified`, `verify_link_hop`, `issue_download_link`, `issue_upload_links`, `signed_download_url`, `signed_upload_links`, `required_grant`, `purpose_permits`, `stale_base`, `attributed_context`, `request_author`, `edit_origin` and `comment_origin`, and the consts `MAX_LINES`, `MAX_WRITTEN`, `DEFAULT_PEOPLE`, `DOWNLOAD_AUDIENCE`, `DOWNLOAD_TOKEN_QUERY`, `DOWNLOAD_FORMAT_QUERY`, `DOWNLOAD_FORMAT_PDF`, `DOWNLOAD_TTL`, `UPLOAD_AUDIENCE`, `UPLOAD_LINK_TTL`, `UPLOAD_TOKEN_HEADER`, `USER_SUBJECT_KIND` and `ROLE_SUBJECT_KIND`. Each item keeps its name and module under `systemprompt_documents` (`systemprompt_documents::views`, `systemprompt_documents::links`, `systemprompt_documents::download`, `systemprompt_documents::upload_links`, `systemprompt_documents::refusal`, `systemprompt_documents::attribution`; the subject kinds at the crate root); `signed_download_url` and `signed_upload_links` take `&DocumentLinkTokens`."
