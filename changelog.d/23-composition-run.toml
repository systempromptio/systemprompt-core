[root]
section = "Breaking"
area = "Facade"
text = "A binary is a composition: `systemprompt::reference().with(member).without::<Member>().run()` admits the members, drops every contribution of a member the profile disables before any provide fn, factory or slot build runs, and starts the CLI or server. `RuntimeBuilder` and `RuntimeError` are removed from the facade, and `systemprompt_cli::{run, run_process, run_process_with, run_with}` are replaced by `run_composed(build, declared, secrets, admit)`. An id in `extensions.disabled` that names no composed member, a disabled required member, a member requiring a disabled member and two members providing one type fail boot (`CompositionError`). External secrets sources are declared with `Composition::secrets_source`. Migrate an install `main` to `systemprompt::reference()` plus its own members and `run()`."

[[crate]]
name = "systemprompt"
section = "Breaking"
text = "`Composition`, `reference()`, `with`, `without`, `secrets_source` and `run` build the binary; `RuntimeBuilder`, `RuntimeError` and the re-exports of removed macros are removed. `CompositionError` reports unknown disabled ids, duplicate ids, disabled required members and dependencies, unmet requirements, duplicate providers, install substitution, conferral mismatches, reserved paths and dimension conflicts (carrying a `RuleType`)."

[[crate]]
name = "systemprompt-cli"
section = "Breaking"
text = "`run`, `run_process`, `run_process_with` and `run_with` are replaced by `run_composed(build, declared, secrets, admit)`; `AdmitFn` takes `Option<&Profile>`; `runner::admit_unprofiled` admits a database-only kernel command on a bare `--database-url` run."

[[crate]]
name = "systemprompt-config"
section = "Breaking"
text = "`register_secrets_source!`, `SecretsSourceRegistration` and `registered_external_kinds` are removed; `SecretsSources` carries the composition's external secrets sources and `SecretsService::load`, `from_secrets` and `build_external_provider` take it. `yaml_document` (with `YamlDocumentError`) is added."
