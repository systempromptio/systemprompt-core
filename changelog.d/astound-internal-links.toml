[root]
section = "Fixed"
area = "API"
text = "a `worker` node serves `POST /api/v1/internal/links` (route group `InternalLinks`, also on `api` and `all`), so `issue_attachment`, `documents_upload` and link-based `documents_export` work on a role-split install, where a managed MCP server asks its own node for a signed link; the worker mounts none of the documents surface, and the links it signs point at `api_external_url`. `LinkRefusal` gains `Unavailable` (any status but 401, 403, 409 and 500), and the tools report an unreachable link endpoint or the status it returned (`LinkIssueError::tool_message`) instead of \"the upload links could not be signed\"."

[[crate]]
name = "systemprompt-extension"
section = "Breaking"
text = "`RouteGroup` gains `InternalLinks`. Migrate by adding the match arm."

[[crate]]
name = "systemprompt-runtime"
section = "Breaking"
text = "`documents::links::LinkRefusal` gains `Unavailable`. Migrate by adding the match arm."
