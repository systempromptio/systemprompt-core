[root]
section = "Added"
area = "Extensions"
text = "a member contributes non-gating `DiagnosticProbe` entries to `/health/detail` with `Contributions::diagnostic`; a failing or overrunning probe is a degraded entry and never affects `/readyz`. The notifications and brain consumer backlogs on `/health/detail` are reported this way, with unchanged fields."

[[crate]]
name = "systemprompt-extension"
section = "Added"
text = "`DiagnosticProbe`, `DiagnosticFailure`, `DiagnosticDetail` and `Contributions::diagnostic`."

[[crate]]
name = "systemprompt-models"
section = "Added"
text = "`LateBound<T>` and `AlreadyBound`, the one bind-once cell; `authz::AlreadyBound` moves here and `SubjectSourceHandle` is built on it."

[[crate]]
name = "systemprompt-notifications"
section = "Added"
text = "The notifications member reports its consumer backlog as a diagnostic probe."

[[crate]]
name = "systemprompt-brain"
section = "Added"
text = "The brain member reports its consumer backlog as a diagnostic probe; `BrainHandle::start_consumer` refuses a second consumer with `AlreadyBound`."
