[root]
section = "Breaking"
area = "Security"
text = "A member reads a custom secret only when the profile grants it: `extensions.secrets` maps a member id to exact names and `prefix_*` patterns, matched byte-exactly. A declaration no grant covers fails boot with `KernelError::UngrantedSecret`; an unknown member id in `extensions.secrets` fails boot with `CompositionError::UnknownSecretGrant`. A name the platform references (pinned keys, `licence_signing_secret`, `mcp_credential_broker_secret`, and every secret field of the profile and services config, found by walking their serialized form) stays refused when granted. Migrate by adding `extensions: { secrets: { <member>: [<names>] } }` to every profile whose installs declare secrets."

[[crate]]
name = "systemprompt-manifest"
section = "Breaking"
text = "`ExtensionsConfig` gains `secrets` and `secret_grants`; `ProfileSecretReferences` is added; `ServicesConfig::secret_references` returns `Option<Vec<String>>` (`None` references every name) and walks the serialized config; `LICENCE_SIGNING_SECRET` moves to `systemprompt_traits`."

[[crate]]
name = "systemprompt-traits"
section = "Breaking"
text = "`SecretStore::secret_exact` is required; `DeclaredSecrets::over` takes the granted patterns; `SecretPattern`, `SecretPatternError`, `CORE_SECRET_NAMES`, `LICENCE_SIGNING_SECRET`, `MCP_CREDENTIAL_BROKER_SECRET` and `is_core_secret_name` are added."

[[crate]]
name = "systemprompt-extension"
section = "Breaking"
text = "`Contributions::secret_prefix` is added; `ContributionSink::declared_secrets` returns `&[SecretPattern]`; `AdmittedMember` gains `secret_grants`; `SecretDeclarations::new` takes `MemberSecrets` per member."

[[crate]]
name = "systemprompt-runtime"
section = "Breaking"
text = "`KernelError::UngrantedSecret` is added; `KernelError::ReservedSecret::name` is a `SecretPattern`."

[[crate]]
name = "systemprompt-mcp"
section = "Removed"
text = "`BROKER_SECRET_KEY`; use `systemprompt_traits::MCP_CREDENTIAL_BROKER_SECRET`."
