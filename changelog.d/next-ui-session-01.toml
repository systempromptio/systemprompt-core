[root]
section = "Breaking"
area = "API"
text = "`routes::oauth::discovery::WellKnownResponse` gains `ui_session_supported` and `ui_session`. Migrate a struct literal by adding `ui_session_supported: true, ui_session: UiSessionDiscovery::from_config(&config.ui_session)`."

[[crate]]
name = "systemprompt-oauth-issuance"
section = "Breaking"
text = "`UserTokenParams` gains `session_started_at`, and `sso::mint_browser_session` takes `authenticated_at: DateTime<Utc>` before `analytics`. Migrate by passing the code's issue time (or the consumed refresh token's `session_started_at`) and the time the person signed in."

[[crate]]
name = "systemprompt-oauth-issuance"
section = "Added"
text = "The OIDC provider reads the `id_token` `auth_time` claim into `ExternalIdentity::authenticated_at`, and the SSO session cookie carries it as `auth_time`, never later than the return."

[[crate]]
name = "systemprompt-oauth-issuance"
section = "Fixed"
text = "A refresh no longer re-stamps `auth_time`: every token of the authorization-code and refresh grants carries the grant's sign-in time, for the `sp_web` client as for a UI session."

[[crate]]
name = "systemprompt-oauth-issuance"
section = "Changed"
text = "A UI session's absolute cap counts from the session start (the authorization code's issue) and its `auth_time` is the code's sign-in time; the two were one timestamp."

[[crate]]
name = "systemprompt-oauth-issuance"
section = "Changed"
text = "A UI session's access lifetime and absolute cap are read from `Config::ui_session` (`security.ui_session.access_ttl_secs`, `absolute_secs`); the defaults are the former fixed 300 seconds and 12 hours."

[[crate]]
name = "systemprompt-oauth"
section = "Breaking"
text = "`AuthCodeParams` and `MintAuthCodeParams` gain `authenticated_at`, `AuthCodeValidationResult` gains `authenticated_at`, and `RefreshTokenParams` and `ConsumedRefreshToken` gain `session_started_at`. Migrate a code mint by stating when the person signed in, and a refresh-token store by passing the code's `issued_at` or the consumed token's `session_started_at`."

[[crate]]
name = "systemprompt-oauth"
section = "Breaking"
text = "`generate_jwt` refuses a `JwtConfig` with `browser_session` or `ui_session` set and `auth_time: None` (`TokenError::SignInTimeMissing`). Migrate by setting `auth_time`."

[[crate]]
name = "systemprompt-oauth"
section = "Added"
text = "Migration `026` adds `oauth_auth_codes.authenticated_at` (backfilled from `created_at`) and `oauth_refresh_tokens.session_started_at` (backfilled from `authenticated_at`). A stored code's sign-in time is never later than its issue."

[[crate]]
name = "systemprompt-oauth"
section = "Fixed"
text = "The passkey pages (`webauthn_oauth.html`, `link_passkey.html`) post the credential's binary fields as unpadded base64url strings, the only form `webauthn-rs` 0.6.2 reads; they sent byte arrays, which the finish endpoints refused with a 400."

[[crate]]
name = "systemprompt-api"
section = "Breaking"
text = "`routes::oauth::discovery::WellKnownResponse` gains `ui_session_supported` and `ui_session`. Migrate a struct literal by adding `ui_session_supported: true, ui_session: UiSessionDiscovery::from_config(&config.ui_session)`."

[[crate]]
name = "systemprompt-api"
section = "Breaking"
text = "`routes::oauth::discovery::UiSessionDiscovery::current()` is replaced by `UiSessionDiscovery::from_config(&UiSessionConfig)`. Migrate by passing `&ctx.config().ui_session`."

[[crate]]
name = "systemprompt-api"
section = "Breaking"
text = "`routes::oauth::authenticated_router()` no longer carries `/revoke`; it is `routes::oauth::revocation_router()`. Migrate a hand-assembled router with `.merge(revocation_router())`."

[[crate]]
name = "systemprompt-api"
section = "Added"
text = "The step-up on the document and folder routes and the `ui_session` discovery block read `Config::ui_session`: the window and the `max_age` of the `401` follow `security.ui_session.step_up_max_age_secs`, and discovery reports the configured lifetimes."

[[crate]]
name = "systemprompt-api"
section = "Added"
text = "`POST /oauth/revoke` admits a person's UI session as the caller, limited to tokens of the same user and the same `client_id`; revoking its refresh token also ends the bearer it presented."

[[crate]]
name = "systemprompt-api"
section = "Added"
text = "The OAuth well-known documents and `endpoints.oauth` of `GET /api/v1` carry `ui_session_supported` and `ui_session` (`access_token_lifetime`, `session_lifetime`, `step_up_max_age`, in seconds)."

[[crate]]
name = "systemprompt-api"
section = "Changed"
text = "The passkey completion (`/oauth/webauthn/complete`) states the sign-in time on the authorization code it mints: the moment the ceremony completes."

[[crate]]
name = "systemprompt-api"
section = "Fixed"
text = "Revoking a `ui`-audience access token answered `200` and revoked nothing; its `jti` and session are now revoked."

[[crate]]
name = "systemprompt-cli"
section = "Changed"
text = "`admin setup` profiles set `security.ui_session` to its defaults, which a written profile omits."

[[crate]]
name = "systemprompt-cloud"
section = "Changed"
text = "Authored profiles set `security.ui_session` to its defaults, which a written profile omits."

[[crate]]
name = "systemprompt-config"
section = "Added"
text = "`build_from_profile` carries `security.ui_session` onto `Config::ui_session`."

[[crate]]
name = "systemprompt-security"
section = "Breaking"
text = "`user_claims` and `DeploymentTokenAuthority::mint_user_jwt` return `TokenError::SignInTimeMissing` for a request with `browser_session` or `ui_session` set and `auth_time: None`; the sign-in time was defaulted to now. Migrate by setting `UserJwtRequest::auth_time`."

[[crate]]
name = "systemprompt-manifest"
section = "Breaking"
text = "`SecurityConfig` and `Config` gain `ui_session: UiSessionConfig`. Migrate a struct literal by adding `ui_session: UiSessionConfig::default()`."

[[crate]]
name = "systemprompt-manifest"
section = "Added"
text = "`profile::UiSessionConfig` (`security.ui_session`): `access_ttl_secs` (default `300`), `absolute_secs` (default `43200`) and `step_up_max_age_secs` (default `600`), with `step_up_required(auth_time, now)`. Profile validation bounds them to `60`–`3600`, `300`–`2592000` and `60`–`absolute_secs`, and refuses an `access_ttl_secs` above `absolute_secs`."

[[crate]]
name = "systemprompt-models"
section = "Breaking"
text = "`auth::TokenError` gains `SignInTimeMissing`: a `UserJwtRequest` with `browser_session` or `ui_session` set states its `auth_time`. Migrate by setting it to when the person signed in."

[[crate]]
name = "systemprompt-models"
section = "Breaking"
text = "`auth::ui_session` is removed with `UI_SESSION_ACCESS_TTL_SECS`, `UI_SESSION_ABSOLUTE_SECS`, `UI_SESSION_STEP_UP_MAX_AGE_SECS` and `step_up_required`. Migrate by reading the lifetimes from `systemprompt_manifest::profile::UiSessionConfig` (`Config::ui_session`) and calling its `step_up_required`."

[[crate]]
name = "systemprompt-traits"
section = "Breaking"
text = "`sso::ExternalIdentity` gains `authenticated_at: Option<DateTime<Utc>>`. Migrate a provider by setting the time the identity provider asserts the person authenticated, or `None`."
