[root]
section = "Changed"
area = "CLI"
text = "`plugins seams` lists every seam from a registration that names its owning extension (`register_linked_seam!`), so a capability's entry crate contributes its own seams: `agent_run_origins` is listed when the binary links `systemprompt-agent-runs-entry` with its `cli` feature, and `gateway_routes` and `gateway_request_guards` list each registered route group and guard with the extension that owns it. Seams are ordered by name and gain an `extension` column (`kernel` for a seam the kernel owns). An entry is active only while the seam's owning extension and the entry's own owner are both enabled; an entry whose own owner is disabled is rendered `[owner: owner_disabled]`. A requirement is met only by active entries, so a required seam is `missing`, and the command exits non-zero, when the entry is absent, when its owner or the seam's owner is disabled, or when no linked crate registers the seam (owner `unregistered`). A seam with entries but none active and no requirement on it is `owner_disabled` and does not fail the command."

[[crate]]
name = "systemprompt-cli"
section = "Added"
text = "`kernel::LinkedSeamRegistration`, `register_linked_seam!`, `kernel::registered_seams`, `kernel::SeamEntry` (`new`, `owned_by`) and the renderers `kernel::{named, owned, prioritized, unnamed}`: each seam `plugins seams` lists is a registration carrying its owning extension id, and each entry may carry its own. `plugins seams` lists `gateway_routes` and attributes gateway guards and route groups to their owning extensions."

[[crate]]
name = "systemprompt-cli"
section = "Breaking"
text = "`plugins::seams::evaluate` takes the profile's disabled-extension set; `LinkedSeam` and `SeamRow` gain `extension`, and `LinkedSeam::entries` is `Vec<SeamEntry>`; `SeamStatus` gains `OwnerDisabled` (`owner_disabled`); `LinkedSeam::new` is replaced by `LinkedSeam::enumerate(&LinkedSeamRegistration)`. A requirement is met only by entries whose seam owner and own owner are enabled."
