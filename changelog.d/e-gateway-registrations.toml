[root]
section = "Breaking"
area = "Gateway"
text = "`register_gateway_guard!` takes the owning extension id as its first argument (`register_gateway_guard!(\"owner\", Type)` or `register_gateway_guard!(\"owner\", factory = f)`). A guard naming an owner that is not an extension linked into the binary refuses boot; a guard whose linked owner is disabled in the profile, or absent from the context's registry, is not installed, with a warning and an entry in the server's startup summary. A capability serves a route group inside the gateway surface with `register_gateway_route!(extension = .., path = .., scope = .., budget = .., factory = ..)`: the gateway applies its own credential verification, bearer window and access log under the registration's scope and budget, every linked registration must be listed in the core declaration table with that extension id, path, scope and budget, a registration overlapping another or a built-in gateway prefix refuses boot, the built-in gateway routers answer only paths under `builtin_gateway_prefixes()`, a registered router answers only paths under its own path, and a registration whose extension is disabled is not built (its paths answer 404). Migrate by adding the owning extension id to each `register_gateway_guard!`."

[[crate]]
name = "systemprompt-extension"
section = "Breaking"
text = "`register_gateway_guard!` takes the owning extension id as its first argument and `GatewayRequestGuardRegistration` gains `extension`; `GatewayGuards::discover` returns `Result<Self, GatewayGuardError>`, installs a guard only while its owning extension is in the context's registry and not disabled, and refuses one whose owner is not linked into the binary (the `register_extension!` inventory) with `GatewayGuardError::UnknownOwner`. Migrate by naming the owner in each registration and propagating the error."

[[crate]]
name = "systemprompt-extension"
section = "Added"
text = "`GatewayGuardError`, `GatewayGuards::registrations` (the linked registrations with their owners), `GatewayGuards::from_registrations(ctx, registrations, linked, disabled)` (selection over given registrations, linked extension ids and disabled set), `GatewayGuards::installed_owners`, `GatewayGuards::not_installed` (owners of the guards left out) and `GatewayGuards::len`."

[[crate]]
name = "systemprompt-gateway"
section = "Breaking"
text = "`GatewayEnginesError` gains `Guards(GatewayGuardError)`, raised when the gateway guard set cannot be built."

[[crate]]
name = "systemprompt-api"
section = "Added"
text = "`register_gateway_route!`, `GatewayRouteRegistration { extension, path, scope, budget, factory }`, `GatewayRouteFactory` and `GatewayCredential` on `systemprompt_api::kernel`; `routes::gateway::registered::{GatewayRouteError, admit_registrations}` (taking the built-in prefixes); `routes::gateway::builtin::{builtin_gateway_prefixes, confined}`; `services::server::routes::report_gateway_guards`, which reports guards left out in the startup summary. The gateway mount admits every linked registration (`MountError::UnlistedGatewayRoute`, `MountError::GatewayRouteOverlap`, `MountError::GatewayRouteShadowsBuiltin`, `MountError::CoreDeclarationMismatch`) whether or not its extension is enabled, then builds the enabled ones."
