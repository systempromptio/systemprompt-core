[root]
section = "Breaking"
area = "Agent runs"
text = "The `/api/v1/agent-runs` routes are declared by the `agent_runs_api` member in the new `systemprompt-agent-runs-entry` crate, with the user gate, user context, the `agent_runs` rate limit on the tasks budget and the `Agent` route group, so the `all`, `api` and `worker` roles serve them. `systemprompt-api` and `systemprompt-cli` no longer have an `agent-runs` feature or depend on the agent-runs crates. A profile that disables `agent_runs_api` mounts no agent-runs route (404); one that disables `agent_runs` while `agent_runs_api` stays enabled is refused at boot. `admin agents run` reads its agent-run launcher from the host's resolved state; without one the agent processes every task itself. Migrate by enabling the facade's `agent-runs` feature in place of `systemprompt-api/agent-runs` / `systemprompt-cli/agent-runs`."

[[crate]]
name = "systemprompt-agent-runs-entry"
section = "Added"
text = "New crate: behind the `http` feature, `extension::AgentRunsApiExtension` (the `agent_runs_api` member, contributing its routes and requiring the `AgentRunRepository` the `agent_runs` member provides), `http::routes` and `http::AgentRunsState`, which reads the admitted run origins."

[[crate]]
name = "systemprompt-agent-runs"
section = "Changed"
text = "`AgentRunsExtension` provides one `AgentRunRepository` and a `DynAgentRunLauncher` over it into the resolved state; the run-directory retention job reads the repository from its job context."

[[crate]]
name = "systemprompt-agent-runs"
section = "Breaking"
text = "`AgentRunsExtension::launcher` and `RepositoryRunLauncher::shared` are removed. Migrate by reading `DynAgentRunLauncher` from the resolved state or building `RepositoryRunLauncher::new(repository)`."

[[crate]]
name = "systemprompt-api"
section = "Breaking"
text = "The `agent-runs` feature and `routes::agent_runs` are removed; the routes are `systemprompt_agent_runs_entry::http`, contributed by the `agent_runs_api` member."

[[crate]]
name = "systemprompt-cli"
section = "Breaking"
text = "The `agent-runs` feature is removed and `full` no longer names it. `admin agents run` resolves its launcher with `commands::admin::agents::run::RunLauncher::resolve` from the host's resolved state; `RunLauncher::Absent` leaves every task to the agent itself."
