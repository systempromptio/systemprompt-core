name = "systemprompt-database"
section = "Fixed"
text = "The catalog digest and the trigger-routine scan reread, bounded, through concurrent DDL (`XX000` on a dropped relation or cache entry, `40P01`, `40001`, `55P03`) instead of failing the schema install or boot."
