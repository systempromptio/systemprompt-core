[root]
section = "Fixed"
area = "Database"
text = "The live-schema catalog digest an install reads to decide whether it is settled, and the boot check of trigger routines, no longer fail when another session drops, or deadlocks with, a relation, index, view or function they listed. Each reads again, up to ten times within a second, on `XX000` \"could not open relation with OID\" or \"cache lookup failed for\", and on `40P01`, `40001` and `55P03`."

