[root]
section = "Changed"
area = "MCP"
text = "The API's proxy engine reads what is MCP-specific about a backend (external servers, the spawn port, managed and external session binding, the external upstream with its fixed tool arguments and per-call audit) through `ProxyBackendResolver`, which the `mcp-http` member provides sealed. A crashed proxied service restarts through its kind's process set, and the MCP startup reconciliation runs as `ServiceProcessSet::reconcile` of the `mcp` member's process set."

[[crate]]
name = "systemprompt-extension"
section = "Added"
text = "`router::{ProxyBackendResolver, ExternalUpstream, ProxiedCallGovernor, GovernedToolCall, CallAudit, ProxyBackendError, ProxyBodyStream, DynProxyBackendResolver}`."

[[crate]]
name = "systemprompt-traits"
section = "Added"
text = "`ServiceProcessSet::reconcile` (defaults to `Unsupported`)."

[[crate]]
name = "systemprompt-mcp"
section = "Added"
text = "`services::reconcile` (`reconcile`, `handle_missing_servers`, `verify_database_registration`, `ReconcileError`); the MCP process set implements `reconcile`."

[[crate]]
name = "systemprompt-mcp-entry"
section = "Added"
text = "`http::proxy::McpProxyBackends` and the moved proxy audit (`http::proxy::audit`), fixed arguments and `map_resolve_error`."

[[crate]]
name = "systemprompt-api"
section = "Breaking"
text = "`ProxyService::new()` takes no arguments and `with_mcp_backends(DynProxyBackendResolver)` replaces `with_mcp_audit`; `McpAuditSinks`, `services::proxy::audit`, `service::fixed_arguments` and `service::external::map_resolve_error` are removed (now in `systemprompt-mcp-entry`); `service::external::outbound_headers` takes the provider headers as a `HeaderMap`; `ServiceResolver::resolve` takes the optional MCP backends; `routes::proxy::mcp::router` takes the backends and returns a `Router`; `routes::proxy::agents::router` returns a `Router`; `ProxyError::AuditUnavailable` is replaced by `McpBackendsUnavailable` and the `RestartFailed`/`ExternalResolveFailed`/`SessionLookupFailed` sources are no longer `McpDomainError`; `lifecycle::reconciliation` keeps only `cleanup_stale_service_entries`."
