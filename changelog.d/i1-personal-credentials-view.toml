[root]
section = "Changed"
area = "Security"
text = "The gateway's personal provider-credential routes and the bridge manifest read `PersonalProviderCredentials`, the ai member's sealed caller-bound view conferred on `gateway-http`: every method takes the request's `GatewayPrincipal` and reads, stores or removes only that principal's rows. The whole AI repository set is no longer read by API code."

[[crate]]
name = "systemprompt-ai"
section = "Added"
text = "`PersonalProviderCredentials` with `list`, `store` and `remove`, provided sealed under the `gateway-provider-credentials` conferral row."

[[crate]]
name = "systemprompt-extension"
section = "Changed"
text = "`router::GatewayPrincipal` is available without the `router` feature."
