[root]
section = "Breaking"
area = "Database"
text = "The schema installer runs over the admitted composition (`install_admitted_schemas`, or `install_schema_members` for an explicit member set) and records the owner of every table it creates in `schema_table_owners` (migration 010) and each member's purge declarations in `schema_purge_records` (migration 011). A member declaring a table recorded to another member is refused before any DDL, including a member the profile disables, so a disabled member's recorded tables cannot be adopted. Before any DDL the installer judges each pending migration against table ownership (the record, then a member's declarative schema, then the tables a member's migrations create and do not drop again): a migration `CREATE TABLE` of another member's table is refused (`MigrationOwnershipError::SharedTable`); an `ALTER TABLE` (including `SET SCHEMA`), `DROP TABLE`, `TRUNCATE`, `RENAME`, `CREATE RULE`, `CREATE POLICY`, `ALTER POLICY`, `DROP POLICY|RULE ... ON`, `GRANT` or `REVOKE` on another member's table, also inside a `sql` routine body the migration defines, is refused (`MigrationOwnershipError::ForeignTable`); `DROP SCHEMA`, `ALTER SCHEMA ... RENAME` and `GRANT ... ON ALL ... IN SCHEMA` over `public` or a schema holding another member's objects, and `ALTER TABLE ALL IN TABLESPACE`, are refused (`MigrationOwnershipError::SchemaLevel`); an `INSERT`, `UPDATE`, `DELETE`, `MERGE` or `COPY` into a kernel ledger table is refused (`MigrationOwnershipError::LedgerWrite`), except a `DELETE` of the `extension_migrations` rows of ids no member or record holds. For an install member, a drop or move of another member's index, type, routine, sequence or view is refused (`MigrationOwnershipError::ForeignObject`), and a `CALL`, `EXECUTE`, `COPY` from a file or program, unparseable `sql` routine body or unclassified statement is refused (`MigrationOwnershipError::Unreadable`). A `DO` block (once per migration, naming the member and the migration), `CREATE INDEX`, `CREATE TRIGGER` and `DROP TRIGGER` on another member's table, non-`sql` routines, a top-level `SELECT` of a routine, an unknown index drop and a `CASCADE` drop of a foreign object are logged as unjudged. A member's `retirements()` may name a table (`DROP TABLE IF EXISTS`): the statement is not executed, the table is no longer the member's by its migrations or its record unless its declarative schema still creates it, and the install releases the member's record of it; `managed_resources` retires the five tables its migration 016 drops inside a `DO` block, so an install's drop of `managed_invocation_attributions` (still present where a consumer view read it) is admitted. A mutation of a table no member owns is not judged. An install whose pending migrations hold a refused kind fails its schema install until the migration is replaced. A migration recorded as applied, and a fresh database's stamped migrations, are not judged. `infra db doctor` reports tables and migration ledgers of a member outside the composition as `absent_member_tables` and `absent_member_ledgers` rather than as undeclared residue. The schema fingerprint no longer includes the disabled list, so a profile with disabled extensions runs one full schema install on its next boot. Upgrade: run one install with every member enabled so table ownership and purge declarations are recorded for each member."

[[crate]]
name = "systemprompt-database"
section = "Breaking"
text = "`install_admitted_schemas(&BuiltState, db, MigrationConfig)` replaces `install_extension_schemas_full`; `schema_currency(db, &BuiltState)` and `schema_currency::{assert_schema_current, recheck}` take `&BuiltState`; `SchemaMember` gains `standing()` and `purges()`, `SchemaUnit` gains `standing` and `purges`, and `SchemaResidue` gains `absent_member_tables` and `absent_member_ledgers`. Added `install_schema_members`, `AbsentMemberTable`, `lifecycle::{check_migration_ownership, migration_ownership_findings, MigrationMembers, MigrationOwnershipError, HiddenSql, KERNEL_LEDGERS, KERNEL_LEDGER_OWNER, RecordedTable, TableMutation}` and migrations `010_schema_table_owners` and `011_schema_purge_records`."

[[crate]]
name = "systemprompt-cli"
section = "Changed"
text = "`infra db doctor` reports `absent_member_tables` and `absent_member_ledgers`."
