[root]
section = "Breaking"
area = "Database"
text = "The schema installer runs over the admitted composition (`install_admitted_schemas`, or `install_schema_members` for an explicit member set) and records the owner of every table it creates in `schema_table_owners` (migration 010) and each member's purge declarations in `schema_purge_records` (migration 011). A member declaring a table recorded to another member is refused before any DDL, including a member the profile disables, so a disabled member's recorded tables cannot be adopted. Each install also records the owner of every index, routine, view, materialized view, sequence, type, domain and trigger in `schema_object_owners` (migration 012), so a disabled member keeps its objects as it keeps its tables. Before any DDL the installer judges each pending migration against ownership, tables and objects ranked alike (the record, then a core member before an install member, then a declarative schema before a migration, then composition order; a held-back member claims but is not judged): a migration `CREATE TABLE`, including `CREATE TABLE ... AS`, of another member's table is refused (`MigrationOwnershipError::SharedTable`); an `ALTER TABLE` (including `SET SCHEMA`), `DROP TABLE`, `TRUNCATE`, `RENAME`, `CREATE RULE`, `CREATE POLICY`, `ALTER POLICY`, `DROP POLICY|RULE ... ON`, `GRANT` or `REVOKE` on another member's table, also inside a `sql` routine body the migration defines, is refused (`MigrationOwnershipError::ForeignTable`); `DROP SCHEMA`, `ALTER SCHEMA ... RENAME` and `GRANT ... ON ALL ... IN SCHEMA` over `public` or a schema holding another member's objects, and `ALTER TABLE ALL IN TABLESPACE`, are refused (`MigrationOwnershipError::SchemaLevel`); an `INSERT`, `UPDATE`, `DELETE`, `MERGE` or `COPY` into a kernel ledger table is refused (`MigrationOwnershipError::LedgerWrite`), except a `DELETE` of the `extension_migrations` rows of ids no member or record holds. An index, routine, view, materialized view, sequence, type, domain or trigger is owned by the first member whose SQL creates it; for an install member, a create of another member's object (including `CREATE OR REPLACE`, `IF NOT EXISTS`, `CREATE OR REPLACE TRIGGER` and a declarative-schema create) and an `ALTER` (including `OWNER TO`, type attribute and domain constraint alters), `RENAME`, drop or move of it are refused whatever statement form names it, an `ALTER TABLE` of a view, sequence or index included (`MigrationOwnershipError::ForeignObject`), so naming a peer's object in a create never makes it the install's own; and a `CALL`, `EXECUTE`, `COPY` from a file or program, unparseable `sql` routine body or unclassified statement is refused (`MigrationOwnershipError::Unreadable`). A `DO` block (once per migration, naming the member and the migration), `CREATE EXTENSION`, `CREATE INDEX` on another member's table, a new trigger or a drop of the member's own trigger on another member's table, non-`sql` routines, a routine call in a top-level `SELECT` or a data write, an unknown index drop, every `CASCADE` drop of an install member and a core member's `CASCADE` drop of an object it does not own are logged as unjudged. A member's `retirements()` may name a table (`DROP TABLE IF EXISTS`): the statement is not executed, the table is no longer the member's by its migrations or its record unless its declarative schema still creates it, and the install releases the member's record of it; `managed_resources` retires the five tables its migration 016 drops inside a `DO` block, so an install's drop of `managed_invocation_attributions` (still present where a consumer view read it) is admitted. A table no member owns, including one its owner retired, may be mutated or declared by any member. An install whose pending migrations hold a refused kind fails its schema install until the migration is replaced. A migration recorded as applied, and a fresh database's stamped migrations, are not judged. `infra db doctor` reports tables and migration ledgers of a member outside the composition as `absent_member_tables` and `absent_member_ledgers` rather than as undeclared residue. The schema fingerprint no longer includes the disabled list, so a profile with disabled extensions runs one full schema install on its next boot. Upgrade: run one install with every member enabled so table ownership and purge declarations are recorded for each member."

[[crate]]
name = "systemprompt-database"
section = "Breaking"
text = "`install_admitted_schemas(&BuiltState, db, MigrationConfig)` replaces `install_extension_schemas_full`; `schema_currency(db, &BuiltState)` and `schema_currency::{assert_schema_current, recheck}` take `&BuiltState`; `SchemaMember` gains `standing()` and `purges()`, `SchemaUnit` gains `standing` and `purges`, and `SchemaResidue` gains `absent_member_tables` and `absent_member_ledgers`. Added `install_schema_members`, `AbsentMemberTable`, `lifecycle::{check_migration_ownership, migration_ownership_findings, MigrationMembers, MigrationOwnershipError, HiddenSql, KERNEL_LEDGERS, KERNEL_LEDGER_OWNER, RecordedTable, RecordedObject, Recorded, ObjectKind, TableMutation}` and migrations `010_schema_table_owners`, `011_schema_purge_records` and `012_schema_object_owners`; `MigrationMembers::new` takes the composition and the held-back members."

[[crate]]
name = "systemprompt-cli"
section = "Changed"
text = "`infra db doctor` reports `absent_member_tables` and `absent_member_ledgers`."
