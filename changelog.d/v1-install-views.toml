[root]
section = "Breaking"
area = "Install views"
text = "`reserved::INSTALL_SEEDS` lists exactly `SystemAdmin`, `Arc<ConfigView>`, `Arc<ProfileView>` and `InstallServicesView`; `InstallSeed::Config` is removed and an install member's `r.get::<Arc<Config>>()` fails boot with `KernelError::Provide`. `ConfigView` is the runtime configuration without `database_url`, `database_write_url`, `database_session_url` and `signing_key_path`; `ProfileView` carries the profile name, target, runtime environment, `judge_automatic`, cloud tenant id, the OTLP target (endpoint without user info, query or fragment; no headers) and `paths.bin`; `InstallServicesView` carries the active services root, the services config and catalog, and the bundle sources as name, transport and credential-free location. Migrate an install by reading `Arc<ConfigView>` where it read `Arc<Config>`, and `ProfileView`/`InstallServicesView` where it read the profile or the services root."

[[crate]]
name = "systemprompt-extension"
section = "Breaking"
text = "`InstallSeed::Config` is replaced by `InstallSeed::ConfigView`, `ProfileView` and `ServicesView`."

[[crate]]
name = "systemprompt-manifest"
section = "Added"
text = "`ConfigView`, `profile::ProfileView`, `profile::OtlpTargetView`, `profile::credential_free_url` and `services::InstallServicesView`; `ServicesView::over` and `ServicesView::reloads`. The `ServicesView::config` field is private."
