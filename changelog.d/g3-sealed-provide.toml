[[crate]]
name = "systemprompt-extension"
section = "Added"
text = "`Contributions::provide_sealed` and `provide_sealed_after_governance` provide a value sealed like a kernel seed: the kernel and provide-phase code read it, and every job, runner-service and config-plane context, member command and other member's route state is refused it. `ProvideEntry::is_sealed`."

[[crate]]
name = "systemprompt-extension"
section = "Breaking"
text = "`Resolved::__route_scoped` takes the route set's owner."

[[crate]]
name = "systemprompt-runtime"
section = "Breaking"
text = "`Kernel::route_scoped` takes the route set's owner; a route set's state is refused a value another member provided sealed."

[[crate]]
name = "systemprompt-provider-contracts"
section = "Added"
text = "`Dependencies::provide_sealed`."

[[crate]]
name = "systemprompt-marketplace"
section = "Changed"
text = "`DynInventoryPublisher` and `DynManagedSkillResolver` are provided sealed: only kernel code (the admin services refresh route, with the authenticated request's user as the actor, and the agent runtime's composition) resolves them."
