[root]
section = "Breaking"
area = "Bridge"
text = "The bridge configures, syncs, lists and credentials nothing for a host whose `HostKind::config_owner()` is `ConfigOwner::Host` (`harness`), which reads and verifies the signed manifest itself: `install --host harness` exits with `SelectionError::Unmanaged`, `credential-helper --host harness` exits 64 and prints no token, a GUI host action on it (the enable toggle included) answers `reason: \"unmanaged\"` without changing anything, the loopback proxy accepts no host token scoped to it, and a `register_host_app!` or `register_host_sync!` registration for it is dropped. `scoped_token::host_token` and `ProfileFacts::inputs_for` return a `Result` whose error is `HostOwnsConfig`, with `scoped_token::desktop_host_token` and `ProfileFacts::desktop_inputs` as the infallible Claude Desktop forms, and `DesiredError` and `ProfileInputsError` gain `HostOwned`. `model_view::host_client` is `host_clients`, returning every client family a host lists models for (`claude` and `openai` for `harness`), and `ResolvedHost` and `SelectionError` gain `Unmanaged`. Migrate a white-label crate by calling `host_clients`, handling the two `Result`s and adding the arms."
