[root]
section = "Breaking"
area = "Hosts"
text = "`HostKind` gains `Harness` (`harness`), a desktop app (`HostProduct::Harness`); `HostKind::ALL` has eight ids. `HostKind::config_owner()` names who writes a host's configuration and holds its loopback credential: `ConfigOwner::Host` for `harness`, `ConfigOwner::Bridge` for every other host. A host that configures itself is opt-in per instance: it is served only when `external_agents` declares it with `enabled: true`, and with no entry it is withheld from the instance hosts, every user's manifest and consumer authorization, so an instance that declares nothing serves the hosts it served before. A manifest that names such a host carries a `min_bridge_version` of at least 0.88.0, so a bridge built against 0.87 refuses it with the upgrade-required message instead of a parse error, and `/.well-known/systemprompt-bridge` never lists one. `ClientKind` gains `Harness`, so `x-systemprompt-client: harness` and the User-Agent product `harness` attribute a request to it; `host-token` attestation naming it is refused with `400`, because the bridge holds no credential for it. `EvaluatorClient` gains `Harness`, so a consumer device may fetch installation plans and bind sessions for `host=harness` on an instance that enables it. `external_agents` validation refuses an entry whose key differs from its `id` and two keys that name one host (`codex_cli` beside `codex-cli`). Migrate an exhaustive `match` over `HostKind`, `HostProduct`, `ClientKind`, `EvaluatorClient` or `ClassificationRejection` by adding the arm, and declare `external_agents.harness` to serve the host."

[[crate]]
name = "systemprompt-models"
section = "Breaking"
text = "`bridge::host::HostKind` and `HostProduct` gain `Harness` (`harness`, a desktop app), `bridge::host` gains `ConfigOwner { Bridge, Host }` and `HostKind::config_owner()` (`Host` for `harness`, `Bridge` for every other host), `origin::ClientKind` gains `Harness` (declarable, User-Agent product `harness`) and `feedback::EvaluatorClient` gains `Harness`. `origin::ClassificationRejection` gains `HostTokenForHostOwnedClient`: `classify` refuses `host-token` attestation for a client whose host configures itself. `bridge::manifest::manifest_min_bridge_version` takes the hosts the manifest names as a second argument and returns at least `HOST_OWNED_HOST_MIN_BRIDGE` (0.88.0) when one of them configures itself. `mcp::ExecutionSource::from_hook_host` returns `Option<ExecutionSource>`, `None` for `harness`. Migrate an exhaustive `match` by adding the arm, pass the manifest's enabled hosts and the keys of its two host maps to `manifest_min_bridge_version`, and handle the `Option`."

[[crate]]
name = "systemprompt-manifest"
section = "Breaking"
text = "`ServicesConfig::instance_enabled_hosts` and `instance_hosts` serve a host whose `config_owner()` is `ConfigOwner::Host` only when `external_agents` declares it with `enabled: true`; a host the bridge configures is still served unless its entry says `enabled: false`. `services::external_agent::validate_catalog`, which `ServicesConfig::validate` runs, refuses an entry whose key differs from its `id` and two keys that name one host. Migrate a services tree by giving each `external_agents` entry the key its `id` names and keeping one entry per host."

[[crate]]
name = "systemprompt-gateway-entry"
section = "Changed"
text = "`GET /v1/bridge/manifest` names a host that configures itself only on an instance that declares it, raises `min_bridge_version` to 0.88.0 for a manifest that names one, and carries a stored model filter only for a host the instance serves. `POST /v1/bridge/profile/host-model-filter` refuses to store a filter for a host the instance does not serve (`host_disabled`); clearing one is always accepted. `http::bridge::manifest::hosts` holds the host projections of the manifest."

[[crate]]
name = "systemprompt-api"
section = "Changed"
text = "`/.well-known/systemprompt-bridge` lists in `enabled_hosts` only the hosts the bridge configures; a host that configures itself is never listed, so a bridge of any version parses the document."

[[crate]]
name = "systemprompt-agent-runs"
section = "Changed"
text = "`host_for(HostKind::Harness)` is `Execution::Unsupported`: no headless adapter exists for the host."

[[crate]]
name = "systemprompt-marketplace"
section = "Changed"
text = "A consumer installation plan for `harness` renders `SKILL.md` as the Claude Code plan does: the kebab-case skill key as `name` and the authored frontmatter passed through."

[[crate]]
name = "systemprompt-ai"
section = "Changed"
text = "`ai_requests.client_kind` and `ai_request_client_evidence.attested_host` admit `harness` (migration `059_ai_requests_client_kind_harness`, measured at 110 ms for its slowest statement over 300000 rows)."

[[crate]]
name = "systemprompt-oauth"
section = "Changed"
text = "`bridge_user_host_prefs` and `bridge_user_host_model_prefs` admit the host id `harness` (migration `030_bridge_host_prefs_harness`). `BridgeHostPrefsRepository::set_enabled` answers `HostPrefWrite::WouldDisableAll` when the write would leave no bridge-configured host enabled: a host that configures itself does not count as the host that remains."
