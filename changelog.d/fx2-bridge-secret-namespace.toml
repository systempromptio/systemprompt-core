[root]
section = "Breaking"
area = "Security"
text = "`gateway.bridge_releases.token_secret` must name a custom secret: a built-in name (`signing_key_pem`, `oauth_at_rest_pepper`, the database URLs, the provider keys including `github`) is refused when the services config is validated. The bridge release source never reads a built-in secret, and the bridge settings view answers whether a custom secret or a provider key is configured but never for a signing key, the pepper or a database URL. Migrate by moving the token to a custom secret and naming it."

[[crate]]
name = "systemprompt-manifest"
section = "Added"
text = "`Secrets::is_provider_key_name`."

[[crate]]
name = "systemprompt-manifest"
section = "Breaking"
text = "`GatewayProfileError::BuiltInSecretRef` (wrapping `ServicesValidationError`): `GatewayConfig::validate` refuses a built-in `bridge_releases.token_secret`."

[[crate]]
name = "systemprompt-gateway"
section = "Changed"
text = "`BridgeReleaseSource::token` reads no built-in secret; `GatewaySettingsView::credential_configured` answers `false` for every built-in name other than a provider key."
