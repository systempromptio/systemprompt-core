[root]
section = "Breaking"
area = "Notifications"
text = "The notification routes are served by the `notifications-http` extension in the new `systemprompt-notifications-entry` crate: `/api/v1/notifications` (user gate) and `/api/v1/admin/notifications` (admin gate) are contributed route sets in the content-and-misc route group, and the bridge inbox `/v1/bridge/notifications*` is a gateway route set, keeping the gateway credential, the `bridge_notifications` rate-limit scope, the bearer window and the gateway access log. The `notifications` extension provides the producer `DynNotificationSink` and the `NotificationsServiceSlot` the host binds, and runs the delivery consumer as its runner service. A profile that disables `notifications-http` serves 404 on all three groups; one that disables `notifications` while `notifications-http` stays enabled, or while `brain` stays enabled, is refused at boot. Without a bound notification service the `documents_inbox` tool is not offered. `systemprompt-api` and `systemprompt-mcp-host` have no `notifications` feature, and `brain` no longer implies `notifications` in `systemprompt-api`, `systemprompt-mcp-host` or `systemprompt-cli`. Migrate by enabling the facade's `notifications` feature, and by disabling `notifications-http` rather than `notifications` to switch off the routes alone."

[[crate]]
name = "systemprompt-notifications-entry"
section = "Added"
text = "New crate: behind the `http` feature, `NotificationsHttpExtension` (the `notifications-http` member, `NOTIFICATIONS_HTTP_EXTENSION`), which requires `NotificationsServiceSlot` and contributes the user, admin and bridge-inbox route sets; `http::{user_routes, admin_routes, bridge_routes, NotificationsState, NotificationsHttpError, ops}`."

[[crate]]
name = "systemprompt-notifications"
section = "Added"
text = "`NotificationsServiceSlot`, provided unbound by `NotificationsExtension` and bound by the host; `NotificationsConsumerSlot` at the crate root; `OutboxNotificationSink::over_write_pool`. `NotificationsExtension` provides the producer `DynNotificationSink`, runs the consumer as its runner service once the consumer slot is bound, and contributes the backlog gauges as metrics."

[[crate]]
name = "systemprompt-api"
section = "Breaking"
text = "`routes::notifications` and the `notifications` feature are removed; the routes are `systemprompt_notifications_entry::http`, and the API runner no longer starts the notification consumer itself. `brain` no longer implies `notifications`."

[[crate]]
name = "systemprompt-runtime"
section = "Breaking"
text = "`AppContext::notifications()` is removed; read `NotificationsServiceSlot` / `NotificationsConsumerSlot` from the extension state. The notifications slot build binds the service. `DocumentsMcpConfig::notifications` is `Option<Arc<NotificationsService>>` and `DocumentsMcpTools::notifications` returns `Option<&NotificationsService>`. The kernel state no longer carries `DynNotificationSink`; the `notifications` extension provides it."

[[crate]]
name = "systemprompt-mcp-host"
section = "Changed"
text = "The documents toolset reads the notification service the notifications slot binds; the crate's only feature is `brain`."

[[crate]]
name = "systemprompt-brain"
section = "Changed"
text = "The brain member requires `DynNotificationSink`."

[[crate]]
name = "systemprompt-cli"
section = "Changed"
text = "The `notifications` feature forwards only to `systemprompt-runtime/notifications`, and `brain` no longer implies it."
