[root]
section = "Breaking"
area = "API"
text = "Admission control is on by default and decided outside every other layer: `server.max_in_flight` defaults to 4096 in-flight requests per replica, each counted until its response body is read to the end or dropped (an explicit `null` is no ceiling), and the shed layer is the outermost layer of the API router, so a saturated replica answers `503` with `Retry-After: 1` before CORS, sessions, authentication, rate limits or body parsing. Migrate by setting `server.max_in_flight` to the replica's measured capacity, or `null` to keep queueing."

[[crate]]
name = "systemprompt-api"
section = "Breaking"
text = "`services::middleware::LoadShed` and `load_shed::shed` are crate-private; `load_shed::outermost` is the entry point. The permit is released when the response body is dropped."

[[crate]]
name = "systemprompt-traits"
section = "Added"
text = "`Held<S, G>`: a stream or HTTP body that keeps a guard alive until it is dropped, forwarding the body's size hint. The gateway's deployment slot and the API's admission permit both use it."
