[root]
section = "Breaking"
area = "Jobs"
text = "`submit_job!`, `register_retention_purge!`, `register_retention_sweep!` and `submit_projection_drain!` take the owning extension id as their first argument, and the inventory collects `JobRegistration` (read with `registered_jobs()`) instead of `&'static dyn Job`. Migrate by writing `submit_job!(\"<extension id>\", &Job)`."

