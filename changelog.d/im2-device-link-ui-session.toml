[root]
section = "Added"
area = "OAuth"
text = "a device link can carry a person's UI session, so a desktop client that links a device signs the person in once. `systemprompt_oauth::services::issue_device_link_code` takes the `person_ui` client's PKCE request (`DeviceLinkUiRequest`: client, redirect, scope, S256 challenge) and the time the person signed in to the approving browser, and refuses a client that is not a declared `person_ui` client, an unregistered redirect, a challenge that is not S256 and a scope the client does not declare. `POST /v1/auth/bridge/session-pat` answers such a link with the device key and `ui_code`, an authorization code the client redeems at the token endpoint with its verifier; the device key alone opens no UI session, and the session exchange never yields the code. The session's `auth_time` is the browser sign-in. Its refresh tokens carry the device key they were issued with (`device_key_id`, oauth migration `028_device_link_ui_session`), and a refresh is refused and the family revoked once that key is revoked or expires (`UserProvider::device_key_stands`, which answers `false` unless a provider implements it). `/.well-known/oauth-authorization-server`, `/.well-known/openid-configuration` and `endpoints.oauth` of `GET /api/v1` advertise `device_link_ui_session_supported`. New: `OAuthRepository::{create_device_link_code, consume_device_link_code, mint_device_authorization_code, refresh_token_device_key, revoke_refresh_token_family_of}`, `repository::{DeviceLinkUiGrant, StoredUiGrant, ConsumedDeviceLink}`, `UserRepository::is_device_key_active`."

[[crate]]
name = "systemprompt-models"
section = "Breaking"
text = "`bridge::gateway::DevicePatResponse` gains `ui_code: Option<String>`. Migrate a struct literal by setting `ui_code: None`; a reply serialised without the field decodes as `None`."

[[crate]]
name = "systemprompt-api"
section = "Breaking"
text = "`routes::oauth::discovery::WellKnownResponse` gains `device_link_ui_session_supported: bool`, and `routes::gateway::auth::{session_pat, SessionPatBody}` move to `routes::gateway::device_link`. Migrate a struct literal by setting the field and an import by its new path."
