[root]
section = "Breaking"
area = "At-rest encryption"
text = "Nothing is sealed under `encryption_master_key` itself. `AtRestCipher::from_master_key` and `from_secrets` are removed. `AtRestCipher::for_member(&key, &member)` seals under the member's derived key with the `spmc1.` envelope, and `open` refuses an unenveloped value with `AtRestCipherError::Unresealed`. The pre-0.88 scheme opens only through `at_rest::pre_088`, which `admin secrets reseal` alone reads. `ResealColumn` carries a `SealedLayout`. The `ai` member declares `user_provider_credentials`. The gateway journal is keyed for the `gateway` member under its own label. Migrate a caller to `for_member` with the owning member's id, and run the reseal step in the operator table."

[[crate]]
name = "systemprompt-security"
section = "Breaking"
text = "`AtRestCipher::from_master_key` and `from_secrets` are removed; `AtRestCipher::for_member`, `member_key`, `MEMBER_CIPHER_LABEL`, `AtRestCipherError::Unresealed` and the reseal-only `at_rest::pre_088` are added."

[[crate]]
name = "systemprompt-extension"
section = "Breaking"
text = "`ResealColumn` carries a `SealedLayout` (`SplitBytea { nonce }` or `HexText`)."

[[crate]]
name = "systemprompt-ai"
section = "Changed"
text = "The `ai` member declares `user_provider_credentials` for re-sealing; a pre-0.88 stored key is refused with a typed error, not treated as absent."
