[root]
section = "Fixed"
area = "Security"
text = "Every client-mediated tool call proxied to an external MCP server records its execution row and runs the artifact ingest (secret and gateway policy scanners) whether or not the `ai` member is admitted; the model's intent claims pair the execution only when `ai` provides them. A tool call with no audit available is refused with 503 `audit_unavailable`."

[[crate]]
name = "systemprompt-api"
section = "Breaking"
text = "`ProxyService::{with_tool_usage_repo, with_artifact_ingest}` are replaced by `with_mcp_audit(McpAuditSinks)`; `audit::AuditSinks` gains `executions`, `intent_claims` is optional and `ingest` is required; `ProxyError::AuditUnavailable` is added."
