[root]
section = "Added"
area = "AI"
text = "The Vertex rate card prices Gemini 4 Argon (`vertex-gemini-4-argon`), Gemini 4 Hydrogen (`vertex-gemini-4-hydrogen`), Gemini 4 Carbon (`vertex-gemini-4-carbon`) and Gemini 4 Neon (`vertex-gemini-4-neon`) on the gemini wire. Vertex discovery publishes each one only in a project whose publisher listing carries it (Google documents Carbon and Neon as available to verified enterprise customers in select regions); an instance that declares none of them sees them appear at the next boot or discovery run. Hydrogen and Neon carry `price_until` 2027-01-11."

