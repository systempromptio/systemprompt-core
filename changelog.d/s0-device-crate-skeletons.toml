[root]
section = "Added"
area = "Device crates"
text = "New crates `systemprompt-device` and `systemprompt-machine` (infra layer), `systemprompt-engine`, `systemprompt-proxy`, `systemprompt-hosts`, `systemprompt-drive` and `systemprompt-runner` (domain layer) and `systemprompt-harness` (app layer) are the device crates. `systemprompt-machine`, `systemprompt-proxy`, `systemprompt-hosts` and `systemprompt-runner` declare no items and have no dependencies. `just lint-layers` holds each at its layer, and `just lint-device-closure` refuses a server kernel crate that names a device crate and a device crate that names a server crate above the shared layer."

