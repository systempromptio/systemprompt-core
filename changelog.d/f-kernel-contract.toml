[root]
section = "Added"
area = "Kernel contract"
text = "A capability entry crate answers its own error type through `systemprompt_extension::router` (`capability_error_response!`, `capability_response`) and keeps `?` in its handlers, with the response, including the fixed 5xx body, built by the API error envelope. A CLI command group or leaf declares its `--help` position (`DISPLAY_ORDER`) and requests the kernel grants it needs (`CommandDecl::requesting(&[KernelGrant])`); the kernel admits a grant only for the reserved command paths and owner its closed table lists, refuses a parsed descriptor holding an undeclared grant before bootstrap, and resolves a parsed command line to the deepest registration on its path."

[[crate]]
name = "systemprompt-extension"
section = "Added"
text = "`router::{capability_response, capability_error_response!}`, `cli::{KernelGrant, CommandDecl, DescribedCommand, REGISTERED_DISPLAY_ORDER}`, `CliCommandGroup::DISPLAY_ORDER`, `CliCommandLeaf::DISPLAY_ORDER` and `CommandDescriptor::{holds, with_grant, with_cloud_operator, with_local_export}`."

[[crate]]
name = "systemprompt-cli"
section = "Added"
text = "`kernel::ResolveError` (returned by `CommandRegistry::resolve`), `RegistryError::{ShadowsGroup, ReservedPath, GrantNotListed, UndeclaredGrant}` and `kernel::describe_command_line`."

[[crate]]
name = "systemprompt-cli"
section = "Breaking"
text = "`runner::profile_routing::is_cloud_bypass_command`, `args::has_local_export_flag` and `args::has_local_export_flag_in` take the command's `&CommandDescriptor` instead of the parsed `Option<&Commands>`."
