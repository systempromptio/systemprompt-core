[root]
section = "Added"
area = "Extensions"
text = "a route set declares its rate limit (`RateLimit`, `RateBudget`), body limit, protection layers (`ProtectionLayer`), route group and enable predicate, and one mount function (`systemprompt_api::services::middleware::mount`) applies the declaration."

[[crate]]
name = "systemprompt-api"
section = "Added"
text = "`services::middleware::mount` applies a route set's declared policy, context, rate limit, body limit and protection layers."

[[crate]]
name = "systemprompt-extension"
section = "Added"
text = "`AuthzPolicy`, `RouteGroup`, `RouteProtection`, `RateLimit`, `RateBudget`, `ProtectionLayer`, `StateRequirement` and `ExtensionStateError`."
