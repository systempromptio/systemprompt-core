[root]
section = "Breaking"
area = "Authorization hooks"
text = "`AuthzWiring` and `AuthzHookContext` gain a `state` field (`StateHandle`), through which a hook factory reads the extension state once the host binds it; a read before the bind fails closed. Migrate by setting the field in struct literals."

