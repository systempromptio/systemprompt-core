[root]
section = "Breaking"
area = "Marketplace"
text = "The managed consumer surface contract (`ManagedSurface`, `DynManagedSurface`, `ManagedRouteState`, `ManagedRoutes`, `ConsumerNormalizer`, `ConsumerCatalog`, `DynConsumerCatalog`) moves from `systemprompt_marketplace::surface` to `systemprompt_extension::router`, and `ConsumerCatalog::candidate` is `granted_skills`, returning the granted `SkillEntry` list. `systemprompt-marketplace` drops its `http` feature. The bridge routes reach the marketplace through `systemprompt_extension::bridge_catalog::DynBridgeCatalogSource`; `ManifestEntries` and `IssuedConsumerCredential` move to `systemprompt_extension::bridge_catalog`, and `skill_bundle_path` / `skill_bundle_markdown` to `systemprompt_models::bridge::manifest::skill_frontmatter` (the markdown now fails with `serde_yaml::Error`). A composition without `managed_resources` builds no bridge route. Migrate by updating the import paths."
