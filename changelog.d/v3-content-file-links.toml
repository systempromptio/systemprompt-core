[root]
section = "Breaking"
area = "Content"
text = "The `core content files` commands read `systemprompt_extension::content_files::DynContentFileLinks` from the `content` member: each `execute_with_pool` is `execute_with_links` taking `&dyn ContentFileLinks`, and `link::FileRoleArg` is `ContentFileRole`. The command line is unchanged."
