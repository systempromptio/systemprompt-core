[root]
section = "Added"
area = "API"
text = "The closed `CoreDeclaration` table lists every core route group treated differently from an install extension's (the agent proxy, agent runs, Slack, Teams, and the notification user, admin and bridge-inbox groups), each by owner, exact base path and route group, with the one `Allowance` it holds (`Plain`, `HandlerVerified`, `ReservedPrefix` or `BodyLimit`). Each row pins its declaration's whole protection shape: policy, context kind, rate-limit scope, budget and bearer window, body limit, protection layers and frame options. Boot refuses a declaration that names a row with another shape (`MountError::CoreDeclarationMismatch`, naming the differing `CoreShapeField`), an extension declaration under a reserved prefix that no row grants (`MountError::ExtensionReservedPath`), and a handler-verified policy or above-default body limit that no row grants. A listed core declaration is mounted on every node role that serves its route group; every other extension declaration only where the role serves both `RouteGroup::Extensions` and its own group."

[[crate]]
name = "systemprompt-api"
section = "Added"
text = "`CoreDeclaration`, `CoreDeclarer`, `Allowance` and `CoreShapeField` in `services::middleware`; `admit_extension` takes the declaring extension id and admits a core-only protection only on a full-shape row match. `MountError` gains `ExtensionReservedPath`, `CoreDeclarationMismatch { extension, base_path, field }`, `UnlistedGatewayRoute` and `GatewayRouteOverlap`."

[[crate]]
name = "systemprompt-api"
section = "Added"
text = "`services::middleware::{extension_served, extension_built, admit_gateway_route, refuse_overlap, path_under, gateway_protection}`: the role-exposure, router-build and gateway-registration checks over the `CoreDeclaration` table, and the protection the gateway applies to every registered group."
