[root]
section = "Breaking"
area = "Route admission"
text = "A composition may claim one site fallback with `Contributions::site_fallback(SiteFallback::service(..))`. It answers the paths no route matches, under the public policy and the public context only, after every reserved path and route set, and never a reserved path; it takes the web root's fallback in place of the static content fallback. A second claimant refuses admission with `CompositionError::SecondSiteFallback` naming both. `AdmittedParts` gains `site_fallback`; migrate a struct literal by adding `site_fallback: None`."

[[crate]]
name = "systemprompt-extension"
section = "Breaking"
text = "`AdmittedParts` gains `site_fallback`; `Admitted::site_fallback`, `AdmittedSiteFallback` and `router::SiteFallback` are added."

[[crate]]
name = "systemprompt-api"
section = "Added"
text = "`protect_site_fallback`, `RootFallback::beside` and `SITE_FALLBACK_RATE`."

[[crate]]
name = "systemprompt"
section = "Breaking"
text = "`CompositionError` gains `SecondSiteFallback`."
