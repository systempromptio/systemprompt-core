[root]
section = "Changed"
area = "CLI"
text = "`admin users`, `admin bridge` and `admin keys` are contributed by the identity member (`identity-http`) under the kernel's `admin` group, with the same names, arguments and data-impact classification; the CLI kernel no longer depends on `systemprompt-users` or `systemprompt-oauth`."

[[crate]]
name = "systemprompt-identity-entry"
section = "Added"
text = "The `cli` feature: the `admin users` (identity plane-writer grant, read-only commands served on `--database-url`), `admin bridge` and `admin keys` (signing-keys grant) command groups in `systemprompt_identity_entry::cli`, contributed by `identity-http`."

[[crate]]
name = "systemprompt-cli"
section = "Breaking"
text = "`systemprompt_cli::commands::admin::users`, `::bridge` and `::keys` and the `AdminCommands::Users`, `::Bridge` and `::Keys` variants are removed (now `systemprompt_identity_entry::cli::{users, bridge, keys}`); `systemprompt_cli::shared::ConfirmArgs` and its `kernel` re-export are removed (now `systemprompt_extension::cli::ConfirmArgs`); `session::api::create_local_session_row` takes the users member's `AdminBootstrap` view, the user and the TTL; `config::migrate::data::apply_with` takes the host-filter migration port."

[[crate]]
name = "systemprompt-extension"
section = "Breaking"
text = "`DeploymentSigningKeys` gains `mint_plugin_token` (`PluginTokenGrant` in, `MintedPluginToken` out): the kernel mints the plugin-scoped hook token under the profile's issuer. `cli::ConfirmArgs` is added."

[[crate]]
name = "systemprompt-traits"
section = "Breaking"
text = "`AdminBootstrap` gains `open_session` (a session row for an existing user with a TTL and source). `HostFilterMigrationPort` / `DynHostFilterMigrationPort` are added."

[[crate]]
name = "systemprompt-oauth"
section = "Breaking"
text = "`BridgeHostPrefsRepository::update_model_protocol_tag` is replaced by its `HostFilterMigrationPort::rewrite_model_protocol_tag` impl; the member provides it sealed as `DynHostFilterMigrationPort`."

[[crate]]
name = "systemprompt-models"
section = "Added"
text = "`UserJwtRequest::plugin_hook`: the plugin-scoped hook token request `PluginTokenService` and the CLI kernel both mint."

[[crate]]
name = "systemprompt-users"
section = "Changed"
text = "The admin-bootstrap view opens CLI session rows (`AdminBootstrap::open_session`)."
