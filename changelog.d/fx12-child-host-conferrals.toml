[root]
section = "Breaking"
area = "Install views and conferred capabilities"
text = "A child host (the process `admin mcp serve --server <id>` and `admin agent-host run` boot) confers nothing: it seeds no conferral issuer and never holds `encryption_master_key` (the grant is refused), and seeds `ConferralsWithheld` sealed. `Resolved::member_cipher`, `share_tokens`, `git_source_sync` and `token_minter` return `ConferralError`: `Missing` when the member did not declare the row (on every host), `Withheld` when it did and the host is a child. `?` in a provide fn turns `Withheld` into `ProvideError::Withheld`, so the value is withheld on the child and the child boots; in a factory it fails the slot build. Migrate a provide fn that wraps a conferral into a value its MCP toolset reads by matching `ConferralError::Withheld` and building the value without the handle, or leave the `?` when the child never reads the value."

[[crate]]
name = "systemprompt-extension"
section = "Breaking"
text = "`Resolved::{member_cipher, share_tokens, git_source_sync, token_minter}` return `ConferralError`; new `ConferralError` and `ConferralsWithheld`."

[[crate]]
name = "systemprompt-runtime"
section = "Changed"
text = "Only the API seeds the conferral issuers; a child host seeds `ConferralsWithheld` and the API reserves it."

[[crate]]
name = "systemprompt-marketplace"
section = "Changed"
text = "The Git source sync issuer is withheld on a child host."
