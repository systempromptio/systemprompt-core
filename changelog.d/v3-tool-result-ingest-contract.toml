[root]
section = "Breaking"
area = "MCP"
text = "The artifact ingest contract is `systemprompt_extension::mcp::artifacts` (`mcp` feature): `ArtifactScanner`, `ArtifactFinding`, `PHASE_TOOL_RESULT`, `IngestRequest`, `IngestOutcome`, `IngestMark`, `IngestMarkKey` and the `ToolResultIngest` trait the `mcp` member provides as `DynToolResultIngest`. `systemprompt_mcp` no longer exports them or `from_canonical_tool_result`. Migrate by importing them from `systemprompt_extension::mcp::artifacts`; register a scanner on `DynToolResultIngest` rather than on `Arc<ArtifactIngest>`."
