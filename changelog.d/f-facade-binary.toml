[root]
section = "Breaking"
area = "Facade"
text = "The `systemprompt` binary is built from the facade with the `reference` composition (`cargo build -p systemprompt --bin systemprompt --features reference`, `cargo install systemprompt --features reference`), or any composition that enables `runtime`; `systemprompt-cli` is a library with no binary. The facade's `cloud` feature links `systemprompt-cloud-entry`, `analytics` links `systemprompt-analytics-entry`, and the new `content` feature links `systemprompt-content` and `systemprompt-content-entry`; `api` turns on each linked entry crate's `http` routes and `cli` its commands; `core content popular`, an analytics report under the `core content` group, is registered only when both `analytics` and `content` are enabled; `reference` implies all three. A binary built without a capability's feature has neither its members, its routes nor its commands. Migrate an install binary by enabling `runtime` with `cloud`, `analytics` and `content` (or `reference`), and by building `main` on `systemprompt::reference().run()`."

[[crate]]
name = "systemprompt"
section = "Added"
text = "The `systemprompt` binary (`required-features = [\"full\"]`), composing every capability in `full` through `systemprompt::reference()`. The `content` feature (in `full`) gates `systemprompt::content`. `systemprompt::cloud::entry` and `systemprompt::analytics::entry` name the entry crates,"

[[crate]]
name = "systemprompt"
section = "Breaking"
text = "`cloud` links `systemprompt-cloud-entry` and `analytics` links `systemprompt-analytics-entry`; `systemprompt::content` is gated on `content` instead of `full`. With `cli` and without `cloud` or `analytics`, the binary has no `cloud` or `analytics` commands; with `api` and without `analytics` or `content`, the server mounts none of their routes."

[[crate]]
name = "systemprompt-cli"
section = "Breaking"
text = "The crate no longer builds the `systemprompt` binary and has no `full` feature. Migrate to the facade's binary (`cargo install systemprompt --features full`) or compose an install's own `main` with `systemprompt::reference().run()`."

