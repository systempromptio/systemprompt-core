[root]
section = "Breaking"
area = "Agents"
text = "The hosted A2A server moves to `systemprompt_agent_entry::a2a_server` (`http` feature): `Server`, `run_standalone`, `serve::HostedAgentServer`, the card and JSON-RPC request handlers (`card`, `request`), the OAuth middleware (`middleware`) and protocol version negotiation (`version`). The `agent-http` member provides `DynAgentServer`; a composition that admits `agent` without `agent-http` has no agent server, and `admin agent-host run` refuses, naming `agent-http`. The agent streaming engine emits `systemprompt_agent::services::a2a_server::streaming::StreamFrame` (the serialised JSON-RPC frame), which `a2a_server::sse_event` sends as an SSE `data:` event; the bytes on the wire are unchanged. `AGENT_RUN_ORIGIN_KIND` is `systemprompt_agent::services::a2a_server::AGENT_RUN_ORIGIN_KIND`, and `systemprompt_agent::AgentServer` is removed. Migrate by importing the server items from `systemprompt_agent_entry::a2a_server` and building with `agent-http` wherever agents run."
