[root]
section = "Breaking"
area = "Agents"
text = "The agent capability's conversation routes and commands are contributed by the `agent-http` composition member (`systemprompt-agent-entry`). `/api/v1/core/contexts`, `/api/v1/core/tasks`, `/api/v1/core/artifacts` and `GET /api/v1/agents/registry` keep their paths, policies, request contexts, rate limits, body limits and role group; a profile that disables `agent-http` mounts none of them (404), and one that disables `agent` while `agent-http` stays enabled is refused at boot. `admin agents`, `core contexts` and `core artifacts` are member groups under their reserved paths with the `services-tree`/`caller-session` (agents), `caller-session`/`session-context` (contexts) and `caller-session` (artifacts) grants. `admin agents delete` no longer stops a process: it refuses a running agent and names `infra services stop agent <name>`, and `--force` is removed. `admin agents status` reads the service table without building an orchestrator. `admin agents message` and `admin agents task` present the caller's session only to the profile's own API URL; `--url` is removed from both. `admin agents tools` is removed. The spawned agent process runs as `admin agent-host run --agent-name <n> --port <p>` (kernel child host); `admin agents run` is removed. An agent spawned by an earlier release is still recognised by its pid and spawn marker at shutdown and reconcile."

[[crate]]
name = "systemprompt-agent-entry"
section = "Added"
text = "`extension::AgentHttpExtension` (`agent-http`). Behind `http`: `http::{contexts_routes, tasks_routes, artifacts_routes, registry_routes}`, `AgentHttpState`, `AgentRegistryState`, `ConversationRepositories`, `ContextEventPublisher` and `AgentHttpError`. Behind `cli`: `cli::agents::AgentsCommands`, `cli::contexts::ContextsCommands`, `cli::artifacts::ArtifactsCommands`. The member provides `Arc<ContextEventPublisher>` (`http`) and a presence-only `Arc<dyn SecretPresence>` (`cli`), and requires `Arc<AgentCardSite>` and, for the commands, `Arc<AgentStatusView>`."

[[crate]]
name = "systemprompt-agent"
section = "Added"
text = "`services::registry::AgentCardSite` (public API URL and skills directory), provided open by `AgentExtension`."

[[crate]]
name = "systemprompt-api"
section = "Breaking"
text = "`routes::agent` and `routes::{artifacts_router, contexts_router, registry_router, tasks_router, webhook_router}` are removed; the conversation routes are `systemprompt_agent_entry::http`. The webhook broadcasts stay in the API as `routes::webhook` (`router(WebhookState)`, `WebhookState::from_context`, `WebhookRepositories`), mounted unchanged at `/api/v1/webhook`."

[[crate]]
name = "systemprompt-cli"
section = "Breaking"
text = "`admin::agents`, `core::contexts` and `core::artifacts` are removed (now `systemprompt_agent_entry::cli`); `AdminCommands::Agents` is replaced by `AdminCommands::AgentHost` (`admin::agent_host::{AgentHostCommands, run}`); `presentation::tables::{artifact_list_table, context_list_table}` are removed."

[[crate]]
name = "systemprompt-runtime"
section = "Breaking"
text = "`AppContext::{a2a_repositories, context_materializer}`, `DataPlane::a2a_repositories`, `HostParts::a2a` and `RuntimeError::Agent` are removed. Build `A2ARepositories` at the consumer's composition root; read `DynContextMaterializer` from the resolved state."

[[crate]]
name = "systemprompt-models"
section = "Breaking"
text = "`CliPaths::agent_run_args` is `[\"admin\", \"agent-host\", \"run\"]` (new `CliPaths::AGENT_HOST`); `CliPaths::agent_run_cmd_pattern` is removed."

[[crate]]
name = "systemprompt-mcp-host"
section = "Changed"
text = "`AgentHost::compose` builds the agent's A2A repositories from the host's database, managed-skill resolver and tool-usage ledger."

[[crate]]
name = "systemprompt-extension"
section = "Added"
text = "Reserved paths `/api/v1/core/{contexts,tasks,artifacts}` (subtree) and `/api/v1/agents/registry` (exact) for `CoreId::AgentHttp`, with their privileged shapes and `reserved::AGENT_REGISTRY_ROUTES`."

[[crate]]
name = "systemprompt-mcp-host"
section = "Breaking"
text = "`AgentHost` and `AgentHostError` are removed (also from `systemprompt::system`); a spawned agent serves through the agent member's sealed `DynAgentServer`."

[[crate]]
name = "systemprompt-agent"
section = "Added"
text = "`services::a2a_server::serve::{HostedAgentServer, AgentServerUnavailable}`, provided sealed as `DynAgentServer`; a host missing a collaborator refuses to serve with a typed reason. `ConfigAuthoringError::NameReserved`."

[[crate]]
name = "systemprompt-models"
section = "Added"
text = "`AiProvider::drain_pending_writes` (defaulted)."

[[crate]]
name = "systemprompt-manifest"
section = "Breaking"
text = "`RESERVED_AGENT_NAMES` (`registry`); `AgentConfig::validate` refuses a reserved name."

[[crate]]
name = "systemprompt-loader"
section = "Changed"
text = "A verbatim load validates a resolved copy of the tree and refuses an invalid one; the returned tree stays verbatim."

[[crate]]
name = "systemprompt-runtime"
section = "Changed"
text = "The child host seeds the verification keyring and the JWT validation provider; the documents runtime reads `DynContextDirectory` optionally (`documents::ContextsUnavailable` without the agent member)."
