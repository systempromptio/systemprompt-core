[root]
section = "Changed"
area = "CLI"
text = "`admin users`, `admin keys` and `admin bridge` are contributed by the `identity-http` member (facade feature `identity`) instead of the CLI kernel; their command lines, output and data-impact classes are unchanged. They reach kernel material only through their rows' grants (`config-plane-writer` for the identity plane, `signing-keys`), the values conferred on `identity-http` (OAuth repositories, owner reassignments) and `IdentityCliSettings`. `admin keys issue-plugin-token` stays a kernel command, attached under the member's `admin keys` group. A binary built without `identity`, or a profile that disables `identity-http`, serves none of the three groups. `admin keys` and `admin bridge` still refuse a bare `--database-url`."

[[crate]]
name = "systemprompt-identity-entry"
section = "Added"
text = "A `cli` feature with `cli::{users, keys, bridge}`: the `UsersCommands`, `KeysCommands` and `BridgeCommands` groups, moved from `systemprompt-cli`."

[[crate]]
name = "systemprompt-cli"
section = "Breaking"
text = "`admin::{users, keys, bridge}` and `AdminCommands::{Users, Keys, Bridge}` are removed (now in `systemprompt-identity-entry`'s `cli` feature). `admin keys issue-plugin-token` is `admin::plugin_token`. `kernel::ConfirmArgs` and `shared::ConfirmArgs` are removed: use `systemprompt_extension::cli::ConfirmArgs`. `config::migrate::data::apply_with` takes the bridge host-filter port."

[[crate]]
name = "systemprompt-extension"
section = "Added"
text = "`cli::ConfirmArgs` (moved from `systemprompt-cli`) and `ParsedCommand::matches`."

[[crate]]
name = "systemprompt-traits"
section = "Added"
text = "`BridgeHostFilterMigration` / `DynBridgeHostFilterMigration`, the bridge host-filter rewrite `admin config migrate --data` runs; the `oauth` member provides it sealed."

[[crate]]
name = "systemprompt-oauth"
section = "Breaking"
text = "`BridgeHostPrefsRepository::update_model_protocol_tag` returns `Result<u64, RepositoryError>`; the repository implements `BridgeHostFilterMigration`."
