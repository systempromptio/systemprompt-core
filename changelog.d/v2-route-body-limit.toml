[root]
section = "Breaking"
area = "Route admission"
text = "`BodyLimit` gains `Bytes(usize)`: a route's own request-body limit, smaller or larger than the 2 MiB default, enforced on the declared `Content-Length` and on a streamed body. A limit of `0` or above the new profile ceiling `server.max_route_body_bytes` (default 16 MiB) refuses the boot naming the route. Migrate an exhaustive `match` on `BodyLimit` by adding the `Bytes` arm."

[[crate]]
name = "systemprompt-extension"
section = "Breaking"
text = "`BodyLimit` gains `Bytes(usize)`."

[[crate]]
name = "systemprompt-api"
section = "Breaking"
text = "`MountLayers` gains `body_ceiling`; `MountError` gains `RouteBodyLimit`; a declared body limit is also enforced on a streamed body."

[[crate]]
name = "systemprompt-manifest"
section = "Breaking"
text = "`ServerConfig` and `Config` gain `max_route_body_bytes` (`DEFAULT_MAX_ROUTE_BODY_BYTES`, `MAX_ROUTE_BODY_BYTES_LIMIT`)."
