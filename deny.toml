[advisories]
version = 2
yanked = "warn"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "Marvin Attack in `rsa`: private-key operations are not constant-time, so their timing can leak key material to an observer who can time many of them. `rsa` 0.9 is a direct workspace dependency (crates/infra/security wraps `RsaPrivateKey` for the signing-key authority and JWKS) and also the `rust_crypto` backend of `jsonwebtoken`. Core performs RSA private-key operations: it SIGNS RS256 JWTs on token issuance (session and anonymous tokens, OAuth access/refresh/ID tokens, the Google service-account assertion), and those issuance endpoints are network-reachable, some (anonymous session, OAuth public endpoints) without prior authentication. Core performs no RSA decryption anywhere, so the PKCS#1 v1.5 decryption oracle the advisory is named after has no surface here. The remaining exposure is signing-time variation on the token endpoints: the signed input is a SHA-256 digest of server-built claims (an attacker cannot choose the value being exponentiated), each signature is one sample among network and request-handling jitter, and the public OAuth endpoints are rate-limited (profile `rate_limits.oauth_public_per_second`), which bounds the number of timing samples an attacker can collect. We judge that low-exploitability, not absent. No fixed `rsa` release exists (constant-time work is upstream and unreleased). Exit: drop the ignore when a fixed `rsa` ships, or move first-party token signing to Ed25519 and keep RSA only for verifying third-party RS256 tokens. See documentation/security/threat-model.md." },
    { id = "RUSTSEC-2026-0235", reason = "Out-of-bounds reads validating rkyv archives containing Rc/Arc. `rkyv` 0.7.46 appears in every workspace lockfile as an *optional* dependency of `rust_decimal` (itself pulled by sqlx); the feature that enables it is never turned on, so `cargo tree -i rkyv --target all` resolves to nothing and no compiled artifact contains the crate. cargo-deny does not report it for exactly that reason — it walks the feature-resolved graph — while cargo-audit reads the raw lockfile, which is why the ignore is needed here. The fix is rkyv >=0.8.17 and `rust_decimal` 1.42.1 pins the 0.7 line, so there is no upgrade to take; drop the ignore once rust_decimal moves to rkyv 0.8. We never deserialise rkyv archives." },
    { id = "RUSTSEC-2026-0459", reason = "Bundled C SQLite defect in `libsqlite3-sys` 0.37.0 (CVE-2026-119375): SQLite before 3.54.0 can return uninitialised page-cache memory when a process opens a database file together with a crafted sibling `-wal` file; the vector is local and needs the victim process to open files a less trusted party wrote. The server crates do not link SQLite: there it is only the optional dependency of `sqlx-sqlite` 0.9.0, never enabled. The device crates do: `systemprompt-engine` keeps its session store in SQLite through `rusqlite` 0.39 with the `bundled` feature, so a device binary (never an instance) carries the affected copy. The store opens only its own database under the signed-in user's private data directory, which the device creates and restricts to that user; an attacker able to plant a `-wal` file there already runs as the user and can read the same memory and files directly. The fix is libsqlite3-sys >=0.39.0 (rusqlite >=0.41), and cargo resolves one `links = \"sqlite3\"` package per lockfile: `sqlx-sqlite` 0.9.0 caps it below 0.38 and sqlx 0.9.0 is the latest release, so there is no upgrade to take. Exit: move rusqlite to >=0.41 and drop the ignore when sqlx ships against libsqlite3-sys >=0.39." },
    { id = "RUSTSEC-2026-0387", reason = "Timing variation in constant-time operations of `crypto-bigint` 0.5.5. It is pulled only by `jsonwebtoken` 11.1.0's `rust_crypto` backend through `p256`/`p384` 0.13 -> `ecdsa`/`elliptic-curve` 0.13 (root and `crates/tests` lockfiles, and bench/fuzz which depend on them); the fix is crypto-bigint >=0.7.6, which needs elliptic-curve 0.14, and jsonwebtoken 11.1.0 is the latest release and pins the 0.13 line, so there is no upgrade to take. The vulnerable arithmetic runs only for ES256/ES384 keys, and core never constructs one: every signing key is RSA (`EncodingKey::from_rsa_*`) or HMAC (`from_secret`), every verifier pins `Validation::new(Algorithm::RS256)` or HS256, and jsonwebtoken refuses a key whose family does not match the algorithm, so an attacker-supplied `alg: ES256` header never reaches EC code. RSA and SAML signing do not touch crypto-bigint 0.5. Not reachable. Exit: drop the ignore when jsonwebtoken moves to elliptic-curve 0.14." },
    { id = "RUSTSEC-2023-0126", reason = "Aliasing violation in `sized-chunks` 0.6.5 `OrdSet` insertion. Reached only through `loro` 1.17.1 -> `loro-internal` -> `im` 15.1.0, the persistent collections the CRDT keeps in process for live co-editing (feature `collab`, in `full`). `im` 15.1.0 is the latest release and pins `sized-chunks` 0.6, so there is no upgrade to take. The faulty path is `OrdSet::insert`; the unsoundness is in-process memory aliasing, not a parser of untrusted bytes, and the only callers are authenticated users holding edit access on the document, whose updates Loro validates before any collection is touched. Exit: drop the ignore when `loro` moves off `im` or `im` ships against a fixed `sized-chunks`." },
    { id = "RUSTSEC-2026-0255", reason = "Panic-safety unsoundness in `sized-chunks` 0.6.5 `Chunk`, `RingBuffer` and `InlineArray` (use-after-free or double-free if an element's `Clone` or `Drop` panics mid-operation). Same `loro` -> `im` 15.1.0 path as RUSTSEC-2023-0126, feature `collab`. The element types `im` stores for Loro are plain data whose `Clone` and `Drop` do not panic, so the panic window the advisory needs does not open. Exit: as RUSTSEC-2023-0126." },
    { id = "RUSTSEC-2026-0248", reason = "`im` 15.1.0 is unmaintained (repository archived 2026-05-03). It is the persistent-collection library `loro` 1.17.1 (`loro-internal`) uses for CRDT state in the live co-editing service (feature `collab`, in `full`); `loro` 1.17.1 is the latest release and still depends on it. Maintenance status only; the two `sized-chunks` advisories below are the known defects beneath it. Exit: drop the ignore when `loro` moves off `im`." },
    { id = "RUSTSEC-2026-0251", reason = "`sized-chunks` 0.6.5 is unmaintained. Same `loro` -> `im` 15.1.0 path as RUSTSEC-2026-0248; `im` pins the 0.6 line. Exit: as RUSTSEC-2026-0248." },
    { id = "RUSTSEC-2026-0247", reason = "`bitmaps` 2.1.0 is unmaintained. Same `loro` -> `im` 15.1.0 path as RUSTSEC-2026-0248. Maintenance status only. Exit: as RUSTSEC-2026-0248." },
    { id = "RUSTSEC-2023-0089", reason = "`atomic-polyfill` 1.0.3 is unmaintained (deprecated by its author). Reached only through `loro` 1.17.1 -> `loro-internal` -> `postcard` 1.1.3 -> `heapless` 0.7.17 (feature `collab`); `postcard` pins `heapless` 0.7, whose 0.8 line dropped the polyfill. On our x86_64 and aarch64 targets the crate forwards to `core::sync::atomic` and compiles no polyfill code. Exit: drop the ignore when `postcard` moves to `heapless` 0.8 or `loro` drops `postcard`." },
    { id = "RUSTSEC-2026-0574", reason = "Use-after-free in `heapless` `sorted_linked_list::FindMutView::pop` after mutating the value. heapless 0.7.17 and 0.8.0 remain in the root, `crates/tests` and `crates/tests/bench` lockfiles after the 0.9 line was taken to 0.9.4 (its copy under `generic-btree`). 0.7.17 is pulled by `postcard` 1.1.3 (via `loro-internal`/`serde_columnar`/`loro-common`) and 0.8.0 by `loro-delta` 1.13.0, both only under `loro` 1.17.1 (feature `collab`). The only fixed release is 0.9.4: `postcard` 1.1.3 is the latest and requires `heapless` ^0.7, and `loro-delta` 1.18.0, the latest, still requires ^0.8, so there is no upgrade to take. `postcard` uses heapless only for its `heapless::Vec`/`String` serializer flavours, which loro never calls (it uses `to_allocvec`, `to_stdvec`, `to_io`, `from_bytes`); `loro-delta` uses only `heapless::Vec`, as the inline buffer of its `ArrayVec`. No crate in the graph uses `SortedLinkedList`. Not reachable. Exit: drop the ignore when `postcard` and `loro-delta` move to heapless >=0.9.4 (or loro drops them)." },
    { id = "RUSTSEC-2026-0575", reason = "`heapless` `spsc` queue `peek` used `Relaxed` where `Acquire` is needed (data race). Same `postcard`/`loro-delta` heapless 0.7.17/0.8.0 path as RUSTSEC-2026-0574, no upgrade to take. No crate in the graph uses the `spsc` queue; loro's heapless buffers are plain single-owner `Vec`s. Not reachable. Exit: as RUSTSEC-2026-0574." },
    { id = "RUSTSEC-2026-0576", reason = "`heapless` `IndexMap::truncate` did not rebuild its indices. Same `postcard`/`loro-delta` heapless 0.7.17/0.8.0 path as RUSTSEC-2026-0574, no upgrade to take. No crate in the graph uses heapless's `IndexMap`. Not reachable. Exit: as RUSTSEC-2026-0574." },
    { id = "RUSTSEC-2026-0577", reason = "Panic-safety unsoundness in `heapless` (a panicking element `Drop` during `clear`, `retain`, `truncate`, `HistoryBuf::write` or `vec::IntoIter::drop` leaves broken invariants). Same `postcard`/`loro-delta` heapless 0.7.17/0.8.0 path as RUSTSEC-2026-0574, no upgrade to take. One affected path is in use: `loro-delta`'s `ArrayVec::into_iter` returns heapless's `vec::IntoIter`. The element type loro stores there is `ValueOrHandler` (loro values and Arc-backed container handlers), whose `Drop` does not panic, so the unwinding window the advisory needs does not open. Low exploitability, not absent. Exit: as RUSTSEC-2026-0574." },
    { id = "RUSTSEC-2026-0578", reason = "`heapless` `SortedLinkedList`'s `Zeroize` impl left the list inconsistent. Same `postcard`/`loro-delta` heapless 0.7.17/0.8.0 path as RUSTSEC-2026-0574, no upgrade to take. The 0.7 and 0.8 lines have no `Zeroize` impl at all (the feature and the code arrived later), so they are flagged by version range alone; no crate uses `SortedLinkedList` either. Not compiled. Exit: as RUSTSEC-2026-0574." },
    { id = "RUSTSEC-2026-0579", reason = "`heapless` `Deque::try_from` produced an invalid state for a full array. Same `postcard`/`loro-delta` heapless 0.7.17/0.8.0 path as RUSTSEC-2026-0574, no upgrade to take. The function is affected only in 0.9.2..0.9.4; the 0.7 and 0.8 lines are flagged by version range alone, and no crate in the graph uses `Deque`. Not reachable. Exit: as RUSTSEC-2026-0574." },
    { id = "RUSTSEC-2026-0580", reason = "Race in the `heapless` Treiber-stack memory pools (`pool`, `arc_pool`, `box_pool`, `object_pool`). Same `postcard`/`loro-delta` heapless 0.7.17/0.8.0 path as RUSTSEC-2026-0574, no upgrade to take. 0.7.17 compiles `heapless::pool` because `postcard`'s default `heapless-cas` feature turns on `cas`; 0.8.0 compiles its pools only for 32-bit ARM LL/SC targets and x86, neither of which we build. No crate in the graph allocates from a heapless pool; loro allocates through the global allocator. Not reachable. Exit: as RUSTSEC-2026-0574." },
    { id = "RUSTSEC-2026-0581", reason = "`heapless` `Deque::make_contiguous` could set `back` wrongly and write out of bounds. Same `postcard`/`loro-delta` heapless 0.7.17/0.8.0 path as RUSTSEC-2026-0574, no upgrade to take. No crate in the graph uses `Deque`. Not reachable. Exit: as RUSTSEC-2026-0574." },
    { id = "RUSTSEC-2026-0582", reason = "`heapless` `IndexMap::insert` broke its invariant on a map of `u16::MAX` elements. Same `postcard`/`loro-delta` heapless 0.7.17/0.8.0 path as RUSTSEC-2026-0574, no upgrade to take. No crate in the graph uses heapless's `IndexMap`, and the advisory itself rates the trigger very unlikely. Not reachable. Exit: as RUSTSEC-2026-0574." },
    { id = "RUSTSEC-2024-0449", reason = "`unsafe-libyaml` is unmaintained (repository archived). It is the libyaml port under `serde_yaml_ng`, our YAML parser for profiles, services manifests and agent cards. No vulnerability is reported against it; the advisory is maintenance status only, and the inputs it parses are operator-authored configuration, not untrusted network input. Exit: move YAML parsing to a maintained pure-Rust parser and drop the ignore." },
