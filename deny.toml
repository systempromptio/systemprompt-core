[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "BUSL-1.1",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
# Scoped per-crate license allowances. Prefer these over widening `allow` above:
# the exception records exactly which crate earned it and why.
exceptions = [
    # `libfuzzer-sys` is `(MIT OR Apache-2.0) AND NCSA` — the NCSA term comes from
    # the bundled LLVM libFuzzer runtime. NCSA is OSI-approved and FSF-free, and the
    # crate is a dev-only dependency of `crates/tests/fuzz`; it is never linked into
    # a published crate or a shipped binary.
    { name = "libfuzzer-sys", allow = ["NCSA"] },
]

[[licenses.clarify]]
crate = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
    { crate = "validator", reason = "Removed in favour of hand-written checks; a field rule is a few lines next to the type it guards, and the derive carried seven crates." },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
