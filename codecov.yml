# Coverage is uploaded by the Coverage workflow (lcov via OIDC) on every push
# to `main` and `next` and on the promote release PR. There is no nightly cron,
# and work no longer lands directly on main — it lands on `next` and reaches
# main through the promote PR.
coverage:
  status:
    project:
      default:
        # An absolute floor, not `auto`. Under `auto` the only signal was
        # relative to the parent commit, so coverage could erode indefinitely a
        # few tenths at a time and nothing ever failed. `threshold: 0%` because
        # the number below IS the floor — the relative guard lives in the
        # coverage.yml ratchet step, which additionally rejects a >0.5pt drop
        # against the previous successful run.
        #
        # Raise this as coverage climbs; it sits just under the measured number
        # so it guards the cliff without sitting on the edge.
        target: 89.5%
        threshold: 0%
    patch:
      default:
        # Was `informational: true`, which reported and never failed. Between
        # 7 and 28 August four features shipped with no tests at all — the
        # bridge-release routes, governance approval, marketplace skill
        # ownership and the MCP typed artifacts — and cost 0.93pt of project
        # coverage. Nothing objected at the time, because nothing was asked to.
        #
        # 75% is deliberately not 100%: it is meant to catch a feature landing
        # with no tests, not to argue about an uncovered error arm. Note this
        # status attaches to pull requests, and the only PR in this repo's flow
        # is promote -> main, so it gates a release rather than a merge.
        target: 75%
        threshold: 5%

ignore:
  - "crates/tests/**"
  # bin/bridge has its own coverage workflow (coverage-bridge.yml); keep the
  # core number disjoint from it.
  - "bin/bridge/**"

comment: false
