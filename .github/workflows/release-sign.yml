name: Release — sign & publish bridge binary

on:
  push:
    tags: ["bridge-v*"]
  workflow_dispatch:
    inputs:
      bridge_tag:
        description: "Bridge release tag (e.g. bridge-v0.9.0) — for re-runs without retagging"
        required: true

concurrency:
  group: release-sign-${{ github.event.inputs.bridge_tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  actions: read
  pull-requests: read

env:
  # Why: transient TLS resets from static.rust-lang.org and crates.io fail a run
  # on infrastructure rather than on the code. rustup and cargo both retry when
  # told to; they do not by default.
  RUSTUP_MAX_RETRIES: "10"
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  checks:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.bridge_tag || github.ref }}
      - name: Verify merged promotion proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-proof.py merged HEAD

  build:
    name: Build ${{ matrix.target }}
    needs: checks
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 pins the oldest supported runner glibc (2.35) so the
          # shipped binary runs on Debian 12 / Ubuntu 22.04 era distributions.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            asset: systemprompt-bridge-x86_64-unknown-linux-gnu
          - target: aarch64-apple-darwin
            runner: macos-14
            asset: systemprompt-bridge-aarch64-apple-darwin
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            asset: systemprompt-bridge-x86_64-pc-windows-msvc.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.bridge_tag || github.ref }}
      - name: Install libdbus (linux)
        if: runner.os == 'Linux'
        timeout-minutes: 12
        # Why: this job checks out a bridge release tag, which may predate
        # scripts/ci-install-system-deps.sh, so the same bounds are inlined.
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60)
          for attempt in 1 2 3; do
              if sudo -E timeout --kill-after=10 60 apt-get "${apt_opts[@]}" update &&
                  sudo -E timeout --kill-after=10 120 apt-get "${apt_opts[@]}" install -y --no-install-recommends libdbus-1-dev pkg-config; then
                  exit 0
              fi
              echo "::warning::system dependency install attempt $attempt/3 failed"
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          exit 1
      - run: rustup show
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: bin/bridge
          key: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --manifest-path bin/bridge/Cargo.toml --release --locked --target ${{ matrix.target }}

      - name: Rename output (unix)
        if: runner.os != 'Windows'
        run: |
          cp "bin/bridge/target/${{ matrix.target }}/release/systemprompt-bridge" "${{ matrix.asset }}"
      - name: Rename output (windows)
        if: runner.os == 'Windows'
        run: |
          Copy-Item "bin/bridge/target/${{ matrix.target }}/release/systemprompt-bridge.exe" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Sign & publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.inputs.bridge_tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum systemprompt-bridge-* > SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Sign artifacts (keyless)
        working-directory: dist
        run: |
          for f in systemprompt-bridge-* SHA256SUMS; do
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "${f}"
          done

      # Why: GitHub's asset store intermittently answers "Error saving asset"
      # to the parallel uploads action-gh-release issues (three runs in a row
      # for bridge-v0.55.0); one asset at a time, retried, and verified by
      # listing the release afterwards.
      - name: Create GitHub Release
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          cat > notes.md <<'NOTES'
          ## systemprompt bridge ${{ steps.tag.outputs.tag }}

          See the [bridge CHANGELOG](https://github.com/systempromptio/systemprompt-core/blob/main/bin/bridge/CHANGELOG.md) for the full list of changes.

          ### Verifying a signature (cosign keyless)

          ```bash
          cosign verify-blob \
            --certificate-identity-regexp='https://github.com/systempromptio/systemprompt-core/' \
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
            --signature systemprompt-bridge-x86_64-unknown-linux-gnu.sig \
            --certificate systemprompt-bridge-x86_64-unknown-linux-gnu.pem \
            systemprompt-bridge-x86_64-unknown-linux-gnu
          ```
          NOTES
          # Why: the repository publishes immutable releases — once a release is
          # published no asset can be added or replaced — so the release is
          # created as a draft, filled, checked and only then published. A
          # published release that already exists for this tag cannot be
          # completed and is a hard stop.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q false; then
            echo "::error::a published release already exists for $TAG; delete it before re-running"; exit 1
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag --draft
          for f in systemprompt-bridge-* SHA256SUMS SHA256SUMS.sig SHA256SUMS.pem; do
            n=0
            until gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber; do
              n=$((n + 1))
              [ "$n" -lt 5 ] || { echo "::error::upload of $f failed 5 times"; exit 1; }
              sleep $((10 * n))
            done
          done
          expected=$(ls systemprompt-bridge-* SHA256SUMS SHA256SUMS.sig SHA256SUMS.pem | sort)
          actual=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)
          diff <(echo "$expected") <(echo "$actual") || { echo "::error::release assets differ from dist/"; exit 1; }
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = false ] \
            || { echo "::error::$TAG is still a draft after publishing"; exit 1; }
