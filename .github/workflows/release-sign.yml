name: Release — sign & publish bridge binary

on:
  push:
    tags: ["bridge-v*"]
  workflow_dispatch:
    inputs:
      bridge_tag:
        description: "Bridge release tag (e.g. bridge-v0.9.0) — for re-runs without retagging"
        required: true

concurrency:
  group: release-sign-${{ github.event.inputs.bridge_tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  actions: read
  pull-requests: read

env:
  # Why: transient TLS resets from static.rust-lang.org and crates.io fail a run
  # on infrastructure rather than on the code. rustup and cargo both retry when
  # told to; they do not by default.
  RUSTUP_MAX_RETRIES: "10"
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  checks:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.bridge_tag || github.ref }}
      - name: Verify merged promotion proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-proof.py merged HEAD

  build:
    name: Build ${{ matrix.target }}
    needs: checks
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 pins the oldest supported runner glibc (2.35) so the
          # shipped binary runs on Debian 12 / Ubuntu 22.04 era distributions.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            asset: systemprompt-bridge-x86_64-unknown-linux-gnu
          - target: aarch64-apple-darwin
            runner: macos-14
            asset: systemprompt-bridge-aarch64-apple-darwin
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            asset: systemprompt-bridge-x86_64-pc-windows-msvc.exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.bridge_tag || github.ref }}
      - name: Install libdbus (linux)
        if: runner.os == 'Linux'
        run: |
          # A mirror hiccup is infrastructure, not a code failure; three
          # bounded attempts, then the step still fails.
          n=0
          until sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config; do
              n=$((n + 1))
              [ "$n" -lt 3 ] || exit 1
              sleep 15
          done
      - run: rustup show
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bin/bridge
          key: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --manifest-path bin/bridge/Cargo.toml --release --locked --target ${{ matrix.target }}

      - name: Rename output (unix)
        if: runner.os != 'Windows'
        run: |
          cp "bin/bridge/target/${{ matrix.target }}/release/systemprompt-bridge" "${{ matrix.asset }}"
      - name: Rename output (windows)
        if: runner.os == 'Windows'
        run: |
          Copy-Item "bin/bridge/target/${{ matrix.target }}/release/systemprompt-bridge.exe" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Sign & publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.inputs.bridge_tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum systemprompt-bridge-* > SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifacts (keyless)
        working-directory: dist
        run: |
          for f in systemprompt-bridge-* SHA256SUMS; do
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "${f}"
          done

      # Why: GitHub's asset store intermittently answers "Error saving asset"
      # to the parallel uploads action-gh-release issues (three runs in a row
      # for bridge-v0.55.0); one asset at a time, retried, and verified by
      # listing the release afterwards.
      - name: Create GitHub Release
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          cat > notes.md <<'NOTES'
          ## systemprompt bridge ${{ steps.tag.outputs.tag }}

          See the [bridge CHANGELOG](https://github.com/systempromptio/systemprompt-core/blob/main/bin/bridge/CHANGELOG.md) for the full list of changes.

          ### Verifying a signature (cosign keyless)

          ```bash
          cosign verify-blob \
            --certificate-identity-regexp='https://github.com/systempromptio/systemprompt-core/' \
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
            --signature systemprompt-bridge-x86_64-unknown-linux-gnu.sig \
            --certificate systemprompt-bridge-x86_64-unknown-linux-gnu.pem \
            systemprompt-bridge-x86_64-unknown-linux-gnu
          ```
          NOTES
          # Why: the repository publishes immutable releases — once a release is
          # published no asset can be added or replaced — so the release is
          # created as a draft, filled, checked and only then published. A
          # published release that already exists for this tag cannot be
          # completed and is a hard stop.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q false; then
            echo "::error::a published release already exists for $TAG; delete it before re-running"; exit 1
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag --draft
          for f in systemprompt-bridge-* SHA256SUMS SHA256SUMS.sig SHA256SUMS.pem; do
            n=0
            until gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber; do
              n=$((n + 1))
              [ "$n" -lt 5 ] || { echo "::error::upload of $f failed 5 times"; exit 1; }
              sleep $((10 * n))
            done
          done
          expected=$(ls systemprompt-bridge-* SHA256SUMS SHA256SUMS.sig SHA256SUMS.pem | sort)
          actual=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)
          diff <(echo "$expected") <(echo "$actual") || { echo "::error::release assets differ from dist/"; exit 1; }
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = false ] \
            || { echo "::error::$TAG is still a draft after publishing"; exit 1; }

  bump-scoop:
    name: Propose Scoop bucket update (bridge)
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.bridge_tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^bridge-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Expected a bridge-vX.Y.Z release tag"; exit 1; }
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#bridge-v}" >> "$GITHUB_OUTPUT"

      - name: Open or update Scoop manifest proposal
        id: proposal
        env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::SCOOP_BUCKET_TOKEN not set — the Scoop update requires a distribution PR"
            exit 1
          fi
          repo=systempromptio/scoop-bucket
          branch="release/bridge-${RELEASE_VERSION}"
          base=$(gh repo view "$repo" --json defaultBranchRef --jq .defaultBranchRef.name)
          [ -n "$base" ] && [ "$base" != null ] || {
            echo "::error::Scoop default branch is unavailable"; exit 1; }
          url="https://github.com/systempromptio/systemprompt-core/releases/download/${RELEASE_TAG}/systemprompt-bridge-x86_64-pc-windows-msvc.exe"
          curl -fsSL "$url" -o bridge.exe
          hash=$(sha256sum bridge.exe | cut -d' ' -f1)
          gh auth setup-git
          gh repo clone "https://github.com/$repo.git" bucket -- --branch "$base"
          cd bucket
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null; then
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git switch --create "$branch" --track "origin/$branch"
          else
            git switch --create "$branch"
          fi
          python3 - "$RELEASE_VERSION" "$url" "$hash" <<'EOF'
          import json, sys
          from pathlib import Path
          version, url, hash_ = sys.argv[1:4]
          path = Path('bucket/bridge.json')
          manifest = json.loads(path.read_text())
          manifest['version'] = version
          manifest['architecture']['64bit']['url'] = url + '#/systemprompt-bridge.exe'
          manifest['architecture']['64bit']['hash'] = hash_
          path.write_text(json.dumps(manifest, indent=2) + '\n')
          EOF
          git config user.name "systemprompt-bot"
          git config user.email "bot@systemprompt.io"
          git add bucket/bridge.json
          if ! git diff --cached --quiet; then
            git commit -m "bridge: update to ${RELEASE_VERSION}"
          fi
          git push origin "HEAD:refs/heads/$branch"
          pr=$(gh pr list --repo "$repo" --base "$base" --head "$branch" --state open --json url --jq '.[0].url // empty')
          if [ -z "$pr" ]; then
            body_file=$(mktemp)
            printf 'Update the bridge manifest to %s using the released Windows executable and its SHA-256 digest.\n\nThis is a proposal; the default branch changes only after this PR is reviewed and merged.\n' "$RELEASE_VERSION" > "$body_file"
            pr=$(gh pr create --repo "$repo" --base "$base" --head "$branch" \
              --title "bridge: update to ${RELEASE_VERSION}" --body-file "$body_file")
            rm "$body_file"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "url=$url#/systemprompt-bridge.exe" >> "$GITHUB_OUTPUT"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "Scoop proposal awaits review and merge: $pr"

      - name: Verify proposed manifest contents
        env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          PROPOSAL_BRANCH: ${{ steps.proposal.outputs.branch }}
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
          RELEASE_URL: ${{ steps.proposal.outputs.url }}
          RELEASE_HASH: ${{ steps.proposal.outputs.hash }}
          PROPOSAL_URL: ${{ steps.proposal.outputs.pr }}
        run: |
          gh api --method GET repos/systempromptio/scoop-bucket/contents/bucket/bridge.json \
            -f ref="$PROPOSAL_BRANCH" --jq .content | base64 -d > proposed-manifest.json
          python3 - <<'EOF'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('proposed-manifest.json').read_text())
          artifact = manifest['architecture']['64bit']
          expected = (os.environ['RELEASE_VERSION'], os.environ['RELEASE_URL'], os.environ['RELEASE_HASH'])
          actual = (manifest['version'], artifact['url'], artifact['hash'])
          if actual != expected:
              raise SystemExit(f'Scoop proposal contents differ: {actual!r} != {expected!r}')
          EOF
          echo "Verified Scoop proposal version, URL and SHA-256; pending merge: $PROPOSAL_URL"
