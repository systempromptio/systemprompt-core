name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  lint:
    name: Clippy lint baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `just lint` covers bin/bridge, whose keyring backend pulls
      # libdbus-sys through pkg-config; ubuntu-latest no longer ships
      # libdbus-1-dev.
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-03
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            bin/bridge
      - uses: extractions/setup-just@v2
      - run: just lint

  bridge-native:
    # The bridge's GUI, winproc, and keystore backends are cfg-gated to
    # Windows/macOS; the ubuntu lint job configures them out, so without this
    # job that code is first compiled on a bridge-v* release tag.
    name: Bridge clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-03
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bin/bridge
      - run: cargo clippy --manifest-path bin/bridge/Cargo.toml --all-targets --all-features --locked -- -D warnings

  docs:
    name: Rustdoc (warnings as errors)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      # bin/bridge's linux keyring backend pulls libdbus-sys via pkg-config.
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            bin/bridge
      - run: cargo doc --workspace --no-deps --all-features
      - run: cargo doc --manifest-path bin/bridge/Cargo.toml --no-deps

  source-gates:
    name: Schema / SQL / comment / header / typed-ID linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: extractions/setup-just@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: just lint-schema
      - run: just lint-extensions
      - run: just lint-comments
      - run: just lint-inline-tests
      - run: just lint-raw-ids
      - run: just check-headers
      - run: just lint-sqlx
      - run: just lint-http-errors
      - run: just lint-test-value
      - run: just lint-no-untyped-admin
      - run: just lint-layers
      - run: just lint-bridge-lints-sync
      - run: just lint-repo-construction
      - run: just check-release-tag
      - run: just machete

  msrv:
    name: MSRV check (Rust 1.94)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # bin/bridge's linux keyring backend pulls libdbus-sys via pkg-config.
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            bin/bridge
      - run: cargo check --workspace
      - run: cargo check --manifest-path bin/bridge/Cargo.toml

  file-size:
    name: Source file size guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - run: just file-size
