name: Supply Chain

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit SHA or branch to gate. Defaults to the triggering ref."
        type: string
        required: false
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or branch to gate. Defaults to the triggering ref."
        type: string
        required: false
  pull_request:
    branches: [main, next]
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: supply-chain-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-03
      - uses: extractions/setup-just@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: just deny
