name: Supply Chain

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or branch to gate. Defaults to the triggering ref."
        type: string
        required: false
  pull_request:
    branches: [main, next]
  push:
    branches: [main, next]
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: supply-chain-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - run: rustup show
      - uses: extractions/setup-just@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: just deny

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - run: rustup show
      - uses: extractions/setup-just@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: just audit

  # One stable context for the `main` ruleset (see ci.yml `ci-passed`).
  supply-chain-passed:
    name: Supply Chain passed
    runs-on: ubuntu-latest
    needs: [deny, audit]
    if: always()
    steps:
      - run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success")' >/dev/null \
            || { echo "::error::a required Supply Chain job did not succeed"; echo '${{ toJSON(needs) }}' | jq '.'; exit 1; }
