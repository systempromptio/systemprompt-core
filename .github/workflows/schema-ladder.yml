name: Schema ladder

# A database left by each recent release, upgraded by the tree under test, must
# end with the schema a fresh install has. Fresh-install gates cannot see a
# migration that only misbehaves on an established database; 0.59.0's
# `infra/events` 007 dropped the only `actor_id` check on every upgrading
# instance and passed all of them. Each rung's own server then boots against
# the upgraded database (scripts/schema-ladder-boot.sh): it must keep serving
# and write a quota row, or refuse a schema a `@compat: breaking` migration
# contracted — the check 0.70.0's ai/042 would have failed. Called by CI (and so part of `CI passed`);
# dispatch it directly to run one ref against chosen rungs.

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
      rungs:
        type: string
        required: false
        default: ""
      migrator-artifact:
        description: "Artifact holding the ref's prebuilt systemprompt-test-migrate (CI's `migrator` job). Empty builds it here."
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or tag whose migrations are under test. Defaults to the triggering ref."
        type: string
        required: false
      rungs:
        description: 'JSON list of release tags to upgrade from, e.g. ["v0.58.0"]. Defaults to the two newest release tags before the ref.'
        type: string
        required: false

permissions:
  contents: read

env:
  RUSTUP_MAX_RETRIES: "10"
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  # Why: the rung builds compile old release tags, which a newer toolchain may
  # warn on; denying warnings there would fail a rung on lint drift, not schema.
  RUSTFLAGS: ""
  CARGO_PROFILE_DEV_DEBUG: "0"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: "0"

jobs:
  rungs:
    name: Choose rungs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rungs: ${{ steps.pick.outputs.rungs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: pick
        env:
          CHOSEN: ${{ inputs.rungs }}
        run: |
          if [ -n "$CHOSEN" ]; then
              rungs=$(jq -c . <<<"$CHOSEN")
          else
              head=$(git rev-parse HEAD)
              rungs=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname --merged HEAD \
                  | while read -r tag; do
                        [ "$(git rev-parse "$tag^{commit}")" = "$head" ] || echo "$tag"
                    done \
                  | head -2 | jq -Rsc 'split("\n") | map(select(length > 0))')
          fi
          [ "$rungs" != "[]" ] || { echo "::error::no release tag to upgrade from"; exit 1; }
          echo "rungs=$rungs" >> "$GITHUB_OUTPUT"
          echo "Rungs: $rungs"

  ladder:
    name: Upgrade from ${{ matrix.rung }}
    needs: rungs
    runs-on: ubuntu-latest
    # Why: a cold rung builds its whole CLI; the binary cache below makes
    # every later run of the same tag a migrator-and-boot run.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        rung: ${{ fromJSON(needs.rungs.outputs.rungs) }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      # Why: the ladder scripts come from this workflow's own commit, so a
      # dispatched run can test an old ref that predates them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: ladder-tools
          sparse-checkout: scripts
      - run: rustup show
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Fetch the current migrator
        if: ${{ inputs.migrator-artifact != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.migrator-artifact }}
          path: target-ladder/debug/
      - name: Build the current migrator
        if: ${{ inputs.migrator-artifact == '' }}
        run: |
          cargo build --manifest-path crates/tests/Cargo.toml -p systemprompt-test-migrate \
              --target-dir target-ladder
      - run: chmod +x target-ladder/debug/systemprompt-test-migrate
      # Why: a release tag never moves, so its built binaries are reusable
      # verbatim; caching them keeps the rung builds off every run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ladder-bin
          key: schema-ladder-bin-${{ runner.os }}-${{ matrix.rung }}-v1
      - name: Upgrade a ${{ matrix.rung }} database, compare with a fresh install, boot ${{ matrix.rung }} on it
        timeout-minutes: 75
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test
          PGPASSWORD: test
          LADDER_BIN_DIR: ladder-bin
          LADDER_MOCK_TARGET: target-ladder-mock
        run: |
          bash ladder-tools/scripts/schema-ladder.sh "${{ matrix.rung }}" \
              target-ladder/debug/systemprompt-test-migrate
      - run: sccache --show-stats
        if: ${{ !cancelled() }}
