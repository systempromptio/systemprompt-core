name: Release candidate
on:
  push:
    branches: [next]
permissions:
  contents: read
jobs:
  candidate:
    name: Candidate ancestry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify candidate ancestry
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-proof.py candidate HEAD
