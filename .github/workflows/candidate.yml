name: Release candidate
on:
  push:
    branches: [next]
permissions:
  contents: read
jobs:
  candidate:
    name: Candidate ancestry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify candidate ancestry
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-proof.py candidate HEAD
