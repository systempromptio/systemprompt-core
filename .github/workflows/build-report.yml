name: Build report

# Informational: crate-closure counts, stripped release binary size and the
# developer loop (`cargo check` / `cargo clippy`, clean and after touching one
# leaf file) per supported composition (scripts/build-compositions.txt), plus
# `cargo bloat --crates` and `cargo build --timings` for the largest; and, in
# the test-loop job, the test-archive build and nextest run seconds per unit of
# scripts/units.txt. A workflow of its own and never a required check, so a
# slow or failed report never changes the conclusion of a gate run that
# release-proof.py reads.
#
# Each composition and each unit is measured by a job of its own (a matrix
# from `build-report.sh --list`), so no job runs for more than one line's
# build; the jobs share one sccache, and a summary job renders the report from
# their JSON sidecars with `--merge`. The test loop builds the migrate tool and
# the subprocess binary once and hands them to every unit job as an artifact.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or branch to report on. Defaults to the triggering ref."
        type: string
        required: false
      closure_only:
        description: "Report crate-closure counts only (no compile)."
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [future]
    paths:
      - scripts/build-report.sh
      - scripts/build-compositions.txt
      - scripts/units.txt
      - .github/workflows/build-report.yml

concurrency:
  group: build-report-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Why: transient TLS resets from static.rust-lang.org and crates.io fail a run
  # on infrastructure rather than on the code. rustup and cargo both retry when
  # told to; they do not by default.
  RUSTUP_MAX_RETRIES: "10"
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  RUSTFLAGS: ""
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  plan:
    name: Build report plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      compositions: ${{ steps.list.outputs.compositions }}
      units: ${{ steps.list.outputs.units }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: list
        run: |
          echo "compositions=$(bash scripts/build-report.sh --list)" >> "$GITHUB_OUTPUT"
          echo "units=$(bash scripts/build-report.sh --units --list)" >> "$GITHUB_OUTPUT"

  build-report:
    name: Build report (${{ matrix.composition }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        composition: ${{ fromJSON(needs.plan.outputs.compositions) }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: rustup show
      - name: Install system dependencies
        run: bash scripts/ci-install-system-deps.sh libdbus-1-dev pkg-config
      - uses: ./.github/actions/sccache
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        if: ${{ !inputs.closure_only }}
        with:
          tool: cargo-bloat
      - name: Build report
        run: |
          mode=(--dev-loop)
          [ "${{ inputs.closure_only }}" = true ] && mode=(--closure-only)
          bash scripts/build-report.sh "${mode[@]}" --only "${{ matrix.composition }}" "target/build-report/part/${{ matrix.composition }}.md"
          [ -f target/build-report/bloat.json ] && cp target/build-report/bloat.json target/build-report/part/ || true
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-report-part-${{ matrix.composition }}
          path: |
            target/build-report/part/*.json
            target/build-report/cargo-timing.html
          if-no-files-found: warn

  build-report-summary:
    name: Build report
    needs: build-report
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: build-report-part-*
          path: target/build-report/parts
          merge-multiple: true
      - name: Merge the report
        run: |
          mode=(--dev-loop)
          [ "${{ inputs.closure_only }}" = true ] && mode=(--closure-only)
          bash scripts/build-report.sh "${mode[@]}" --merge target/build-report/parts target/build-report/report.md
      - if: always()
        run: cat target/build-report/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-report
          path: |
            target/build-report/report.md
            target/build-report/report.json
            target/build-report/parts/cargo-timing.html
            target/build-report/parts/bloat.json
          if-no-files-found: warn

  test-loop-tools:
    name: Test loop tools
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ !inputs.closure_only }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: rustup show
      - name: Install system dependencies
        run: bash scripts/ci-install-system-deps.sh libdbus-1-dev pkg-config
      - uses: ./.github/actions/sccache
      - name: Build the migrate tool and the systemprompt binary the subprocess tests spawn
        run: |
          cargo build --manifest-path crates/tests/Cargo.toml -p systemprompt-test-migrate --locked
          cargo build -p systemprompt --bin systemprompt --features reference --locked
          mkdir -p target/test-loop-tools
          cp "$(cargo metadata --manifest-path crates/tests/Cargo.toml --no-deps --format-version 1 | jq -r .target_directory)/debug/systemprompt-test-migrate" target/test-loop-tools/
          cp "$(cargo metadata --no-deps --format-version 1 | jq -r .target_directory)/debug/systemprompt" target/test-loop-tools/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-loop-tools
          path: target/test-loop-tools/
          retention-days: 1

  test-loop:
    name: Test loop report (${{ matrix.unit }})
    needs: [plan, test-loop-tools]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ !inputs.closure_only }}
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.plan.outputs.units) }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      DATABASE_URL: postgres://test:test@localhost:5432/test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: rustup show
      - name: Install system dependencies
        run: bash scripts/ci-install-system-deps.sh libdbus-1-dev pkg-config
      - uses: ./.github/actions/sccache
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.146
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-loop-tools
          path: target/test-loop-tools
      - name: Migrate the test database
        run: |
          chmod +x target/test-loop-tools/*
          target/test-loop-tools/systemprompt-test-migrate
          echo "SYSTEMPROMPT_BIN=$PWD/target/test-loop-tools/systemprompt" >> "$GITHUB_ENV"
      - name: Test loop report
        env:
          NEXTEST_PROFILE: ci
          UNIT: ${{ matrix.unit }}
        run: bash scripts/build-report.sh --units --only "$UNIT" "target/build-report/part/${UNIT//:/-}.md"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-report-units-part-${{ strategy.job-index }}
          path: target/build-report/part/*.json
          if-no-files-found: warn

  test-loop-summary:
    name: Test loop report
    needs: test-loop
    if: ${{ always() && !inputs.closure_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: build-report-units-part-*
          path: target/build-report/units-parts
          merge-multiple: true
      - name: Merge the report
        run: bash scripts/build-report.sh --units --merge target/build-report/units-parts target/build-report/units.md
      - if: always()
        run: cat target/build-report/units.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-report-units
          path: |
            target/build-report/units.md
            target/build-report/units.json
          if-no-files-found: warn
