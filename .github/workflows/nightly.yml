# Nightly gate: apply the mechanical coding-standards fixes to `next`, run the
# full pre-release cycle against it, and move `main` only if every gate is green.
#
# `next` is the feeder branch — every agent and every local session commits and
# pushes there without running a gate. `main` is protected and release-only: it
# moves only through the promote job below, so its tip is always a commit that
# passed the whole cycle.
#
# The heavy gates live in ci.yml / quality.yml / supply-chain.yml and are called
# from here with an explicit `ref`. A scheduled run always uses the workflow
# files as they exist on the default branch, so the *gate definitions* come from
# protected `main` while the *code under test* comes from `next`.
name: Nightly

on:
  schedule:
    # 02:17 UTC — before the 06:23 coverage run, so a promoted `main` is what
    # coverage measures.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      autofix:
        description: "Commit mechanical fixes (fmt, clippy --fix) back to next"
        type: boolean
        default: true
      promote:
        description: "Move main to the gated commit when every gate is green"
        type: boolean
        default: true

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Mechanical fixes. Anything rustfmt or clippy can rewrite on its own is
  #    applied and pushed straight back to `next`, so an agent never has to run
  #    the formatter to land work. Judgement-requiring failures are NOT fixed
  #    here — they fail the gate below and hold `main` back.
  # ---------------------------------------------------------------------------
  autofix:
    name: Auto-fix coding standards
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.result.outputs.sha }}
      changed: ${{ steps.result.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: next
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-03
          components: rustfmt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-dev pkg-config

      - name: rustfmt (all three workspaces)
        if: inputs.autofix != false
        run: just fmt

      # clippy --fix only applies machine-applicable suggestions. If it rewrites
      # something into a broken state the gate jobs below catch it and `main` is
      # not promoted, so this is safe to run unattended.
      - name: clippy --fix (machine-applicable only)
        if: inputs.autofix != false
        continue-on-error: true
        run: |
          cargo clippy --fix --allow-dirty --allow-staged \
            --workspace --all-targets --all-features || true
          cargo clippy --fix --allow-dirty --allow-staged \
            --manifest-path bin/bridge/Cargo.toml --all-targets || true
      - name: rustfmt again (clippy --fix reflows code)
        if: inputs.autofix != false
        run: just fmt

      - name: Commit and push to next
        id: result
        run: |
          set -euo pipefail
          git config user.name  "systemprompt-nightly[bot]"
          git config user.email "nightly@systemprompt.io"
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git add -A
            git commit \
              -m "style: apply the nightly mechanical coding-standards fixes" \
              -m "rustfmt across all three workspaces plus clippy's machine-applicable suggestions. No judgement calls are made here."
            git push origin HEAD:next
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "no mechanical fixes needed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 2. The pre-release cycle, against the post-autofix commit.
  # ---------------------------------------------------------------------------
  ci:
    name: Gate
    needs: autofix
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.autofix.outputs.sha }}

  quality:
    name: Gate
    needs: autofix
    uses: ./.github/workflows/quality.yml
    with:
      ref: ${{ needs.autofix.outputs.sha }}

  supply-chain:
    name: Gate
    needs: autofix
    uses: ./.github/workflows/supply-chain.yml
    with:
      ref: ${{ needs.autofix.outputs.sha }}

  # ---------------------------------------------------------------------------
  # 3. Promote, by opening and merging a pull request.
  #
  #    `main` requires a pull request and grants no bypass to anyone — that is
  #    what stops every human and agent pushing to it directly, and it applies
  #    to repository admins too. A merge is therefore the only way in, including
  #    for this job; GITHUB_TOKEN needs no special standing to merge, only to
  #    open the PR and call the merge API.
  # ---------------------------------------------------------------------------
  promote:
    name: Promote next to main
    needs: [autofix, ci, quality, supply-chain]
    if: ${{ inputs.promote != false }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Open or reuse the promotion PR, then merge it
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.autofix.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin next main
          if git merge-base --is-ancestor "$SHA" origin/main; then
            echo "main already contains $SHA — nothing to promote."
            exit 0
          fi

          # Promote a FROZEN ref, never `next` itself. A PR whose head is
          # `next` merges whatever `next` points at *when the merge runs*, so a
          # push landing during the ~40min gate would ride into `main` ungated.
          # (That happened on the first live run.) `promote` is force-updated to
          # the exact commit the gates passed, and that is what gets merged.
          git push --force origin "$SHA:refs/heads/promote"

          # `gh pr create` has no --json flag: it prints the URL. Ask for the
          # number separately rather than trying to capture it from the create.
          NUM=$(gh pr list --base main --head promote --state open \
                  --json number --jq '.[0].number // empty')
          if [ -z "$NUM" ]; then
            gh pr create --base main --head promote \
              --title "Promote next to main" \
              --body "Opened by the Nightly workflow after every gate passed against \`$SHA\`."
            NUM=$(gh pr list --base main --head promote --state open \
                    --json number --jq '.[0].number // empty')
          fi
          if [ -z "$NUM" ]; then
            echo "::error::could not open or find a promote -> main pull request"
            exit 1
          fi
          echo "merging PR #$NUM (frozen at $SHA)"
          # No --admin: the ruleset requires 0 approvals, so an ordinary merge
          # satisfies it. --admin would need admin rights GITHUB_TOKEN lacks.
          gh pr merge "$NUM" --merge
          echo "promoted $SHA to main via PR #$NUM"

      - name: Summary
        run: |
          {
            echo "### Nightly promoted \`next\` → \`main\`"
            echo
            echo "- commit: \`${{ needs.autofix.outputs.sha }}\`"
            echo "- mechanical fixes committed: \`${{ needs.autofix.outputs.changed }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 4. Report when the cycle held `main` back, so a red night is visible without
  #    reading the run.
  # ---------------------------------------------------------------------------
  report:
    name: Report a held-back main
    needs: [autofix, ci, quality, supply-chain]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Summarise
        run: |
          {
            echo "### Nightly gate failed — \`main\` was NOT promoted"
            echo
            echo "\`next\` is at \`${{ needs.autofix.outputs.sha }}\`."
            echo "Mechanical fixes were applied where possible; what remains needs a person."
            echo
            echo "| gate | result |"
            echo "|---|---|"
            echo "| CI | ${{ needs.ci.result }} |"
            echo "| Quality | ${{ needs.quality.result }} |"
            echo "| Supply Chain | ${{ needs['supply-chain'].result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
