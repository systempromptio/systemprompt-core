name: Coverage (bridge, native)

# Measures line coverage of the platform-gated `bin/bridge/src/gui` tree (and the
# OS-specific keystore/registry/MDM backends) on macOS and Windows, where that
# code actually compiles. The Linux `coverage.yml` workflow already instruments
# the cross-platform bridge surface (the bridge is a path dependency of the
# crates/tests workspace), but `gui/` is `#[cfg(any(target_os = "windows",
# target_os = "macos"))]` and is configured out on Linux, so it never appears
# there. This job closes that gap so combined coverage reflects the whole crate.
#
# Unlike the Linux job, this one can use cargo-llvm-cov directly: the mold linker
# that forces the Linux job's hand-rolled instrumentation is scoped to
# `[target.x86_64-unknown-linux-gnu]` in crates/tests/.cargo/config.toml and does
# not apply on these hosts.

on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * 1"

concurrency:
  # A weekly measurement: a second dispatch queues behind the first instead of
  # discarding a half-finished native build.
  group: coverage-bridge-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Why: transient TLS resets from static.rust-lang.org and crates.io fail a run
  # on infrastructure rather than on the code. rustup and cargo both retry when
  # told to; they do not by default.
  RUSTUP_MAX_RETRIES: "10"
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ""
  SQLX_OFFLINE: "true"
  CARGO_INCREMENTAL: "0"

jobs:
  coverage:
    name: gui coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            crates/tests

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov@0.9.1,nextest@0.9.146

      # A nextest `-E` filter selects which tests run, not what cargo builds, so
      # it cannot keep a package out of the graph. The packages are the native
      # set in scripts/bridge-native-crates.txt, the list quality.yml runs and
      # scripts/lint-native-test-deps.sh holds complete and buildable here.
      - name: Select bridge test packages that build off Linux
        shell: bash
        run: |
          pkgs=""
          while IFS= read -r crate; do
              pkgs+="-p $crate "
          done < <(grep -vE '^[[:space:]]*(#|$)' scripts/bridge-native-crates.txt)
          if [ -z "$pkgs" ]; then
              echo "scripts/bridge-native-crates.txt lists no crates" >&2
              exit 1
          fi
          echo "BRIDGE_PKGS=$pkgs" >> "$GITHUB_ENV"

      - name: Instrumented bridge tests + coverage
        shell: bash
        run: |
          # Without --no-fail-fast nextest cancels the run at the first failure,
          # so a red macOS or Windows job names two or three tests and leaves
          # the rest of the suite unreported — you fix those and rediscover the
          # next few on the following run.
          cargo llvm-cov nextest \
            --manifest-path crates/tests/Cargo.toml \
            $BRIDGE_PKGS \
            --no-fail-fast \
            --ignore-filename-regex '(crates[\\/]tests|[\\/]\.cargo[\\/]|rustc)' \
            --summary-only \
            | tee coverage-bridge-${{ matrix.os }}.txt

          cargo llvm-cov report \
            --manifest-path crates/tests/Cargo.toml \
            --ignore-filename-regex '(crates[\\/]tests|[\\/]\.cargo[\\/]|rustc)' \
            --lcov --output-path lcov-bridge-${{ matrix.os }}.info

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-bridge-${{ matrix.os }}
          path: |
            coverage-bridge-${{ matrix.os }}.txt
            lcov-bridge-${{ matrix.os }}.info

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Bridge coverage (${{ matrix.os }})"
            echo ""
            echo '```'
            tail -40 "coverage-bridge-${{ matrix.os }}.txt" 2>/dev/null || echo "(no summary produced)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
