name: Coverage

on:
  workflow_dispatch:
  # `main` is the canonical line: the pull_request trigger measures the
  # promote -> main release PR before it is merged, and the push trigger
  # produces the number for the commit that became main, which is the baseline
  # the ratchet below reads back.
  #
  # `next` runs too, despite this being the heaviest job here (the instrumented
  # build is ~2-3x). Measuring only the released line meant coverage spoke once
  # per release, on the promote PR — so a 0.93pt erosion across four releases
  # went unseen until the moment it was most expensive to discover, and the
  # crates that caused it had shipped weeks earlier. A number that arrives after
  # the code is merged cannot influence the code. The concurrency group below is
  # cancel-in-progress, so a burst of pushes collapses to one live run.
  pull_request:
    branches: [main]
  push:
    branches: [main, next]

concurrency:
  # Keyed by event as well as ref: without the event, the release PR's run and
  # the run on the merge commit could share a bucket and cancel an hour of
  # instrumented build.
  group: coverage-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write
  # The ratchet step downloads the previous successful run's coverage artifact.
  actions: read

env:
  # Why: transient TLS resets from static.rust-lang.org and crates.io fail a run
  # on infrastructure rather than on the code. rustup and cargo both retry when
  # told to; they do not by default.
  RUSTUP_MAX_RETRIES: "10"
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ""
  SQLX_OFFLINE: "true"
  # Keep only line tables (coverage needs line mapping, not full debuginfo),
  # disable incremental artifacts, and serialize codegen: the instrumented
  # cold rebuild of the whole test workspace otherwise peaks past the runner's
  # RAM and the hosted runner loses communication mid-build.
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  CARGO_INCREMENTAL: "0"
  # 2 jobs fits the 16GB runner with line-tables-only debuginfo; 1 job made
  # the --bins --tests instrumented build overrun the job timeout.
  CARGO_BUILD_JOBS: "2"
  # The instrumented --bins --tests target tree does not fit the root disk
  # even after the cleanup step; the runner's second disk at /mnt has ~65GB.
  # One shared target dir also dedupes dependency builds between the main
  # workspace (instrumented CLI) and the test workspace.
  CARGO_TARGET_DIR: /mnt/coverage-target

jobs:
  coverage:
    name: Line coverage (cargo-llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Runner resources
        run: |
          echo "cores: $(nproc)"; free -h; df -h /

      - name: Free runner disk (instrumented --bins --tests build overflows the default ~14GB)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell \
            /usr/local/lib/node_modules "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo mkdir -p /mnt/coverage-target /mnt/profraw /mnt/tmp
          sudo chmod 777 /mnt/coverage-target /mnt/profraw /mnt/tmp
          df -h / /mnt

      - name: Install libdbus (bridge test bins link keyring -> dbus)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Strip [unstable] and [profile.dev] from cargo configs
        run: |
          python3 - <<'PY'
          import re, pathlib
          for path in (".cargo/config.toml", "crates/tests/.cargo/config.toml"):
              p = pathlib.Path(path)
              if not p.exists():
                  continue
              s = p.read_text()
              # Drop sections that trigger the unstable `codegen-backend` feature
              # and anything forcing sccache. CI uses stable LLVM default.
              s = re.sub(r'\n\[unstable\][^\[]*', '\n', s, flags=re.S)
              s = re.sub(r'\n\[profile\.dev\][^\[]*', '\n', s, flags=re.S)
              s = re.sub(r'\nRUSTC_WRAPPER\s*=.*', '', s)
              p.write_text(s)
              print(f"--- {path} ---")
              print(p.read_text())
          PY

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/tests
      - uses: taiki-e/install-action@nextest

      - name: Migrate coverage test database
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test
          # Build the migrate tool against the committed .sqlx cache: the schema
          # it is about to create does not exist yet, so live query verification
          # of its core-crate dependencies would fail on a cold build cache.
          SQLX_OFFLINE: "true"
        run: |
          cargo run \
            --manifest-path crates/tests/Cargo.toml \
            -p systemprompt-test-migrate \
            --release

      - name: Build instrumented systemprompt binary
        env:
          # Continuous mode (%c) must be baked in at build time via the counter
          # relocation flag; keep RUSTFLAGS identical to the test step so the
          # CLI binary pools correctly when subprocess tests run it.
          RUSTFLAGS: "-C instrument-coverage -C llvm-args=--runtime-counter-relocation"
        run: |
          mkdir -p "/mnt/profraw"
          # The crates/tests workspace does not include entry/cli, so the test
          # run's --bins would not produce this binary; subprocess tests invoke
          # it via SYSTEMPROMPT_BIN and its counters land in the shared profraw
          # directory.
          cargo build -p systemprompt-cli --bin systemprompt

      - name: Run instrumented tests (RUSTFLAGS so path deps get instrumented)
        id: tests
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test
          # Continuous mode: %c makes every process for a given binary mmap and
          # merge into ONE file keyed by %m (the binary signature), instead of
          # %p writing a fresh full-counter dump per process. The prior %p-%m
          # pattern produced 23k profraw files (~100GB) and filled the disk;
          # %m%c collapses that to one file per instrumented binary.
          LLVM_PROFILE_FILE: /mnt/profraw/%m%c.profraw
          RUSTFLAGS: "-C instrument-coverage -C llvm-args=--runtime-counter-relocation"
          SQLX_OFFLINE: "false"
          SYSTEMPROMPT_BIN: /mnt/coverage-target/debug/systemprompt
          # Test tempdirs (generator sites, CLI subprocess fixtures) otherwise
          # accumulate on the root disk.
          TMPDIR: /mnt/tmp
        run: |
          mkdir -p "/mnt/profraw"

          # Inline root-disk watchdog. It MUST live in this step: a background
          # process started in an earlier step is reaped when that step ends, so
          # the previous standalone watchdog never actually ran. If root nears
          # zero the runner agent itself dies and uploads no logs, so snapshot
          # what is consuming the disk (to the surviving /mnt) and kill the run
          # before the agent crashes.
          bash -c '
            while sleep 15; do
              avail=$(df --output=avail -BM / | tail -1 | tr -dc 0-9)
              echo "watchdog: root ${avail}M free"
              if [ "${avail:-0}" -lt 3072 ]; then
                { echo "ROOT DISK LOW: ${avail}M free"; date -u;
                  df -h / /mnt;
                  echo "--- top root consumers (excl /mnt) ---";
                  sudo du -xh -d4 / 2>/dev/null | sort -rh | head -40;
                  echo "--- docker ---";
                  sudo du -sh /var/lib/docker 2>/dev/null;
                } > /mnt/tmp/watchdog.log 2>&1
                sudo pkill -9 -f "cargo|nextest|systemprompt" || true
                break
              fi
            done
          ' &
          WATCHDOG=$!

          set +e
          # nextest runs each test in its own process; continuous mode (%c)
          # lets those processes share one mmap'd profile per binary instead of
          # each dumping a full-counter file.
          cargo nextest run --profile coverage \
            --manifest-path crates/tests/Cargo.toml \
            --workspace --lib --bins --tests --no-fail-fast
          status=$?
          set -e
          kill "$WATCHDOG" 2>/dev/null || true

          echo "profraw count: $(find /mnt/profraw -name '*.profraw' | wc -l)"
          df -h / /mnt

          # Downstream render/ratchet/upload steps key off this, not on always():
          # nextest exits 100 when tests ran and some failed (the counters are
          # still complete enough to report) but 101 when the workspace failed to
          # compile, in which case no instrumented binary ever ran and llvm-cov
          # renders a spurious 0.00% that Codecov records as the branch number.
          instrumented=false
          if { [ "$status" -eq 0 ] || [ "$status" -eq 100 ]; } \
             && [ ! -f /mnt/tmp/watchdog.log ]; then
            instrumented=true
          fi
          echo "instrumented=$instrumented" >> "$GITHUB_OUTPUT"

          if [ -f /mnt/tmp/watchdog.log ]; then
            echo "=== watchdog tripped ==="; cat /mnt/tmp/watchdog.log; exit 1
          fi
          exit $status

      # --ignore-filename-regex below excludes twelve process-entry files. Ten
      # CLI ones (serve, deploy orchestrator/artifacts, tenant create cloud,
      # setup docker/docker_database, backup client/mod, plugins run, agents
      # run) and two domain ones (a2a_server standalone, mcp orchestrator
      # daemon). Each is a supervisor that spawns a subprocess, binds a
      # listener, or loops until a signal, has no seam to drive from a test,
      # and measures 0%. Listed file-by-file, not by directory, so testable
      # code alongside them still counts — which is why sibling files with
      # real seams (a2a_server/server.rs, backup/extract.rs, policy/audit.rs)
      # are deliberately absent. Mirrors the justfile `coverage` recipe
      # comment — keep both in sync.
      - name: Merge profdata and render
        if: ${{ always() && steps.tests.outputs.instrumented == 'true' }}
        run: |
          LLVM_PROFDATA=$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-profdata
          LLVM_COV=$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-cov
          "$LLVM_PROFDATA" merge -sparse \
            "/mnt/profraw"/*.profraw \
            -o coverage-merged.profdata

          # Collect every test binary produced (strip dedup-by-cratename).
          BINS=$(find /mnt/coverage-target/debug/deps -maxdepth 1 -executable -type f -name 'systemprompt_*' ! -name '*.d' -printf '%T@ %p\n' \
            | sort -rn \
            | awk '{ base=$2; sub(".*/", "", base); sub(/-[0-9a-f]+$/, "", base); if (!seen[base]++) print $2 }')
          SP_BIN="/mnt/coverage-target/debug/systemprompt"
          [ -x "$SP_BIN" ] && BINS="$BINS $SP_BIN"
          OBJ_ARGS=""
          for b in $BINS; do OBJ_ARGS="$OBJ_ARGS --object $b"; done

          # Unfiltered first so we can see raw paths llvm-cov emits.
          "$LLVM_COV" report --instr-profile=coverage-merged.profdata $OBJ_ARGS \
            --ignore-filename-regex='(\.cargo|rustc|crates/tests|/debug/build/[^/]+/out/|/home/runner/\.cargo|crates/domain/(agent/src/services/a2a_server/standalone|mcp/src/services/orchestrator/daemon)\.rs|crates/entry/cli/src/commands/(infrastructure/services/serve|cloud/deploy/pipeline/(orchestrator|artifacts)|cloud/tenant/create/cloud|admin/setup/docker(_database)?|cloud/backup/(client|mod)|plugins/run|admin/agents/run)\.rs)' \
            --summary-only \
            | tee coverage-summary.txt

          "$LLVM_COV" export --instr-profile=coverage-merged.profdata $OBJ_ARGS \
            --ignore-filename-regex='(\.cargo|rustc|crates/tests|/debug/build/[^/]+/out/|/home/runner/\.cargo|crates/domain/(agent/src/services/a2a_server/standalone|mcp/src/services/orchestrator/daemon)\.rs|crates/entry/cli/src/commands/(infrastructure/services/serve|cloud/deploy/pipeline/(orchestrator|artifacts)|cloud/tenant/create/cloud|admin/setup/docker(_database)?|cloud/backup/(client|mod)|plugins/run|admin/agents/run)\.rs)' \
            --format=text --summary-only \
            > coverage-summary.json

          "$LLVM_COV" export --instr-profile=coverage-merged.profdata $OBJ_ARGS \
            --ignore-filename-regex='(\.cargo|rustc|crates/tests|/debug/build/[^/]+/out/|/home/runner/\.cargo|crates/domain/(agent/src/services/a2a_server/standalone|mcp/src/services/orchestrator/daemon)\.rs|crates/entry/cli/src/commands/(infrastructure/services/serve|cloud/deploy/pipeline/(orchestrator|artifacts)|cloud/tenant/create/cloud|admin/setup/docker(_database)?|cloud/backup/(client|mod)|plugins/run|admin/agents/run)\.rs)' \
            --format=lcov \
            > lcov.info

      - name: Upload coverage artifacts
        if: ${{ always() && steps.tests.outputs.instrumented == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage-summary.txt
            coverage-summary.json
            lcov.info

      # Two independent guards. The FLOOR is absolute and always evaluated:
      # without it, coverage could erode indefinitely in sub-0.5pt steps and the
      # relative check would pass every single time. The RATCHET catches a sharp
      # single-run drop that still lands above the floor, and is skipped when
      # there is no previous artifact to compare against — which is exactly why
      # the floor must not live behind that same early exit.
      #
      # The ratchet compares against the last *successful* run, so a run that
      # fails cannot advance the baseline: one red run leaves every later run
      # comparing against an ever-older number until the accumulated drift of
      # many commits trips a threshold meant for one. That is not a regression
      # signal, it is the absence of one, and reporting it as a failure is how
      # this gate stayed red for three weeks in August 2026 while nobody could
      # tell whether coverage was actually falling. Past MAX_BASELINE_AGE_DAYS
      # the comparison is therefore abandoned rather than made loosely, and the
      # floor carries the run alone.
      #
      # Every path that declines to compare says so as a ::warning:: — a
      # floor-only run must be visibly floor-only, because a silently skipped
      # ratchet looks exactly like a passing one.
      #
      # Raise COVERAGE_FLOOR as coverage climbs; keep it in step with
      # codecov.yml's `project.default.target`.
      - name: Coverage floor and ratchet
        if: ${{ steps.tests.outputs.instrumented == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          COVERAGE_FLOOR: "91.5"
          MAX_BASELINE_AGE_DAYS: "10"
        run: |
          # Baseline against the branch this run is measuring. A `next` run
          # compared against `main` can never advance the baseline — only a
          # `main` run can — so every `next` run would find an ever-older
          # `main` number, trip the staleness guard, and coast on the floor
          # until the next release. The ratchet would be permanently dormant
          # between promotes, which is most of the time and exactly the window
          # it is meant to cover. Run-to-run on `next` is the comparison that
          # catches a regression while the code is still being written; the
          # promote PR and the `main` push still measure against `main`.
          BASELINE_BRANCH="main"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "next" ]; then
            BASELINE_BRANCH="next"
          fi
          echo "baseline branch: $BASELINE_BRANCH"
          PREV=$(gh run list --workflow coverage.yml --status success \
            --branch "$BASELINE_BRANCH" --limit 1 --json databaseId,createdAt \
            --jq '.[0] | "\(.databaseId) \(.createdAt)"' \
            -R "${{ github.repository }}")
          PREV_ID="${PREV%% *}"
          PREV_CREATED="${PREV#* }"
          # Exported into this shell, not $GITHUB_ENV: GITHUB_ENV only reaches
          # LATER steps, and the python below runs in this one. Written there it
          # would arrive empty, the age check would never fire, and the staleness
          # guard would silently do nothing — the exact failure it exists to stop.
          export COVERAGE_PREV_CREATED=""
          if [ -n "$PREV_ID" ] && [ "$PREV_ID" != "null" ]; then
            echo "baseline: run $PREV_ID from $PREV_CREATED"
            export COVERAGE_PREV_CREATED="$PREV_CREATED"
            gh run download "$PREV_ID" -n coverage -D prev-coverage \
              -R "${{ github.repository }}" \
              || echo "::warning::ratchet skipped: run $PREV_ID has no coverage artifact (expired?); the floor is the only guard on this run"
          else
            echo "::warning::ratchet skipped: no previous successful coverage run to compare against; the floor is the only guard on this run"
          fi
          python3 - <<'PY'
          import datetime as dt, json, os, pathlib, sys

          def pct(path):
              with open(path) as f:
                  return json.load(f)["data"][0]["totals"]["lines"]["percent"]

          def warn(message):
              print(f"::warning::{message}")

          floor = float(os.environ["COVERAGE_FLOOR"])
          max_age = float(os.environ["MAX_BASELINE_AGE_DAYS"])
          cur = pct("coverage-summary.json")
          failures = []

          print(f"current: {cur:.2f}%  floor: {floor:.2f}%")
          if cur < floor:
              failures.append(f"line coverage {cur:.2f}% is below the {floor:.2f}% floor")

          prev_path = pathlib.Path("prev-coverage/coverage-summary.json")
          created = os.environ.get("COVERAGE_PREV_CREATED", "")
          age_days = None
          if created:
              stamp = dt.datetime.fromisoformat(created.replace("Z", "+00:00"))
              age_days = (dt.datetime.now(dt.timezone.utc) - stamp).total_seconds() / 86400

          if not prev_path.exists():
              warn("ratchet skipped: no baseline summary was downloaded; the floor is the only guard on this run")
          elif age_days is not None and age_days > max_age:
              warn(
                  f"ratchet skipped: the newest successful coverage run is {age_days:.1f} days old "
                  f"(limit {max_age:.0f}); a gap that long measures accumulated drift across many "
                  f"commits, not a regression. The floor is the only guard on this run — fix the "
                  f"cause of the failing runs so the baseline can advance."
              )
              print(f"previous: {pct(prev_path):.2f}%  (not compared)")
          else:
              prev = pct(prev_path)
              age = f"{age_days:.1f}d old" if age_days is not None else "age unknown"
              print(f"previous: {prev:.2f}%  ({age})  delta: {cur - prev:+.2f}pt")
              if cur < prev - 0.5:
                  failures.append(
                      f"line coverage dropped more than 0.5pt ({prev:.2f}% -> {cur:.2f}%)"
                  )

          if failures:
              sys.exit("; ".join(failures))
          PY

      - name: Upload coverage to Codecov
        # Guard on both the instrumented run and the rendered report: hashFiles
        # alone is not enough, because a workspace that fails to compile still
        # renders a well-formed all-zero lcov.info, which Codecov then records as
        # the branch number (0%) instead of leaving the last real one in place.
        if: ${{ always() && steps.tests.outputs.instrumented == 'true' && hashFiles('lcov.info') != '' }}
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
          use_oidc: true

      - name: Disk watchdog report
        if: always()
        run: |
          df -h / /mnt
          [ -f /mnt/tmp/watchdog.log ] && cat /mnt/tmp/watchdog.log || echo "watchdog never fired"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Line coverage"
            echo ""
            echo '```'
            tail -30 coverage-summary.txt 2>/dev/null || echo "(coverage summary not produced)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
