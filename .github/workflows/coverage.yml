name: Coverage

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or branch to measure. Defaults to the triggering ref."
        type: string
        required: false
  # Coverage is a measurement, not a gate, and not a required check: the
  # release PR waits on CI, Quality and Supply Chain alone. The push to `main`
  # produces the published number for the released commit; the push to `next`
  # is the erosion signal, and the ratchet below reads each branch's own last
  # successful run back as its baseline.
  push:
    branches: [main, next]

concurrency:
  # A `main` run measures a released commit and is never discarded, so every
  # `main` SHA gets a bucket of its own. On `next` the bucket is the branch and
  # nothing in progress is cancelled: the running measurement always finishes
  # and advances the ratchet baseline, and of the pushes that land meanwhile
  # only the newest waits (GitHub replaces a pending run in the same group with
  # the next one). That bounds `next` to one running plus one queued run, and
  # the baseline advances every run instead of never — cancel-in-progress
  # discarded 46 of 59 runs, so the ratchet had almost nothing to compare.
  group: coverage-${{ github.event_name }}-${{ inputs.ref || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  # The ratchet step downloads the previous successful run's coverage artifact.
  actions: read

env:
  # Why: transient TLS resets from static.rust-lang.org and crates.io fail a run
  # on infrastructure rather than on the code. rustup and cargo both retry when
  # told to; they do not by default.
  RUSTUP_MAX_RETRIES: "10"
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  # Continuous mode (%c) must be baked in at build time via the counter
  # relocation flag. Setting RUSTFLAGS replaces the test workspace's
  # target.<triple>.rustflags, which drops `-fuse-ld=mold`: mold strips the
  # profile-runtime constructors and the binaries would write no profraw. This
  # is also why cargo-llvm-cov (which merges target rustflags back in) is not
  # used on Linux.
  RUSTFLAGS: "-C instrument-coverage -C llvm-args=--runtime-counter-relocation"
  # Coverage needs line mapping, not full debuginfo. Incremental artifacts are
  # neither cacheable by sccache nor useful on a one-shot runner.
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  CARGO_INCREMENTAL: "0"
  # sccache keys every object on the full rustc argument list, RUSTFLAGS
  # included, so an instrumented object is only ever served to an instrumented
  # build and never to CI's uninstrumented one (or the reverse). The old
  # "sccache returns uninstrumented rlibs" failure was a wrapper that bypassed
  # the flags, not a key collision. The build jobs below verify the result
  # rather than trusting it: every shard must produce profraw, and the merge
  # job refuses to render a number unless every shard's profile arrived.
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  # The runner's second disk at /mnt has ~65GB; the instrumented target tree
  # does not fit the root disk. Every job uses the same absolute path, so the
  # binaries metadata recorded at build time resolves unchanged on the shard
  # and merge runners once the archive is unpacked there.
  CARGO_TARGET_DIR: /mnt/coverage-target
  # Process-entry files with no in-process seam: twelve CLI ones (serve, deploy
  # orchestrator/artifacts, tenant create cloud, setup
  # docker/docker_database/docker_compose, tenant docker container, backup
  # client/mod, plugins run, agents run), three domain supervisors (a2a_server
  # standalone, mcp orchestrator daemon, agent orchestration daemon) and one
  # bridge one (update install linux, which replaces the running executable).
  # A file qualifies only if it cannot execute in-process at all: merely
  # lacking a test is not enough, which is why the interactive dialoguer paths
  # stay in the denominator. Listed file-by-file so testable siblings
  # (a2a_server/server.rs, backup/extract.rs, policy/audit.rs) still count.
  # Mirrors the justfile `coverage` recipe — keep both in sync.
  COVERAGE_IGNORE_REGEX: '(\.cargo|rustc|crates/tests|/debug/build/[^/]+/out/|/home/runner/\.cargo|crates/domain/(agent/src/services/(a2a_server/standalone|agent_orchestration/orchestrator/daemon)|mcp/src/services/orchestrator/daemon)\.rs|crates/entry/cli/src/commands/(infrastructure/services/serve|cloud/deploy/pipeline/(orchestrator|artifacts)|cloud/tenant/create/cloud|admin/setup/docker(_database|_compose)?|cloud/tenant/docker/container|cloud/backup/(client|mod)|plugins/run|admin/agents/run)\.rs|bin/bridge/src/update/install/linux\.rs)'

jobs:
  # The instrumented test workspace, compiled once and packed as a nextest
  # archive; the shards fan out over it and compile nothing.
  build-tests:
    name: Build instrumented test archive
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      groups: ${{ steps.groups.outputs.json }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGPASSWORD: test
      ADMIN_URL: postgres://test:test@localhost:5432/postgres
      DATABASE_URL: postgres://test:test@localhost:5432/cov_build
      # Build scripts and the migrator are instrumented too; their counters
      # are not part of the measurement.
      LLVM_PROFILE_FILE: /mnt/discard/%m%c.profraw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      # The matrix is read from scripts/test-shard.sh, the single source of
      # truth for the shard set, so coverage cannot drift from CI's shards.
      - name: Shard groups
        id: groups
        run: |
          json=$(bash scripts/test-shard.sh --list | jq -Rc 'split(" ") | map(select(length > 0))')
          test "$(jq length <<<"$json")" -gt 0
          echo "json=$json" >> "$GITHUB_OUTPUT"
          echo "shards: $json"

      - name: Prepare /mnt and swap
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY"
          sudo mkdir -p /mnt/coverage-target /mnt/discard /mnt/out
          sudo chown -R "$USER" /mnt/coverage-target /mnt/discard /mnt/out
          # Why: a hosted runner drops its agent connection rather than
          # OOM-killing a linker when RAM runs out; swap turns a parallel
          # codegen peak into a slow link.
          sudo fallocate -l 16G /mnt/coverage-swap
          sudo chmod 600 /mnt/coverage-swap
          sudo mkswap /mnt/coverage-swap >/dev/null
          sudo swapon /mnt/coverage-swap
          echo "cores: $(nproc)"; free -h; df -h / /mnt

      - name: Install libdbus (bridge test bins link keyring -> dbus)
        timeout-minutes: 12
        run: bash scripts/ci-install-system-deps.sh libdbus-1-dev pkg-config

      - run: rustup show
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest@0.9.146

      # Built in debug with the same flags as the archive, so its whole
      # dependency graph is shared with the test build instead of compiled a
      # second time under --release. Against the committed .sqlx cache: the
      # schema it is about to create does not exist yet.
      - name: Build the test-database migrate tool
        run: |
          cargo build --manifest-path crates/tests/Cargo.toml -p systemprompt-test-migrate
          test -x /mnt/coverage-target/debug/systemprompt-test-migrate

      - name: Migrate the build database
        run: |
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE cov_build;'
          /mnt/coverage-target/debug/systemprompt-test-migrate

      # The test workspace ships no .sqlx cache, so its query! macros validate
      # against the database migrated above.
      - name: Build and archive the instrumented test workspace
        env:
          SQLX_OFFLINE: "false"
        run: |
          cargo nextest archive --manifest-path crates/tests/Cargo.toml \
            --workspace --lib --bins --tests \
            --archive-file /mnt/out/tests.tar.zst
          cargo metadata --manifest-path crates/tests/Cargo.toml --format-version 1 \
            > /mnt/out/cargo-metadata.json
          cargo nextest list --manifest-path crates/tests/Cargo.toml \
            --workspace --lib --bins --tests --list-type binaries-only \
            --message-format json > /mnt/out/binaries.json
          cp /mnt/coverage-target/debug/systemprompt-test-migrate /mnt/out/
          ls -lh /mnt/out; df -h / /mnt

      - run: sccache --show-stats

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-tests
          path: /mnt/out/
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  # The two binaries the subprocess suites spawn. Neither is in the test
  # workspace (entry/cli is a main-workspace crate, bin/bridge its own
  # workspace), so they build on a runner of their own, alongside the archive.
  build-bins:
    name: Build instrumented systemprompt + bridge
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LLVM_PROFILE_FILE: /mnt/discard/%m%c.profraw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Prepare /mnt
        run: |
          sudo mkdir -p /mnt/coverage-target /mnt/discard /mnt/out
          sudo chown -R "$USER" /mnt/coverage-target /mnt/discard /mnt/out
          echo "cores: $(nproc)"; free -h; df -h / /mnt
      - name: Install libdbus (the bridge links keyring -> dbus)
        timeout-minutes: 12
        run: bash scripts/ci-install-system-deps.sh libdbus-1-dev pkg-config
      - run: rustup show
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      # The black-box bridge suite spawns SP_BRIDGE_BIN and skips silently when
      # it is absent; without this binary those tests never ran and
      # bin/bridge/src/cli measured 66%.
      - name: Build
        run: |
          cargo build -p systemprompt-cli --bin systemprompt
          cargo build --manifest-path bin/bridge/Cargo.toml --bin systemprompt-bridge
          cp /mnt/coverage-target/debug/systemprompt /mnt/coverage-target/debug/systemprompt-bridge /mnt/out/
          ls -lh /mnt/out
      - run: sccache --show-stats
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-bins
          path: /mnt/out/
          retention-days: 2
          if-no-files-found: error

  # One fresh, freshly-migrated database per shard, exactly as ci.yml's shard
  # matrix and `just test-shard` run them. One database for the whole suite was
  # not a measurement: a user-privacy mutation first delivers the global
  # pending reporting backlog, bounded at 10 000 rows (reporting_privacy.sql, a
  # deliberate fail-closed limit), so after ~20k tests the backlog exceeded the
  # bound and every later user mutation was refused (54000).
  shard:
    name: Coverage shard (${{ matrix.group }})
    needs: [build-tests, build-bins]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.build-tests.outputs.groups) }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGPASSWORD: test
      ADMIN_URL: postgres://test:test@localhost:5432/postgres
      DATABASE_URL: postgres://test:test@localhost:5432/cov_shard
      SYSTEMPROMPT_BIN: /mnt/coverage-target/debug/systemprompt
      SP_BRIDGE_BIN: /mnt/coverage-target/debug/systemprompt-bridge
      COVERAGE_BINARIES_METADATA: /mnt/dl/binaries.json
      COVERAGE_CARGO_METADATA: /mnt/dl/cargo-metadata.json
      NEXTEST_PROFILE: coverage
      # Test tempdirs (generator sites, CLI subprocess fixtures) otherwise
      # accumulate on the root disk.
      TMPDIR: /mnt/tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Prepare /mnt
        run: |
          sudo mkdir -p /mnt/dl /mnt/bins /mnt/coverage-target /mnt/profraw /mnt/discard /mnt/tmp /mnt/out
          sudo chown -R "$USER" /mnt/dl /mnt/bins /mnt/coverage-target /mnt/profraw /mnt/discard /mnt/tmp /mnt/out
      # Toolchain for llvm-profdata and the shard script's `cargo metadata`;
      # nothing is compiled here.
      - run: rustup show
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest@0.9.146
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-tests
          path: /mnt/dl
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-bins
          path: /mnt/bins
      # Unpacked at the build job's target path, so the recorded binaries
      # metadata resolves as-is and the shard script's metadata-reuse path runs
      # the archive without invoking cargo build.
      - name: Unpack the archive
        run: bash scripts/coverage-unpack.sh /mnt/dl /mnt/bins /mnt/coverage-target

      - name: Run shard
        id: run
        env:
          LLVM_PROFILE_FILE: /mnt/profraw/%m%c.profraw
        run: |
          group="${{ matrix.group }}"
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE cov_shard;'
          LLVM_PROFILE_FILE=/mnt/discard/%m%c.profraw /mnt/dl/systemprompt-test-migrate
          # The database dies with the runner, so durability buys nothing.
          psql "$DATABASE_URL" -c 'ALTER DATABASE cov_shard SET synchronous_commit = off;'
          # Why: see ci.yml — keep port-0 binds out of the bridge proxy candidates.
          sudo sysctl -w net.ipv4.ip_local_reserved_ports=48217-48226

          FALLBACK_PROFILE_ARCHIVE=$(mktemp -d /mnt/tmp/preexisting-fallback.XXXXXX)
          bash scripts/quarantine-fallback-profraw.sh \
            "$GITHUB_WORKSPACE/crates/tests" "$FALLBACK_PROFILE_ARCHIVE" \
            "$GITHUB_WORKSPACE/crates/tests/target" /mnt/coverage-target
          FALLBACK_PROFILE_MARKER=/mnt/tmp/coverage-profile-run-start
          touch "$FALLBACK_PROFILE_MARKER"

          target_args=(--bins --tests)
          if [ "$group" = integration-cli ]; then
            target_args=(--bins)
          fi
          set +e
          bash scripts/test-shard.sh "$group" "${target_args[@]}" --no-fail-fast
          status=$?
          set -e

          collected=$(bash scripts/collect-fallback-profraw.sh \
            "$GITHUB_WORKSPACE/crates/tests" "$FALLBACK_PROFILE_MARKER" /mnt/profraw \
            "$GITHUB_WORKSPACE/crates/tests/target" /mnt/coverage-target)
          echo "collected fallback profraw count: $collected"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          df -h / /mnt

          # 0 = passed, 100 = tests ran and some failed: the counters are still
          # a complete record of what ran. Anything else means the shard did
          # not run to completion and its profile would understate a layer.
          case "$status" in
            0) ;;
            100) echo "::error::shard $group has failing tests" ;;
            *) echo "::error::shard $group did not run to completion (nextest exit $status)"; exit 1 ;;
          esac

          count=$(find /mnt/profraw -name '*.profraw' | wc -l)
          echo "profraw count: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::shard $group produced no profraw: the archive is not instrumented"
            exit 1
          fi
          LLVM_PROFDATA="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-profdata"
          find /mnt/profraw -name '*.profraw' > /mnt/tmp/profraw-list.txt
          "$LLVM_PROFDATA" merge -sparse -f /mnt/tmp/profraw-list.txt -o "/mnt/out/$group.profdata"
          ls -lh /mnt/out

      # Uploaded whenever the shard ran to completion, failing tests or not:
      # the merge job renders the number either way, and a missing profile is
      # how it knows a shard did not run.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && (steps.run.outputs.status == '0' || steps.run.outputs.status == '100') }}
        with:
          name: coverage-profile-${{ matrix.group }}
          path: /mnt/out/${{ matrix.group }}.profdata
          retention-days: 2
          if-no-files-found: error

      - name: Fail on failing tests
        if: ${{ steps.run.outputs.status == '100' }}
        run: exit 1

  report:
    name: Line coverage (cargo-llvm-cov)
    needs: [build-tests, build-bins, shard]
    if: ${{ always() && needs.build-tests.result == 'success' && needs.build-bins.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Prepare /mnt
        run: |
          sudo mkdir -p /mnt/dl /mnt/bins /mnt/coverage-target /mnt/profiles
          sudo chown -R "$USER" /mnt/dl /mnt/bins /mnt/coverage-target /mnt/profiles
      - run: rustup show
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-profile-*
          path: /mnt/profiles
          merge-multiple: true

      # A number is only a measurement when every shard's profile is in it: a
      # shard that failed to run would render a total missing a whole layer,
      # and Codecov would record it as the branch number. Render, ratchet and
      # upload all key off this.
      - name: Every shard reported
        id: complete
        run: |
          instrumented=true
          for group in $(bash scripts/test-shard.sh --list); do
            if [ ! -s "/mnt/profiles/$group.profdata" ]; then
              echo "::error::no profile from shard $group"
              instrumented=false
            fi
          done
          echo "instrumented=$instrumented" >> "$GITHUB_OUTPUT"
          test "$instrumented" = true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-tests
          path: /mnt/dl
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-bins
          path: /mnt/bins
      - name: Unpack the archive
        run: bash scripts/coverage-unpack.sh /mnt/dl /mnt/bins /mnt/coverage-target

      - name: Merge profdata and render
        run: |
          LLVM_PROFDATA="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-profdata"
          LLVM_COV="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-cov"
          "$LLVM_PROFDATA" merge -sparse /mnt/profiles/*.profdata -o coverage-merged.profdata

          BINS=$(jq -r '."rust-binaries"[]."binary-path"' /mnt/dl/binaries.json | sort -u)
          BINS="$BINS /mnt/coverage-target/debug/systemprompt /mnt/coverage-target/debug/systemprompt-bridge"
          OBJ_ARGS=()
          for b in $BINS; do
            test -x "$b" || { echo "::error::object $b missing from the unpacked archive"; exit 1; }
            OBJ_ARGS+=(--object "$b")
          done

          "$LLVM_COV" report --instr-profile=coverage-merged.profdata "${OBJ_ARGS[@]}" \
            --ignore-filename-regex="$COVERAGE_IGNORE_REGEX" --summary-only \
            | tee coverage-summary.txt
          "$LLVM_COV" export --instr-profile=coverage-merged.profdata "${OBJ_ARGS[@]}" \
            --ignore-filename-regex="$COVERAGE_IGNORE_REGEX" --format=text --summary-only \
            > coverage-summary.json
          "$LLVM_COV" export --instr-profile=coverage-merged.profdata "${OBJ_ARGS[@]}" \
            --ignore-filename-regex="$COVERAGE_IGNORE_REGEX" --format=lcov \
            > lcov.info

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: |
            coverage-summary.txt
            coverage-summary.json
            lcov.info

      # Two independent guards. The FLOOR is absolute and always evaluated:
      # without it, coverage could erode indefinitely in sub-0.5pt steps and the
      # relative check would pass every single time. The RATCHET catches a sharp
      # single-run drop that still lands above the floor, and is skipped when
      # there is no previous artifact to compare against — which is exactly why
      # the floor must not live behind that same early exit.
      #
      # The ratchet compares against the last *successful* run, so a run that
      # fails cannot advance the baseline: one red run leaves every later run
      # comparing against an ever-older number until the accumulated drift of
      # many commits trips a threshold meant for one. Past MAX_BASELINE_AGE_DAYS
      # the comparison is therefore abandoned rather than made loosely, and the
      # floor carries the run alone.
      #
      # Every path that declines to compare says so as a ::warning:: — a
      # floor-only run must be visibly floor-only, because a silently skipped
      # ratchet looks exactly like a passing one.
      #
      # Raise COVERAGE_FLOOR as coverage climbs; keep it in step with
      # codecov.yml's `project.default.target`.
      - name: Coverage floor and ratchet
        id: ratchet
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          COVERAGE_FLOOR: "91.5"
          MAX_BASELINE_AGE_DAYS: "10"
        run: |
          # Baseline against the branch this run is measuring: run-to-run on
          # `next` catches a regression while the code is still being written;
          # the `main` push measures against `main`.
          BASELINE_BRANCH="main"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "next" ]; then
            BASELINE_BRANCH="next"
          fi
          echo "baseline branch: $BASELINE_BRANCH"
          PREV=$(gh run list --workflow coverage.yml --status success \
            --branch "$BASELINE_BRANCH" --limit 1 --json databaseId,createdAt \
            --jq '.[0] | "\(.databaseId) \(.createdAt)"' \
            -R "${{ github.repository }}")
          PREV_ID="${PREV%% *}"
          PREV_CREATED="${PREV#* }"
          # Exported into this shell, not $GITHUB_ENV: GITHUB_ENV only reaches
          # LATER steps, and the python below runs in this one.
          export COVERAGE_PREV_CREATED=""
          if [ -n "$PREV_ID" ] && [ "$PREV_ID" != "null" ]; then
            echo "baseline: run $PREV_ID from $PREV_CREATED"
            export COVERAGE_PREV_CREATED="$PREV_CREATED"
            gh run download "$PREV_ID" -n coverage -D prev-coverage \
              -R "${{ github.repository }}" \
              || echo "::warning::ratchet skipped: run $PREV_ID has no coverage artifact (expired?); the floor is the only guard on this run"
          else
            echo "::warning::ratchet skipped: no previous successful coverage run to compare against; the floor is the only guard on this run"
          fi
          python3 - <<'PY'
          import datetime as dt, json, os, pathlib, sys

          def pct(path):
              with open(path) as f:
                  return json.load(f)["data"][0]["totals"]["lines"]["percent"]

          def warn(message):
              print(f"::warning::{message}")

          floor = float(os.environ["COVERAGE_FLOOR"])
          max_age = float(os.environ["MAX_BASELINE_AGE_DAYS"])
          cur = pct("coverage-summary.json")
          failures = []

          print(f"current: {cur:.2f}%  floor: {floor:.2f}%")
          if cur < floor:
              failures.append(f"line coverage {cur:.2f}% is below the {floor:.2f}% floor")

          prev_path = pathlib.Path("prev-coverage/coverage-summary.json")
          created = os.environ.get("COVERAGE_PREV_CREATED", "")
          age_days = None
          if created:
              stamp = dt.datetime.fromisoformat(created.replace("Z", "+00:00"))
              age_days = (dt.datetime.now(dt.timezone.utc) - stamp).total_seconds() / 86400

          if not prev_path.exists():
              warn("ratchet skipped: no baseline summary was downloaded; the floor is the only guard on this run")
          elif age_days is not None and age_days > max_age:
              warn(
                  f"ratchet skipped: the newest successful coverage run is {age_days:.1f} days old "
                  f"(limit {max_age:.0f}); a gap that long measures accumulated drift across many "
                  f"commits, not a regression. The floor is the only guard on this run — fix the "
                  f"cause of the failing runs so the baseline can advance."
              )
              print(f"previous: {pct(prev_path):.2f}%  (not compared)")
          else:
              prev = pct(prev_path)
              age = f"{age_days:.1f}d old" if age_days is not None else "age unknown"
              print(f"previous: {prev:.2f}%  ({age})  delta: {cur - prev:+.2f}pt")
              if cur < prev - 0.5:
                  failures.append(
                      f"line coverage dropped more than 0.5pt ({prev:.2f}% -> {cur:.2f}%)"
                  )

          if failures:
              sys.exit("; ".join(failures))
          PY

      # Uploaded whether or not the floor or ratchet tripped: the number is a
      # complete measurement either way (the step above already guarantees
      # every shard is in it), and Codecov should show the erosion it flagged.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: lcov.info
          fail_ci_if_error: false
          use_oidc: true

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Line coverage"
            echo ""
            echo '```'
            tail -30 coverage-summary.txt 2>/dev/null || echo "(coverage summary not produced)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Floor or ratchet tripped
        if: ${{ steps.ratchet.outcome == 'failure' }}
        run: |
          echo "::error::coverage floor or ratchet failed; see the 'Coverage floor and ratchet' step"
          exit 1
