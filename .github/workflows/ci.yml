name: CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or branch to gate. Defaults to the triggering ref."
        type: string
        required: false
  pull_request:
    branches: [main, next]
  push:
    branches: [next]

concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  # Why: transient TLS resets from static.rust-lang.org and crates.io fail a run
  # on infrastructure rather than on the code. rustup and cargo both retry when
  # told to; they do not by default.
  RUSTUP_MAX_RETRIES: "10"
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always
  # One flag set for every compiling job here and in quality.yml and
  # schema-ladder.yml, so they hash to the same sccache objects. Warnings are
  # denied by Quality's clippy (`-D warnings`) and rustdoc, not by RUSTFLAGS.
  RUSTFLAGS: ""
  CARGO_PROFILE_DEV_DEBUG: "0"
  SQLX_OFFLINE: "true"
  # Every Rust job compiles through sccache with the GitHub Actions cache as
  # its backend. Objects are content-hashed, so a lockfile bump invalidates
  # only the crates that changed and one cache serves every job. Incremental
  # artifacts are not cacheable, so they are off.
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - run: rustup show
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # `just format-check` covers all three workspaces (root, crates/tests,
      # bin/bridge); a bare root `cargo fmt` leaves the bridge unchecked.
      - run: just format-check

  # SQLX_OFFLINE is set workflow-wide, so this build is also the check that
  # every query macro resolves against the committed per-crate .sqlx caches.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - run: rustup show
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - run: cargo build --workspace --locked
      - run: sccache --show-stats

  # Core builds with no third-party document engine: the files domain and
  # its live-session routes compile without loro, a formula or a PDF crate,
  # and sessions then answer `collab_engine_unavailable`.
  build-no-engine:
    name: Build (no document engine)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - run: rustup show
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - run: cargo build -p systemprompt --no-default-features --features files-office,files-collab,api --locked
      - name: No engine crate in the graph
        run: |
          if cargo tree -p systemprompt --no-default-features --features files-office,files-collab,api -e normal --prefix none \
              | grep -E '^(loro|systemprompt-engine-)' ; then
            echo "::error::a document engine is linked without its engine-* feature"; exit 1
          fi
      - run: scripts/check-no-vendor.sh

  # The schema migrator alone, so the schema ladder starts on it without
  # waiting for the full test archive.
  migrator:
    name: Test migrator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - run: rustup show
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - name: Build migrator
        run: |
          cargo build --manifest-path crates/tests/Cargo.toml -p systemprompt-test-migrate --locked
          tests_target=$(cargo metadata --manifest-path crates/tests/Cargo.toml --no-deps --format-version 1 | jq -r .target_directory)
          mkdir -p test-migrator
          cp "$tests_target/debug/systemprompt-test-migrate" test-migrator/
      - run: sccache --show-stats
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-migrator
          path: test-migrator/
          retention-days: 1
          if-no-files-found: error

  # Everything the shards run, compiled once: the test workspace as a nextest
  # archive (scripts/test-shard.sh --archive, the union of every shard's
  # packages), the schema migrator, and the `systemprompt` and bridge binaries
  # the subprocess fixtures spawn. The test workspace has no committed .sqlx cache, so its query macros check
  # against this job's own freshly migrated database.
  test-tools:
    name: Test tools (prebuilt)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - name: Free runner disk (the whole test workspace target overflows the default ~14GB)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell \
            /usr/local/lib/node_modules "$AGENT_TOOLSDIRECTORY"
          df -h /
      - name: Install system dependencies
        timeout-minutes: 12
        run: bash scripts/ci-install-system-deps.sh libdbus-1-dev pkg-config
      - run: rustup show
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.146
      - name: Build migrator, CLI and bridge
        run: |
          cargo build --manifest-path crates/tests/Cargo.toml -p systemprompt-test-migrate --locked
          cargo build -p systemprompt-cli --bin systemprompt --locked
          cargo build --manifest-path bin/bridge/Cargo.toml --bin systemprompt-bridge --locked
          tests_target=$(cargo metadata --manifest-path crates/tests/Cargo.toml --no-deps --format-version 1 | jq -r .target_directory)
          bridge_target=$(cargo metadata --manifest-path bin/bridge/Cargo.toml --no-deps --format-version 1 | jq -r .target_directory)
          mkdir -p test-tools
          cp "$tests_target/debug/systemprompt-test-migrate" target/debug/systemprompt \
             "$bridge_target/debug/systemprompt-bridge" test-tools/
      - name: Migrate the sqlx check database
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test
        run: ./test-tools/systemprompt-test-migrate
      - name: Archive the test workspace
        timeout-minutes: 60
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test
          SQLX_OFFLINE: "false"
        run: |
          bash scripts/test-shard.sh --archive test-tools/tests.tar.zst --locked
          ls -lh test-tools/
          df -h /
      - name: Report test lockfile drift
        if: always()
        run: git diff --exit-code -- crates/tests/Cargo.lock
      - run: sccache --show-stats
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-tools
          path: test-tools/
          retention-days: 1
          if-no-files-found: error
          # The archive is already zstd; recompressing it only costs time.
          compression-level: 0

  test:
    # The test workspace runs sharded by test-workspace path prefix, every
    # shard from the one archive `test-tools` built, so a shard is a download,
    # a fresh migrated database and its tests. Tests run under cargo-nextest
    # with a per-test timeout, so a hung or leaking test fails fast and is
    # named instead of starving the runner. The step-level `timeout-minutes`
    # on "Run shard" is the backstop for the tests themselves; the job-level
    # one is wider so a slow post-step can never turn a passed shard into
    # "cancelled" (it did, on 0.51.0).
    name: Test (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test-tools
    strategy:
      fail-fast: false
      matrix:
        # Group names only; the group→prefix mapping, package filter, and
        # nextest invocation live in scripts/test-shard.sh so CI and the local
        # `just test-shard` recipes share one source of truth.
        group: [shared, infra, domain, app-runtime, app-scheduler, app-agent-runs, app-generator, app-oauth-issuance, entry-api, entry-cli, bridge, integration-api, integration-cli, integration-rest-1, integration-rest-2, edge]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}

      - name: Runner resources
        run: |
          echo "cores: $(nproc)"; free -h; df -h /

      # Why: test-shard.sh reads the package list with `cargo metadata`, which
      # needs the pinned toolchain; nothing in this job compiles.
      - run: rustup show
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.146
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-tools
          path: test-tools/
      - run: chmod +x test-tools/systemprompt test-tools/systemprompt-bridge test-tools/systemprompt-test-migrate

      - name: Migrate test database
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test
        run: |
          ./test-tools/systemprompt-test-migrate
          # This database dies with the runner, so durability buys nothing and
          # the per-commit flush is pure latency across ~1000 DB-backed tests.
          # Transaction atomicity is unchanged — the batch_atomicity and
          # advisory_lock suites still assert exactly what they assert.
          psql "$DATABASE_URL" -c 'ALTER DATABASE test SET synchronous_commit = off;'

      # Why: Linux hands out ephemeral ports from 32768-60999, which covers the
      # bridge's proxy candidate range (48217-48226). Any test binding port 0 can
      # land there and break the bridge tests that must hold the default port.
      # Reserved ports are skipped by automatic assignment; explicit binds work.
      - name: Reserve the bridge proxy candidate ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=48217-48226

      - name: Run shard
        timeout-minutes: 25
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test
          NEXTEST_PROFILE: ci
          NEXTEST_ARCHIVE_FILE: ${{ github.workspace }}/test-tools/tests.tar.zst
          SYSTEMPROMPT_BIN: ${{ github.workspace }}/test-tools/systemprompt
          SP_BRIDGE_BIN: ${{ github.workspace }}/test-tools/systemprompt-bridge
        run: |
          mkdir -p "$RUNNER_TEMP/nextest"
          bash scripts/test-shard.sh "${{ matrix.group }}" \
              --extract-to "$RUNNER_TEMP/nextest" --extract-overwrite

      # The ci profile retries a failed test once. A retry that passes is a
      # flake, not a pass: every one is surfaced here as an annotation.
      - name: Report flaky tests
        if: ${{ !cancelled() }}
        run: |
          junit=$(find "$RUNNER_TEMP/nextest" -path '*/nextest/ci/junit.xml' -print -quit 2>/dev/null || true)
          [ -n "$junit" ] || { echo "no junit report"; exit 0; }
          python3 - "$junit" <<'PY'
          import sys, xml.etree.ElementTree as ET
          flaky = [
              f"{case.get('classname')}::{case.get('name')}"
              for case in ET.parse(sys.argv[1]).iter("testcase")
              if case.find("flakyFailure") is not None or case.find("flakyError") is not None
          ]
          for name in flaky:
              print(f"::warning title=Flaky test (${{ matrix.group }})::{name} failed, then passed on retry")
          print(f"{len(flaky)} flaky test(s)")
          PY

  # A database left by each of the two newest releases, upgraded by this tree,
  # must match a fresh install. Only this sees a migration that misbehaves on
  # an established database (0.59.0's events 007 passed everything else).
  schema-ladder:
    name: Schema ladder
    needs: migrator
    uses: ./.github/workflows/schema-ladder.yml
    with:
      ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      migrator-artifact: test-migrator

  # The `main` ruleset's required context: it fails unless every gate above
  # succeeded, so a skipped or cancelled matrix job can never pass as "not
  # failed". Required checks name this job, never the matrix entries. Only the
  # pull_request run posts `CI passed`; the push run posts `CI passed (push)`,
  # so a green push run on the same SHA cannot satisfy the release PR before
  # the PR's own run starts.
  ci-passed:
    name: ${{ github.event_name == 'pull_request' && 'CI passed' || 'CI passed (push)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [fmt, build, build-no-engine, migrator, test-tools, test, schema-ladder]
    if: always()
    steps:
      - run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success")' >/dev/null \
            || { echo "::error::a required CI job did not succeed"; echo '${{ toJSON(needs) }}' | jq '.'; exit 1; }
