version: 2
updates:
  # Workflow actions are SHA-pinned with a version comment; Dependabot moves
  # the SHA and the comment together. One grouped PR a week against `next`,
  # where every push runs the gates.
  - package-ecosystem: github-actions
    directory: /
    target-branch: next
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
